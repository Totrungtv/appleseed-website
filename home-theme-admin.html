<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Seed — Kho 30 giao diện</title><link rel="stylesheet" href="home-themes.css"><style>body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#17233d}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #17233d0b}.preview{height:155px;padding:24px;background:var(--as-theme-bg);color:var(--as-theme-text);position:relative;overflow:hidden}.preview:before{content:'APPLE SEED';font-size:24px;font-weight:950;letter-spacing:-.04em}.preview:after{content:'Premium Repair  •  Technology  •  Trust';position:absolute;left:24px;bottom:28px;color:var(--as-theme-muted)}.meta{padding:16px}.meta b{font-size:18px;display:block}.meta small{display:block;color:#64748b;margin-top:5px;min-height:36px}.btn{margin-top:12px;border:0;border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer;background:#1769ff;color:#fff}.pill{font-size:12px;font-weight:800;color:#1769ff}</style><div class="wrap"><div class="top"><div><h1>🎨 Kho 30 giao diện Trang chủ</h1><p>Chọn giao diện mới mà không xóa dữ liệu nội dung hiện tại.</p></div><a class="btn" href="site-builder.html">← Site Builder</a></div><div class="grid" id="grid"></div></div><script>fetch('home-themes.json').then(r=>r.json()).then(d=>{grid.innerHTML=d.themes.map(t=>'<article class="card"><div class="preview" data-theme="'+t.id+'"></div><div class="meta"><span class="pill">'+t.group+'</span><b>'+t.name+'</b><small>'+t.description+'</small><button class="btn" data-id="'+t.id+'">👁 Xem trước</button></div></article>').join('');document.querySelectorAll('.preview').forEach(x=>{x.setAttribute('data-theme-preview','1');x.style.setProperty('--as-theme-accent','#1769ff')});document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{location.href='index.html?themePreview='+encodeURIComponent(b.dataset.id)})})</script>
