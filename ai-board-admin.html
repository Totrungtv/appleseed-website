<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Seed — AI Board Control Center</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><style>
:root{--blue:#2563eb;--bg:#f6f8fb;--line:#e4e7ec;--text:#101828;--muted:#667085}body{background:var(--bg);color:var(--text)}.wrap{max-width:1280px;margin:auto;padding:24px 16px 70px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:26px}.top p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:#b42318;border-color:#fecdca}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.tab.active{background:#eff6ff;border-color:#93c5fd;color:#175cd3}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px rgba(16,24,40,.04)}.panel h2{margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.status{padding:11px 13px;border-radius:10px;background:#eff8ff;color:#175cd3;margin-bottom:14px}.status.err{background:#fef3f2;color:#b42318}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.row-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.row h3{margin:0 0 5px;font-size:15px}.row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.form{display:grid;gap:11px;background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{font-size:13px;font-weight:800;display:block;margin-bottom:5px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #d0d5dd;border-radius:9px;padding:10px 11px;background:#fff;font:inherit}textarea{min-height:110px;resize:vertical}.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}.check input{width:auto}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#eff6ff;color:#175cd3;font-size:11px;font-weight:900}.badge.off{background:#f2f4f7;color:#667085}.danger-text{color:#b42318}.login{max-width:430px;margin:80px auto}.hidden{display:none!important}.file-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 0;border-bottom:1px solid #eef2f6;align-items:center}.file-row:last-child{border-bottom:0}.file-name{font-weight:800;overflow:hidden;text-overflow:ellipsis}.section-card{border:1px solid var(--line);border-radius:13px;padding:14px}.section-card textarea{min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:12px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--muted)}@media(max-width:850px){.grid,.formgrid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="login" class="login panel"><h1>🔐 AI Board Admin</h1><p class="muted">Khu vực quản trị riêng cho Admin / Staff.</p><div class="form"><div><label>Email</label><input id="email" type="email" autocomplete="username"></div><div><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">Đăng nhập</button><div id="loginMsg" class="muted"></div></div></div>
