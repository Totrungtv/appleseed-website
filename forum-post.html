<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Seed • Đăng bài</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#eef6ff;color:#10233f}.wrap{max-width:900px;margin:auto;padding:28px 18px 50px}.card{background:#fff;border:1px solid #d5e5f5;border-radius:20px;padding:24px;box-shadow:0 18px 50px #1e50821a}.k{font-size:10px;letter-spacing:.2em;font-weight:900;color:#6b83a0}.title{font-size:27px;margin:5px 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.input,.area,.select{width:100%;border:1px solid #cfe0f2;border-radius:11px;padding:12px 13px;background:#f8fbff;font:inherit;color:inherit}.area{min-height:220px;resize:vertical}.btns{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#1979ea;color:white}.secondary{background:#eaf4ff;color:#155b9e}.msg{margin-top:12px;padding:12px;border-radius:11px;background:#f3f8fd;font-size:13px;display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="card"><div class="k">APPLE SEED • TECHNICIAN COMMUNITY</div><div class="title">✍️ Đăng bài chia sẻ</div><div style="color:#647b98;font-size:13px;line-height:1.55">Đăng ca sửa chữa thực tế, chia sẻ phần mềm/ứng dụng, phần cứng, dụng cụ và kinh nghiệm trong lĩnh vực điện thoại. <b>PANIC có khu riêng, không trộn vào diễn đàn này.</b></div>
<div class="grid"><div class="field"><label>Chuyên mục</label><select id="category" class="select"><option value="repair">🛠️ Ca sửa chữa thực tế</option><option value="software">💻 Phần mềm / Ứng dụng</option><option value="hardware">🔧 Phần cứng / Linh kiện</option><option value="tools">🧰 Dụng cụ / Thiết bị</option><option value="knowledge">📚 Kiến thức kỹ thuật</option><option value="question">❓ Hỏi đáp kỹ thuật</option><option value="sharing">🤝 Chia sẻ kinh nghiệm</option></select></div><div class="field"><label>Nền tảng</label><select id="platform" class="select"><option value="iphone">iPhone</option><option value="ipad">iPad</option><option value="android">Android</option><option value="other">Khác</option></select></div></div>
<div class="field"><label>Tiêu đề</label><input id="title" class="input" maxlength="180" placeholder="Ví dụ: iPhone 13 mất nguồn sau khi thay pin..."></div>
<div class="grid"><div class="field"><label>Model (nếu có)</label><input id="model" class="input" placeholder="iPhone 13 Pro Max"></div><div class="field"><label>Link phần mềm / tài liệu (nếu có)</label><input id="resource" class="input" type="url" placeholder="https://..."></div></div>
<div class="field"><label>Nội dung bài viết</label><textarea id="body" class="area" maxlength="20000" placeholder="Mô tả tình trạng, cách kiểm tra, cách xử lý, kết quả, kinh nghiệm..."></textarea></div>
<div class="field"><label>Ảnh minh họa (URL, nếu có)</label><input id="image" class="input" type="url" placeholder="https://..."></div>
<div class="btns"><a class="btn secondary" href="forum.html">← Quay lại diễn đàn</a><button id="submit" class="btn primary">🚀 Đăng bài</button></div><div id="msg" class="msg"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(()=>{const sb=window.supabaseClient,$=id=>document.getElementById(id),msg=$('msg');function show(t){msg.textContent=t;msg.style.display='block'}
$('submit').onclick=async()=>{if(!sb)return show('Chưa kết nối hệ thống.');const {data:{user}}=await sb.auth.getUser();if(!user)return show('Vui lòng đăng nhập Member trước khi đăng bài.');const title=$('title').value.trim(),body=$('body').value.trim();if(title.length<5)return show('Tiêu đề tối thiểu 5 ký tự.');if(!body)return show('Vui lòng nhập nội dung bài viết.');const r=await sb.from('community_forum_posts').insert({author_id:user.id,category:$('category').value,title,body,model:$('model').value.trim(),platform:$('platform').value,image_url:$('image').value.trim()||null,resource_url:$('resource').value.trim()||null}).select('id').single();if(r.error)return show(r.error.message);location.href='forum.html';};
})();
</script></body></html>
