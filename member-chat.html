async function boot(){const r=await sb.auth.getUser();if(r.error||!r.data.user){$("headState").textContent="Cần đăng nhập Member.";return}me=r.data.user;if(window.matchMedia("(max-width:700px)").matches)$("side").classList.add("mobile");await touch();await Promise.all([membersLoad(),friendLoad()]);await convosLoad();await loadUnreadCounts();setupNotifications();setInterval(async()=>{await touch();await membersLoad();await convosLoad();await loadUnreadCounts()},60000)}

async function direct(id){const known=convos.find(x=>x.type==="direct"&&(x.participants||[]).some(p=>p.user_id===id));if(known){await open(known.id);$("side").classList.remove("mobile");return}const r=await sb.rpc("chat_get_or_create_direct",{p_other_user_id:id});if(r.error){alert("Không mở được chat: "+r.error.message);return}await convosLoad();await open(r.data);$("side").classList.remove("mobile")}

async function loadUnreadCounts(){if(!me||!convos.length){unreadCounts=new Map();updateUnreadUI();return}const pairs=await Promise.all(convos.map(async c=>{const p=(c.participants||[]).find(x=>x.user_id===me.id);let q=sb.from("chat_messages").select("id",{count:"exact",head:true}).eq("conversation_id",c.id).neq("sender_id",me.id);if(p?.last_read_at)q=q.gt("created_at",p.last_read_at);const r=await q;return [c.id,r.error?0:(r.count||0)]}));unreadCounts=new Map(pairs.filter(([,n])=>n>0));updateUnreadUI();renderList()}

function setupNotifications(){if(notificationChannel)return;notificationChannel=sb.channel("chat-notifications-"+me.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages"},async p=>{const m=p.new;if(!m?.id||m.sender_id===me.id)return;const c=convos.find(x=>x.id===m.conversation_id);if(!c){await convosLoad();await loadUnreadCounts();return}if(current?.id===m.conversation_id){appendMessage(m);await markRead(m.conversation_id);return}unreadCounts.set(m.conversation_id,(unreadCounts.get(m.conversation_id)||0)+1);updateUnreadUI();renderList();const sender=member(m.sender_id)?.full_name||"Thành viên";showToast(sender+" vừa gửi tin nhắn");try{if("Notification" in window&&Notification.permission==="granted")new Notification("Apple Seed · Tin nhắn mới",{body:sender+": "+String(m.body||"").slice(0,120)});else if("Notification" in window&&Notification.permission==="default")Notification.requestPermission().catch(()=>{});}catch(_){} }).subscribe();$("notifyToast").onclick=()=>{$("notifyToast").classList.remove("show");if(unreadCounts.size===1){const id=[...unreadCounts.keys()][0];open(id)}}}
async function loadMessages(scroll){if(!current||loadingMessages)return;loadingMessages=true;const r=await sb.from("chat_messages").select("id,sender_id,body,created_at").eq("conversation_id",current.id).order("created_at",{ascending:true}).limit(500);const rows=r.data||[];$("msgs").innerHTML=rows.length?rows.map(m=>{const who=member(m.sender_id)?.full_name||(m.sender_id===me.id?"Bạn":"Thành viên");return '<div class="bubble '+(m.sender_id===me.id?"me":"")+'" data-message-id="'+m.id+'"><div class="who">'+esc(who)+'</div><div>'+esc(m.body).replace(/\n/g,"<br>")+'</div><div class="time">'+new Date(m.created_at).toLocaleString("vi-VN")+'</div></div>'}).join(""):'<div class="empty">Chưa có tin nhắn.</div>';$("msgs").scrollTop=$("msgs").scrollHeight;loadingMessages=false}
