<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Seed · Member Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial;color:#17233d;background:#f3f6fb;height:100vh;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:310px 1fr;background:#fff}.side{border-right:1px solid #e2e8f0;display:flex;flex-direction:column}.head{padding:16px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#66809e;margin-bottom:3px}.new{border:0;background:#1769ff;color:#fff;border-radius:9px;padding:8px 11px;font-size:18px;cursor:pointer}.search{padding:10px 12px}.search input{width:100%;border:1px solid #dbe4ef;border-radius:10px;padding:10px;outline:0}.tabs{display:flex;gap:5px;padding:0 10px 10px}.tab{flex:1;border:1px solid #dbe4ef;background:#fff;border-radius:8px;padding:7px 4px;font-size:11px;font-weight:800;cursor:pointer}.tab.active{background:#eef6ff;border-color:#a9cdf8;color:#1769ff}.list{overflow:auto;padding:0 8px}.item{display:flex;gap:10px;padding:10px;border-radius:11px;cursor:pointer}.item:hover,.item.active{background:#f3f7fb}.avatar{width:38px;height:38px;border-radius:50%;background:#eaf4ff;display:grid;place-items:center;font-weight:900;position:relative;flex:none}.dot{position:absolute;right:-1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:#b8c1cc;border:2px solid #fff}.dot.on{background:#18a464}.meta{min-width:0}.name{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;color:#6b7f97;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{display:flex;flex-direction:column;min-width:0}.chathead{padding:14px 18px;border-bottom:1px solid #e2e8f0;display:flex;gap:10px;align-items:center}.chathead b{font-weight:900}.msgs{flex:1;overflow:auto;padding:20px;background:#f8fafc;display:flex;flex-direction:column;gap:8px}.empty{margin:auto;text-align:center;color:#71839a;line-height:1.6}.bubble{max-width:min(72%,650px);align-self:flex-start;padding:9px 12px;border-radius:14px;background:#fff;border:1px solid #e0e7ef;box-shadow:0 1px 2px #00000008}.bubble.me{align-self:flex-end;background:#eaf4ff;border-color:#c9e0ff}.who{font-size:10px;color:#70839a;margin-bottom:3px}.time{font-size:9px;color:#7b8da2;text-align:right;margin-top:4px}.composer{padding:11px;border-top:1px solid #e2e8f0;display:flex;gap:8px}.composer textarea{flex:1;resize:none;border:1px solid #dbe4ef;border-radius:11px;padding:10px;font:inherit;outline:0}.send{width:48px;border:0;border-radius:11px;background:#1769ff;color:#fff;font-size:18px;font-weight:900;cursor:pointer}.modal{position:fixed;inset:0;background:#17233d66;display:none;place-items:center;padding:18px}.modal.show{display:grid}.box{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.box h2{margin:0 0 12px}.members{border:1px solid #e1e8f0;border-radius:12px;max-height:370px;overflow:auto}.member{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid #eef2f6}.member:last-child{border-bottom:0}.member input{margin-left:auto}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.btn{border:1px solid #dbe4ef;background:#fff;border-radius:9px;padding:9px 13px;font-weight:850;cursor:pointer}.primary{background:#1769ff;color:#fff;border-color:#1769ff}
@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.side.mobile{display:flex;position:fixed;inset:0;width:100%;z-index:5;background:#fff}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="head"><div class="brand"><small>APPLE SEED</small>💬 Member Chat</div><button class="new" id="newChat">＋</button></div><div class="search"><input id="search" placeholder="Tìm thành viên hoặc cuộc chat..."></div><div class="tabs"><button class="tab active" data-tab="chats">💬 Chat</button><button class="tab" data-tab="online">🟢 Online</button><button class="tab" data-tab="offline">⚪ Offline</button></div><div class="list" id="list"></div></aside><main class="chat"><div class="chathead"><div class="avatar" id="headAvatar">💬</div><div><b id="headTitle">Apple Seed Chat</b><div class="sub" id="headState">Chọn cuộc trò chuyện</div></div></div><div class="msgs" id="msgs"><div class="empty"><b>💬 Apple Seed Chat</b><br>Chọn một Member để bắt đầu.<br>Người offline vẫn nhận được tin khi đăng nhập lại.</div></div><form class="composer" id="composer"><textarea id="input" disabled placeholder="Nhập tin nhắn..."></textarea><button class="send" disabled id="send">➤</button></form></main></div><div class="modal" id="modal"><div class="box"><h2>💬 Bắt đầu cuộc trò chuyện</h2><div class="search"><input id="memberSearch" placeholder="Tìm thành viên..."></div><div class="members" id="memberList"></div><div class="actions"><button class="btn" id="cancel">Đóng</button><button class="btn primary" id="makeGroup">Tạo nhóm</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://nuismqcjyutqigdydfkg.supabase.co","sb_publishable_Z3pTEseMEeoiGU9dYJ1NwQ_Ko7li9Sz");const $=x=>document.getElementById(x);
let me=null,members=[],convos=[],current=null,realtime=null,tab="chats";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c])),initials=s=>(String(s||"?").trim().split(/\s+/).slice(-2).map(x=>x[0]).join("").toUpperCase()||"?");
const member=id=>members.find(x=>x.id===id);
const convTitle=c=>{if(c.type==="group")return c.name||"Nhóm Apple Seed";const o=(c.participants||[]).find(p=>p.user_id!==me.id);return member(o?.user_id)?.full_name||"Thành viên"};
async function boot(){const r=await sb.auth.getUser();if(r.error||!r.data.user){$("headState").textContent="Cần đăng nhập Member.";return}me=r.data.user;await touch();await membersLoad();await convosLoad();setInterval(async()=>{await touch();await membersLoad();renderList()},60000);sb.channel("apple-seed-chat-global").on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages"},p=>{if(current?.id===p.new.conversation_id)loadMessages(true);convosLoad()}).subscribe()}
async function touch(){await sb.rpc("chat_touch_presence")}
async function membersLoad(){const r=await sb.rpc("chat_list_members");if(!r.error)members=r.data||[]}
async function convosLoad(){const r=await sb.from("chat_participants").select("conversation_id,user_id,last_read_at").eq("user_id",me.id);const ids=(r.data||[]).map(x=>x.conversation_id);if(!ids.length){convos=[];renderList();return}const c=await sb.from("chat_conversations").select("id,type,name,created_by,created_at,updated_at").in("id",ids).order("updated_at",{ascending:false});const p=await sb.from("chat_participants").select("conversation_id,user_id,last_read_at").in("conversation_id",ids);convos=(c.data||[]).map(x=>({...x,participants:(p.data||[]).filter(y=>y.conversation_id===x.id)}));renderList()}
function renderList(){const q=$("search").value.trim().toLowerCase();let arr=tab==="chats"?convos:members.filter(x=>x.id!==me.id&&(tab==="online"?x.online:!x.online)).map(x=>({type:"member",id:x.id,name:x.full_name,online:x.online}));arr=arr.filter(x=>(tab==="chats"?convTitle(x):x.name||"").toLowerCase().includes(q));$("list").innerHTML=arr.length?arr.map(x=>{if(x.type==="member")return '<div class="item" data-member="'+x.id+'"><div class="avatar">'+esc(initials(x.name))+'<i class="dot '+(x.online?"on":"")+'"></i></div><div class="meta"><div class="name">'+esc(x.name)+'</div><div class="sub">'+(x.online?"Đang online":"Offline")+'</div></div></div>';const t=convTitle(x),o=x.participants?.find(p=>p.user_id!==me.id),m=member(o?.user_id);return '<div class="item '+(current?.id===x.id?"active":"")+'" data-chat="'+x.id+'"><div class="avatar">'+(x.type==="group"?"👥":esc(initials(t)))+(m?'<i class="dot '+(m.online?"on":"")+'"></i>':"")+'</div><div class="meta"><div class="name">'+esc(t)+'</div><div class="sub">'+(x.type==="group"?"Chat nhóm":"Chat riêng")+'</div></div></div>'}).join(""):'<div class="sub" style="padding:15px">Chưa có cuộc trò chuyện.</div>';document.querySelectorAll("[data-chat]").forEach(e=>e.onclick=()=>open(e.dataset.chat));document.querySelectorAll("[data-member]").forEach(e=>e.onclick=()=>direct(e.dataset.member))}
async function direct(id){const r=await sb.rpc("chat_get_or_create_direct",{p_other_user_id:id});if(r.error){alert("Không mở được chat: "+r.error.message);return}await convosLoad();await open(r.data);$("side").classList.remove("mobile")}
async function open(id){current=convos.find(x=>x.id===id);if(!current)return;$("headTitle").textContent=convTitle(current);$("headState").textContent=current.type==="group"?"Nhóm Apple Seed":"Chat riêng";$("input").disabled=false;$("send").disabled=false;await loadMessages(false);if(realtime)await sb.removeChannel(realtime);realtime=sb.channel("chat-room-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages",filter:"conversation_id=eq."+id},()=>loadMessages(true)).subscribe();renderList()}
async function loadMessages(scroll){if(!current)return;const r=await sb.from("chat_messages").select("id,sender_id,body,created_at").eq("conversation_id",current.id).order("created_at",{ascending:true}).limit(500);const rows=r.data||[];$("msgs").innerHTML=rows.length?rows.map(m=>{const who=member(m.sender_id)?.full_name||(m.sender_id===me.id?"Bạn":"Thành viên");return '<div class="bubble '+(m.sender_id===me.id?"me":"")+'"><div class="who">'+esc(who)+'</div><div>'+esc(m.body).replace(/\n/g,"<br>")+'</div><div class="time">'+new Date(m.created_at).toLocaleString("vi-VN")+'</div></div>'}).join(""):'<div class="empty">Chưa có tin nhắn.</div>';$("msgs").scrollTop=$("msgs").scrollHeight}
$("composer").onsubmit=async e=>{e.preventDefault();const body=$("input").value.trim();if(!body||!current)return;$("send").disabled=true;const r=await sb.from("chat_messages").insert({conversation_id:current.id,sender_id:me.id,body});if(r.error)alert("Gửi thất bại: "+r.error.message);else{$("input").value="";await loadMessages(true)}$("send").disabled=false};
$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit()}};$("search").oninput=renderList;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;renderList()});
$("newChat").onclick=async()=>{await membersLoad();$("modal").classList.add("show");renderMembers()};$("cancel").onclick=()=>$("modal").classList.remove("show");$("memberSearch").oninput=renderMembers;
function renderMembers(){const q=$("memberSearch").value.trim().toLowerCase();$("memberList").innerHTML=members.filter(x=>x.id!==me.id&&(x.full_name||"").toLowerCase().includes(q)).map(x=>'<label class="member"><div class="avatar">'+esc(initials(x.full_name))+'<i class="dot '+(x.online?"on":"")+'"></i></div><div><b>'+esc(x.full_name||"Thành viên")+'</b><div class="sub">'+(x.online?"Online":"Offline")+'</div></div><input type="checkbox" value="'+x.id+'"></label>').join("")}
$("makeGroup").onclick=async()=>{const ids=[...document.querySelectorAll("#memberList input:checked")].map(x=>x.value);if(ids.length===1){$("modal").classList.remove("show");return direct(ids[0])}if(!ids.length){alert("Chọn ít nhất 1 thành viên.");return}const name=prompt("Tên nhóm:","Nhóm Apple Seed");if(!name)return;const c=await sb.from("chat_conversations").insert({type:"group",name,created_by:me.id}).select().single();if(c.error){alert(c.error.message);return}const p=await sb.from("chat_participants").insert([me.id,...ids].map(user_id=>({conversation_id:c.data.id,user_id})));if(p.error){alert(p.error.message);return}$("modal").classList.remove("show");await convosLoad();await open(c.data.id)};
boot();
</script></body></html>
