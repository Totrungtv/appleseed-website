name: Site Builder image controls repair
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repair script
        shell: bash
        run: |
          if [ ! -f tools/fix-site-builder-image.py ]; then
            echo "No repair script; nothing to do."
            exit 0
          fi
          python3 tools/fix-site-builder-image.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site-builder.html')
          if 'AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V2' not in p.read_text(encoding='utf-8'):
              raise SystemExit('Repair marker not found')
          PY
      - name: Commit repaired page and remove temporary files
        shell: bash
        run: |
          if ! grep -q 'AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V2' site-builder.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-builder.html
          git commit -m "fix: repair Site Builder image controls" || true
          git push
          git rm -f .github/workflows/fix-site-builder-image-controls.yml tools/fix-site-builder-image.py .github/site-builder-image-fix-trigger 2>/dev/null || true
          git commit -m "chore: remove temporary Site Builder repair files" || true
          git push
