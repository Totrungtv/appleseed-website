name: Fix Site Builder image controls
on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Site Builder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site-builder.html')
          s=p.read_text(encoding='utf-8')
          marker='AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V2'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          s=s.replace('<div class="drop" id="pick">Chọn ảnh từ máy</div>','<div class="drop" id="pick">🖼️ Chọn / thay ảnh từ máy</div>')
          s=s.replace('🗑️ Xóa ảnh</button><div class="field" style="margin-top:8px"><label>URL ảnh</label>','↩️ Khôi phục ảnh gốc</button><div class="field" style="margin-top:8px"><label>URL ảnh</label>')
          s=s.replace('<button class="btn primary" id="applyImage" style="width:100%">Áp dụng hình</button>','<button class="btn primary" id="applyImage" style="width:100%">☁️ Thêm / thay ảnh</button>')
          s=s.replace('<button class="btn danger" id="deletePageImage" type="button" style="width:100%;margin-top:6px">🗑️ Xóa ảnh nền</button>','<button class="btn danger" id="deletePageImage" type="button" style="width:100%;margin-top:6px">↩️ Khôi phục nền gốc</button>')
          anchor="let pagePreviewObjectUrl='';"
          baseline="""
// AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V2
const builderImageBaseline=new WeakMap();
const builderPageBaseline=new WeakMap();
function captureBuilderImageBaseline(){
  if(!doc)return;
  try{
    doc.querySelectorAll('img').forEach(img=>{
      if(!builderImageBaseline.has(img)) builderImageBaseline.set(img,{src:img.getAttribute('src')||'',srcset:img.getAttribute('srcset')||'',sizes:img.getAttribute('sizes')||''});
    });
    doc.querySelectorAll('*').forEach(el=>{
      if((el.matches?.('.as3-phone,.as3-screen'))&&!builderImageBaseline.has(el)) builderImageBaseline.set(el,{style:el.getAttribute('style')||'',html:el.innerHTML});
      const bg=el.style?.getPropertyValue('background-image')||'';
      if(bg&&bg!=='none'&&!builderImageBaseline.has(el)) builderImageBaseline.set(el,{style:el.getAttribute('style')||''});
    });
    [doc.body,doc.querySelector('main'),doc.querySelector('.as3-hero')].filter(Boolean).forEach(el=>{
      if(!builderPageBaseline.has(el)) builderPageBaseline.set(el,{style:el.getAttribute('style')||''});
    });
  }catch(e){try{recordRuntimeError('Image baseline',e.message,e.stack)}catch(_){}
  }
}
function restoreBuilderImage(el){
  if(!el)return;
  const base=builderImageBaseline.get(el);
  if(el.tagName==='IMG'){
    if(base?.src)el.setAttribute('src',base.src);else el.removeAttribute('src');
    if(base?.srcset)el.setAttribute('srcset',base.srcset);else el.removeAttribute('srcset');
    if(base?.sizes)el.setAttribute('sizes',base.sizes);else el.removeAttribute('sizes');
    return;
  }
  const phone=el.matches?.('.as3-phone')?el:el.closest?.('.as3-phone');
  if(phone){
    const b=builderImageBaseline.get(phone);
    if(b?.html!==undefined){phone.innerHTML=b.html;phone.setAttribute('style',b.style||'');return}
  }
  if(base?.style!==undefined)el.setAttribute('style',base.style||'');else el.style.removeProperty('background-image');
}
function restoreBuilderPageBackground(target){
  if(!target)return;
  const b=builderPageBaseline.get(target);
  if(b?.style!==undefined)target.setAttribute('style',b.style||'');else target.style.removeProperty('background-image');
}
"""
          if anchor not in s: raise SystemExit('baseline anchor not found')
          s=s.replace(anchor,anchor+baseline,1)
          old="$('deleteImage').onclick=()=>{if(!selected){toast('Chưa chọn đối tượng ảnh');return}checkpoint();const item=getItem();if(selected.tagName==='IMG'){selected.removeAttribute('src');selected.removeAttribute('srcset');item.src=''}else{selected.style.removeProperty('background-image');delete item.bgImage;const nested=selected.querySelector?.('.as3-screen > img');if(nested){nested.removeAttribute('src');nested.removeAttribute('srcset')}}pendingFile=null;$('file').value='';$('imageUrl').value='';$('imagePreview').removeAttribute('src');saveDraft();refreshInspector();toast('🗑️ Đã xóa ảnh')};"
          new="$('deleteImage').onclick=()=>{if(!selected){toast('Chưa chọn đối tượng ảnh');return}checkpoint();const item=getItem();delete item.src;delete item.bgImage;restoreBuilderImage(selected);const phone=selected.closest?.('.as3-phone');if(phone)restoreBuilderImage(phone);pendingFile=null;$('file').value='';$('imageUrl').value='';$('imagePreview').removeAttribute('src');applyAll();saveDraft();refreshInspector();toast('↩️ Đã khôi phục ảnh gốc')};"
          if old not in s: raise SystemExit('deleteImage handler not found')
          s=s.replace(old,new,1)
          old2="$('deletePageImage').onclick=()=>{checkpoint();const p=ensurePage();p.bgImage='';$('pageBgUrl').value='';pagePendingFile=null;$('pageFile').value='';const target=findPageTarget(pageStyleTarget());if(target)target.style.removeProperty('background-image');saveDraft();refreshPageDesign();toast('🗑️ Đã xóa ảnh nền')};"
          new2="$('deletePageImage').onclick=()=>{checkpoint();const p=ensurePage();p.bgImage='';$('pageBgUrl').value='';pagePendingFile=null;$('pageFile').value='';const target=findPageTarget(pageStyleTarget());restoreBuilderPageBackground(target);applyAll();saveDraft();refreshPageDesign();toast('↩️ Đã khôi phục nền gốc')};"
          if old2 not in s: raise SystemExit('deletePageImage handler not found')
          s=s.replace(old2,new2,1)
          load_anchor="await loadPublished();applyAll();refreshPageDesign();rebindUploadControls();"
          if load_anchor not in s: raise SystemExit('load anchor not found')
          s=s.replace(load_anchor,"captureBuilderImageBaseline();\n  await loadPublished();applyAll();refreshPageDesign();rebindUploadControls();",1)
          pos=s.rfind('</style>')
          css="""
/* AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V2 */
#imagePanel .drop,#pageDesignPanel .drop{transition:.15s ease;border-color:#b9cce5;background:#f8fbff}
#imagePanel .drop:hover,#pageDesignPanel .drop:hover{border-color:#1769ff;background:#eef6ff;transform:translateY(-1px)}
#deleteImage,#deletePageImage{font-weight:850}
"""
          s=s[:pos]+css+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/scripts.js
          from pathlib import Path
          import re
          s=Path('site-builder.html').read_text(encoding='utf-8')
          Path('/tmp/scripts.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)),encoding='utf-8')
          PY
          node --check /tmp/scripts.js
          test "$(grep -o 'AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V2' site-builder.html | wc -l)" -eq 2
      - name: Commit patch and remove fixer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-builder.html
          git commit -m "fix: repair Site Builder image controls" || true
          git push
          rm -f .github/workflows/fix-site-builder-image-controls.yml .github/site-builder-image-fix-trigger
          git add -A
          git commit -m "chore: remove temporary Site Builder fixer" || true
          git push
