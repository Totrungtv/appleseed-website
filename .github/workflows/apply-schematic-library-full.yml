name: Apply Schematic Library Full
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ai-board.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('ai-board.html')
          s=p.read_text(encoding='utf-8')
          marker='SCHEMATIC_LIBRARY_FULL_IPHONE_IPAD_V1'
          if marker in s:
              print('Already patched'); raise SystemExit(0)
          css='''\n/* SCHEMATIC_LIBRARY_FULL_IPHONE_IPAD_V1 */\n.as-library-shell{margin-top:16px}.as-library-platforms{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.as-library-platform{border:1px solid #d5e5f5;background:#f7fbff;color:#183a63;border-radius:12px;padding:10px 15px;font-weight:800;cursor:pointer}.as-library-platform.active{background:#eaf4ff;border-color:#5fa7ff}.as-library-platform-count{font-size:11px;color:#6a819d;margin-left:4px}.as-library-families{display:grid;gap:10px}.as-library-family{border:1px solid #d9e8f6;border-radius:14px;background:#fbfdff;overflow:hidden}.as-library-family>summary{list-style:none;cursor:pointer;padding:13px 15px;font-weight:900;display:flex;justify-content:space-between}.as-library-family>summary::-webkit-details-marker{display:none}.as-library-family>summary:after{content:'＋'}.as-library-family[open]>summary:after{content:'−'}.as-library-family-meta{font-size:12px;color:#6a819d}.as-library-model-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 12px 12px}.as-library-model{border:1px solid #d9e8f6;border-radius:11px;background:#fff;padding:10px;text-align:left;cursor:pointer}.as-library-model.active{border-color:#2687ee;background:#f1f8ff}.as-library-model b{display:block;font-size:13px;color:#14365d}.as-library-model small{display:block;margin-top:4px;color:#7187a0}.as-library-panel{margin-top:14px;border:1px solid #cfe2f7;border-radius:14px;background:#fff;padding:14px}.as-library-file{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #edf2f7}.as-library-file-name{min-width:0}.as-library-file-name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.as-library-file-name small{color:#7187a0}.as-library-file-actions{display:flex;gap:7px}.as-library-empty{padding:15px;border:1px dashed #cfe2f7;border-radius:12px;color:#7187a0;text-align:center}.as-library-upload{margin-top:14px;padding-top:14px;border-top:1px solid #edf2f7}.as-library-upload-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:10px}@media(max-width:900px){.as-library-model-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.as-library-model-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.as-library-upload-grid{grid-template-columns:1fr}.as-library-file{align-items:flex-start;flex-direction:column}.as-library-file-actions{width:100%}.as-library-file-actions .btn{flex:1}}\n'''
          section='''<section class="card" id="schematic-library"><div class="kicker">LIBRARY</div><h2>📚 Schematic Library</h2><div class="muted">Kho sơ đồ đầy đủ iPhone + iPad. Chọn dòng máy → mở model → xem và tải file thực tế.</div><div class="as-library-shell"><div class="as-library-platforms" id="asLibraryPlatforms"></div><div id="asLibraryCatalog"><div class="as-library-empty">⏳ Đang tải danh mục iPhone / iPad…</div></div><div class="as-library-panel" id="asLibraryPanel" hidden><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><strong id="asLibraryTitle">📁 Chưa chọn model</strong><div class="muted" id="asLibraryMeta"></div></div><button class="btn secondary" id="asLibraryRefresh" type="button">↻ Làm mới</button></div><div id="asLibraryFiles" style="margin-top:8px"></div><div class="as-library-upload"><div class="as-library-upload-grid"><div><label style="display:block;font-weight:800;margin-bottom:6px">Model nhận file</label><select id="asLibraryModelSelect"></select></div><div><label style="display:block;font-weight:800;margin-bottom:6px">Loại tài liệu</label><select id="asLibraryType"><option value="schematic">Schematic</option><option value="boardview">Boardview / ZXW</option><option value="pinout">Pinout</option><option value="panic">PANIC reference</option><option value="other">Khác</option></select></div></div><div class="actions"><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.zip,.rar,.brd,.asc,.fz,.sch,.txt"><button class="btn primary" id="upload" type="button">📥 Thêm vào thư viện</button></div><div id="uploadStatus" class="muted" style="margin-top:8px"></div></div></div></div></section>'''
          js='''<script>/* SCHEMATIC_LIBRARY_FULL_IPHONE_IPAD_V1 */\n(()=>{const sb=window.supabaseClient,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const B='schematic-library',cat=$('asLibraryCatalog'),plat=$('asLibraryPlatforms'),panel=$('asLibraryPanel'),title=$('asLibraryTitle'),meta=$('asLibraryMeta'),box=$('asLibraryFiles'),sel=$('asLibraryModelSelect'),st=$('uploadStatus');let rows=[],counts={},key='',platform='iPhone';const type=n=>{let e=(n.split('.').pop()||'').toLowerCase();if(e==='pdf')return'schematic';if(['brd','asc','fz','sch'].includes(e))return'boardview';if(['zip','rar'].includes(e))return'archive';if(['jpg','jpeg','png','webp'].includes(e))return'image';return'other'};const size=n=>{let u=['B','KB','MB','GB'],i=0,x=Number(n||0);while(x>=1024&&i<3)x/=1024,i++;return x?x.toFixed(i?1:0)+' '+u[i]:''};function platforms(){let a=rows.filter(x=>x.platform==='iPhone').length,b=rows.filter(x=>x.platform==='iPad').length;plat.innerHTML=['iPhone','iPad'].map(p=>`<button type="button" class="as-library-platform ${p===platform?'active':''}" data-p="${p}">${p==='iPhone'?'📱':'📲'} ${p} <span class="as-library-platform-count">${p==='iPhone'?a:b} model</span></button>`).join('');plat.querySelectorAll('button').forEach(x=>x.onclick=()=>{platform=x.dataset.p;key=rows.find(r=>r.platform===platform)?.model_key||'';render();populate();select(key)})}function populate(){let a=rows.filter(r=>r.platform===platform);sel.innerHTML=a.map(r=>`<option value="${esc(r.model_key)}">${esc(r.family)} — ${esc(r.model_name)}</option>`).join('');if(key)sel.value=key}function render(){let g={};rows.filter(r=>r.platform===platform).forEach(r=>(g[r.family]??=[]).push(r));cat.innerHTML=`<div class="as-library-families">${Object.keys(g).map((f,i)=>`<details class="as-library-family" ${i?'':'open'}><summary><span>📁 ${esc(f)}</span><span class="as-library-family-meta">${g[f].length} model</span></summary><div class="as-library-model-grid">${g[f].map(r=>`<button type="button" class="as-library-model ${r.model_key===key?'active':''}" data-k="${esc(r.model_key)}"><b>${esc(r.model_name)}</b><small>${counts[r.model_key]||0} file</small></button>`).join('')}</div></details>`).join('')}</div>`;cat.querySelectorAll('.as-library-model').forEach(x=>x.onclick=()=>select(x.dataset.k))}async function count(){let q=await sb.from('schematic_library').select('device_model');counts={};(q.data||[]).forEach(x=>counts[x.device_model]=(counts[x.device_model]||0)+1)}async function select(k){let r=rows.find(x=>x.model_key===k);if(!r)return;key=k;sel.value=k;panel.hidden=false;title.textContent='📁 '+r.model_name;meta.textContent=`${r.platform} • ${r.family} • ${counts[k]||0} file`;render();box.innerHTML='<div class="as-library-empty">⏳ Đang tải file…</div>';let q=await sb.from('schematic_library').select('id,title,file_path,file_name,file_type,file_size,created_at').eq('device_model',k).order('created_at',{ascending:false});if(q.error){box.innerHTML='<div class="as-library-empty">❌ '+esc(q.error.message)+'</div>';return}let d=q.data||[];if(!d.length){box.innerHTML='<div class="as-library-empty">📂 Model này chưa có file.</div>';return}box.innerHTML=d.map(f=>`<div class="as-library-file"><div class="as-library-file-name"><b>📄 ${esc(f.file_name||f.title||'File')}</b><small>${esc(f.file_type||'other')} ${f.file_size?'• '+size(f.file_size):''}</small></div><div class="as-library-file-actions"><button class="btn secondary" data-open="${esc(f.file_path)}" type="button">👁 Mở</button><button class="btn secondary" data-down="${esc(f.file_path)}" data-name="${esc(f.file_name||'file')}" type="button">⬇ Tải</button></div></div>`).join('');box.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>open(x.dataset.open));box.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>open(x.dataset.down,x.dataset.name))}async function open(path,name){if(!(await sb.auth.getSession()).data.session){alert('Vui lòng đăng nhập Member/Admin/Staff.');return}let q=await sb.storage.from(B).createSignedUrl(path,600);if(q.error){alert('Không mở được file: '+q.error.message);return}let a=document.createElement('a');a.href=q.data.signedUrl;a.target='_blank';if(name)a.download=name;document.body.appendChild(a);a.click();a.remove()}async function upload(){let f=$('file')?.files?.[0],r=rows.find(x=>x.model_key===sel.value);if(!f||!r){st.textContent='⚠️ Chọn model và file trước.';return}if(f.size>50*1024*1024){st.textContent='❌ File tối đa 50MB.';return}let ses=(await sb.auth.getSession()).data.session;if(!ses){st.textContent='❌ Vui lòng đăng nhập Admin/Staff.';return}let safe=f.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-'),path=`models/${r.model_key}/${Date.now()}-${crypto.randomUUID().slice(0,8)}-${safe}`;st.textContent='⏳ Đang tải file…';$('upload').disabled=true;try{let u=await sb.storage.from(B).upload(path,f,{cacheControl:'3600',upsert:false,contentType:f.type||'application/octet-stream'});if(u.error)throw u.error;let ins=await sb.from('schematic_library').insert({device_model:r.model_key,title:f.name,file_path:path,file_name:f.name,file_type:$('asLibraryType').value||type(f.name),mime_type:f.type||null,file_size:f.size,created_by:ses.user.id}).select('id').single();if(ins.error){await sb.storage.from(B).remove([path]);throw ins.error}st.textContent='✅ Đã thêm '+f.name+' vào '+r.model_name;$('file').value='';await count();render();await select(r.model_key)}catch(e){st.textContent='❌ Upload lỗi: '+(e?.message||String(e))}finally{$('upload').disabled=false}}async function init(){if(!sb){cat.innerHTML='<div class="as-library-empty">❌ Supabase chưa sẵn sàng.</div>';return}let q=await sb.from('schematic_library_models').select('platform,family,model_name,model_key,sort_order').eq('is_active',true).order('sort_order',{ascending:true});if(q.error){cat.innerHTML='<div class="as-library-empty">❌ Không tải được danh mục.</div>';return}rows=q.data||[];key=rows.find(r=>r.platform===platform)?.model_key||'';await count();platforms();populate();render();select(key)}function platforms(){let a=rows.filter(x=>x.platform==='iPhone').length,b=rows.filter(x=>x.platform==='iPad').length;plat.innerHTML=['iPhone','iPad'].map(p=>`<button type="button" class="as-library-platform ${p===platform?'active':''}" data-p="${p}">${p==='iPhone'?'📱':'📲'} ${p} <span class="as-library-platform-count">${p==='iPhone'?a:b} model</span></button>`).join('');plat.querySelectorAll('button').forEach(x=>x.onclick=()=>{platform=x.dataset.p;key=rows.find(r=>r.platform===platform)?.model_key||'';platforms();populate();render();select(key)})}sel?.addEventListener('change',()=>select(sel.value));$('upload')?.addEventListener('click',upload);$('asLibraryRefresh')?.addEventListener('click',()=>select(key));let n=0,t=setInterval(()=>{if(window.supabaseClient){clearInterval(t);init()}if(++n>100)clearInterval(t)},100)} )();</script>'''
          s=re.sub(r'<section class="card"><div class="kicker">LIBRARY</div>.*?</section>',section,s,count=1,flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'Apple Seed Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ai-board.html
          git commit -m 'feat: full iPhone iPad schematic library' || exit 0
          git push
          git rm .github/workflows/apply-schematic-library-full.yml
          git commit -m 'chore: remove one-time library patch workflow'
          git push
