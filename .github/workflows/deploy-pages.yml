name: Deploy Apple Seed to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install 30 Site Builder themes
        run: |
          set -euo pipefail
          python3 scripts/install-30-themes.py
          python3 scripts/fix-30-theme-markup.py
          python3 scripts/fix-30-theme-selection.py
          git diff --check
          git config user.name "Apple Seed Theme Installer"
          git config user.email "0898888269tv@gmail.com"
          if git diff --quiet; then
            echo "30 themes already installed."
          else
            git add site-builder.html site-builder-themes.css site-builder-runtime.js scripts/fix-30-theme-selection.py
            git commit -m "fix: make all 30 Site Builder themes selectable"
            git push origin HEAD:main
          fi
      - name: Install 30 full website themes
        run: |
          set -euo pipefail
          python3 scripts/install-30-full-themes.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('site-builder.html')
          s=p.read_text(encoding='utf-8')
          marker='APPLE_SEED_30_FULL_THEMES_MARKUP_REPAIR_V2'
          m=re.search(r'<style id="apple-seed-full-theme-ui">(.*?)</style>',s,re.S)
          if m:
              css=m.group(1)
              s=s[:m.start()]+s[m.end():]
              s=s.replace('</head>','<style id="apple-seed-full-theme-ui">'+css+'</style>\n<!-- '+marker+' -->\n</head>',1)
          elif marker not in s:
              s=s.replace('</head>','<!-- '+marker+' -->\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name "Apple Seed Full Theme Installer"
          git config user.email "0898888269tv@gmail.com"
          if git diff --quiet; then
            echo "30 full website themes already installed."
          else
            git add site-builder.html site-builder-full-themes.css site-builder-runtime.js scripts/install-30-full-themes.py
            git commit -m "fix: repair 30 full theme Builder markup"
            git push origin HEAD:main
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Fix Hero initial render, mobile slider sizing and cache bust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'APPLE_SEED_HERO_MODE_INITIAL_V3'
          css = '''<style id="apple-seed-hero-mode-initial-v3">
          html:not([data-apple-seed-hero-mode="phones"]) .as3-phone{display:none!important;visibility:hidden!important}
          html[data-apple-seed-hero-mode="phones"] .as3-phone{display:block!important;visibility:visible!important}
          @media(max-width:650px){
            .as3-stage.apple-seed-runtime-slider-host,
            .apple-seed-runtime-slider-host{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important;padding-left:0!important;padding-right:0!important}
            .as3-stage.apple-seed-runtime-slider-host > .apple-seed-runtime-slider,
            .apple-seed-runtime-slider-host > .apple-seed-runtime-slider,
            #apple-seed-runtime-slider{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important}
            .apple-seed-runtime-slider-host img,
            .apple-seed-runtime-slider img,
            #apple-seed-runtime-slider img{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;object-fit:contain!important}
          }
          </style>'''
          if marker not in s:
              s = s.replace('</head>', css + '\n<!-- ' + marker + ' -->\n</head>', 1)
          for old in ['20260830-v6','20260912-v8','20260912-v9','20260912-v10','20260912-v11','20260912-v12']:
              s=s.replace('site-builder-runtime.js?v='+old,'site-builder-runtime.js?v=20260912-v13')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
