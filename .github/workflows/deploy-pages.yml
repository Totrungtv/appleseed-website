name: Deploy Apple Seed to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Web Theme Selection Bridge
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site-builder.html')
          s = p.read_text(encoding='utf-8')
          marker = 'APPLE_SEED_THEME_SELECTION_BRIDGE_V2'
          tag = '<script src="site-theme-selection-bridge.js?v=20260912-theme-bridge2"></script>'
          if marker not in s:
              s = s.replace('</body>', '<!-- '+marker+' -->\n'+tag+'\n</body>', 1)
              p.write_text(s, encoding='utf-8')
              print('Installed Web Theme Selection Bridge V2.')
          else:
              print('Web Theme Selection Bridge V2 already installed.')
          PY
          git diff --check
          git config user.name "Apple Seed Theme Bridge"
          git config user.email "0898888269tv@gmail.com"
          if git diff --quiet; then
            echo "Theme bridge already installed."
          else
            git add site-builder.html site-theme-selection-bridge.js
            git commit -m "fix: bind 01-30 theme selection to web publish"
            git push origin HEAD:main
          fi

      - name: Remove legacy Hero phone mockups
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag_re = re.compile(r'<\s*(/?)\s*div\b[^>]*>', re.I)
          starts = list(re.finditer(r'<div\b[^>]*class=["\'][^"\']*\bas3-phone\b[^"\']*["\'][^>]*>', s, re.I))
          ranges = []
          for m in starts:
              depth = 1
              for t in tag_re.finditer(s, m.end()):
                  if t.group(1):
                      depth -= 1
                      if depth == 0:
                          ranges.append((m.start(), t.end()))
                          break
                  else:
                      depth += 1
          if ranges:
              for a, b in reversed(ranges):
                  s = s[:a] + s[b:]
              p.write_text(s, encoding='utf-8')
              print(f'Removed {len(ranges)} legacy Hero phone block(s).')
          else:
              print('No legacy Hero phone blocks found.')
          PY
          git diff --check
          git config user.name "Apple Seed Deploy"
          git config user.email "0898888269tv@gmail.com"
          if git diff --quiet; then
            echo "Hero phone DOM already clean."
          else
            git add index.html
            git commit -m "fix: remove legacy Hero phone mockups"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fix Hero initial render, mobile slider sizing and cache bust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'APPLE_SEED_HERO_MODE_INITIAL_V3'
          css = '''<style id="apple-seed-hero-mode-initial-v3">
          html:not([data-apple-seed-hero-mode="phones"]) .as3-phone{display:none!important;visibility:hidden!important}
          html[data-apple-seed-hero-mode="phones"] .as3-phone{display:block!important;visibility:visible!important}
          @media(max-width:650px){
            .as3-stage.apple-seed-runtime-slider-host,
            .apple-seed-runtime-slider-host{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important;padding-left:0!important;padding-right:0!important}
            .as3-stage.apple-seed-runtime-slider-host > .apple-seed-runtime-slider,
            .apple-seed-runtime-slider-host > .apple-seed-runtime-slider,
            #apple-seed-runtime-slider{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important}
            .apple-seed-runtime-slider-host img,
            .apple-seed-hero-slider img,
            #apple-seed-runtime-slider img{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;object-fit:contain!important}
          }
          </style>'''
          if marker not in s:
              s = s.replace('</head>', css + '\n<!-- ' + marker + ' -->\n</head>', 1)
          for old in ['20260830-v6','20260912-v8','20260912-v9','20260912-v10','20260912-v11','20260912-v12','20260912-v13']:
              s=s.replace('site-builder-runtime.js?v='+old,'site-builder-runtime.js?v=20260912-v14')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
