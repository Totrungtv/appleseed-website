name: Deploy Apple Seed to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  patch-ui:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch iCloud error UI safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('icloud-check.html')
          s=p.read_text(encoding='utf-8')
          old="""  }catch(e){
      processingArea.style.display='none';
      resultArea.style.display='block';
      const card=$('resultCard'); card.className='result-card';
      $('resultIcon').textContent='×';
      $('resultTitle').textContent='TRA CỨU THẤT BẠI';
      $('resultMessage').textContent='Hiện tại chưa thể hoàn tất tra cứu. Vui lòng thử lại sau. Nếu đã thanh toán, hệ thống sẽ giữ nguyên giao dịch để xử lý lại.';
      $('resultIdentifier').textContent=normalize();
      $('resultRef').textContent=paymentRefValue||'—';
      $('resultTxn').textContent='—';
      $('resultTime').textContent=new Date().toLocaleString('vi-VN');
      startBtn.disabled=false;
      saveHistory({ref:paymentRefValue||'—',identifier:normalize(),time:new Date().toLocaleString('vi-VN'),status:'Lỗi xử lý'});
    }"""
          new="""  }catch(e){
      processingArea.style.display='none';
      resultArea.style.display='block';
      const card=$('resultCard');
      card.className='result-card unknown';
      const badge=$('resultBadge');
      if(badge){
        badge.className='badge unknown';
        badge.innerHTML='<span class=\\"status-dot unknown\\"></span> TRA CỨU CHƯA HOÀN TẤT';
      }
      const pill=$('resultStatusPill');
      if(pill){
        pill.className='status-pill unknown';
        pill.innerHTML='<span class=\\"status-dot unknown\\"></span> CHƯA XÁC MINH';
      }
      $('resultModelName').textContent=model.value||'iPhone';
      $('resultModelDetail').textContent='Nguồn kiểm tra chưa trả kết quả.';
      $('resultMessage').textContent=e?.message||'Hiện tại chưa thể hoàn tất tra cứu. Nếu đã thanh toán, giao dịch vẫn được giữ để xử lý lại.';
      $('heroIdentifier').textContent=normalize()||'—';
      $('heroFmi').textContent='—';
      $('heroActivation').textContent='—';
      $('heroSimlock').textContent='—';
      $('deviceDetails').innerHTML='';
      $('lockDetails').innerHTML='';
      $('networkDetails').innerHTML='';
      $('lockSection').style.display='none';
      $('networkSection').style.display='none';
      $('resultIdentifier').textContent=normalize()||'—';
      $('resultRef').textContent=paymentRefValue||'—';
      $('resultTxn').textContent='—';
      $('resultTime').textContent=new Date().toLocaleString('vi-VN');
      startBtn.disabled=false;
      saveHistory({ref:paymentRefValue||'—',identifier:normalize(),time:new Date().toLocaleString('vi-VN'),status:'Lỗi xử lý'});
    }"""
          if old not in s:
              raise SystemExit('Expected iCloud catch block not found; no patch made.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -q "resultIcon.*textContent" icloud-check.html && exit 1 || true
          grep -q "resultStatusPill" icloud-check.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icloud-check.html
          git commit -m 'fix: prevent iCloud check error UI crash'
          git push
      - name: Remove temporary patch job from workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-pages.yml')
          s=p.read_text(encoding='utf-8')
          marker='  patch-ui:\n'
          start=s.find(marker)
          if start<0: raise SystemExit('patch-ui job already removed')
          deploy=s.find('  deploy:\n',start)
          if deploy<0: raise SystemExit('deploy job marker not found')
          p.write_text(s[:start]+s[deploy:],encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-pages.yml
          git commit -m 'chore: remove temporary iCloud patch job'
          git push

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
