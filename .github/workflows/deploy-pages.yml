name: Deploy Apple Seed to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Fix-ADB package with full Android SDK Platform-Tools
        run: |
          set -e
          mkdir -p /tmp/fix-adb/platform-tools assets
          curl -L --fail --retry 3 -o /tmp/platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          test -s /tmp/platform-tools.zip
          unzip -q /tmp/platform-tools.zip -d /tmp/fix-adb
          test -f /tmp/fix-adb/platform-tools/adb.exe
          test -f /tmp/fix-adb/platform-tools/fastboot.exe
          cp tools/Fix-ADB/Fix-ADB.bat /tmp/fix-adb/Fix-ADB.bat
          (cd /tmp/fix-adb && zip -qr "$GITHUB_WORKSPACE/assets/Fix-ADB.zip" Fix-ADB.bat platform-tools)
          test -s assets/Fix-ADB.zip
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
