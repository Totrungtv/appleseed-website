name: Deploy Apple Seed to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: One-time Index Builder unification
        shell: bash
        run: |
          if [ -f .github/repair_index_builder_v2.py ]; then
            python3 .github/repair_index_builder_v2.py
            python3 - <<'PY'
          import re
          from pathlib import Path
          for src,out in [('site-builder.html','/tmp/builder.js'),('index.html','/tmp/index.js')]:
              s=Path(src).read_text(encoding='utf-8')
              Path(out).write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)),encoding='utf-8')
          PY
            node --check /tmp/builder.js
            node --check /tmp/index.js
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site-builder.html index.html
            git diff --cached --quiet || git commit -m 'fix: unify index and site builder canvas'
            git rm -f .github/repair_index_builder.py .github/repair_index_builder_v2.py .github/workflows/repair-index-builder.yml .github/workflows/repair-index-builder-v2.yml .github/workflows/unify-index-builder.yml .github/unify-index-builder-trigger .github/repair-v2-trigger || true
            git checkout -- .github/workflows/deploy-pages.yml
            git commit -m 'chore: remove temporary builder repair files' || true
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
