name: Deploy Apple Seed to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh Site Builder and layout cache
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('site-builder.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'site-theme-selection-bridge\.js\?v=[^"\']+','site-theme-selection-bridge.js?v=20260912-theme-bridge24',s)
          s=re.sub(r'site-theme-selection-lock\.js\?v=[^"\']+','site-theme-selection-lock.js?v=20260912-lock4',s)
          s=re.sub(r'site-builder-full-themes\.css\?v=[^"\']+','site-builder-full-themes.css?v=20260912-full3',s)
          s=re.sub(r'site-builder-runtime\.js\?v=[^"\']+','site-builder-runtime.js?v=20260912-v16',s)

          # Builder Theme must have one authoritative state: the in-memory
          # published/local draft. The legacy theme widgets used localStorage
          # first and a 1.5s renderer loop, which could resurrect stale Theme 01
          # and visually fight the bridge/remote Supabase config.
          s=s.replace("function get(){try{return valid(localStorage.getItem(KEY)||draft?.theme_id||'01')}catch(_){return valid(draft?.theme_id||'01')}}", "function get(){try{return valid(draft?.theme_id||localStorage.getItem(KEY)||'01')}catch(_){return valid(draft?.theme_id||'01')}}")
          s=s.replace("function current(){try{return valid(localStorage.getItem(KEY)||draft?.full_theme_id||'01')}catch(_){return valid(draft?.full_theme_id||'01')}}", "function current(){try{return valid(draft?.full_theme_id||localStorage.getItem(KEY)||'01')}catch(_){return valid(draft?.full_theme_id||'01')}}")
          s=s.replace("const t=setInterval(()=>{apply(get());render(get())},1500);", "")
          s=s.replace("setInterval(()=>{const v=current();apply(v);render(v)},1500);", "")

          # The old standalone theme click fixer duplicates the native theme
          # widgets and the bridge. Remove it so there is no second click writer.
          s=re.sub(r'<script id="APPLE_SEED_30_THEME_SELECTION_FIX_V1">.*?</script>\s*<!-- APPLE_SEED_30_THEME_SELECTION_FIX_V1 -->', '', s, flags=re.S)
          # Remove duplicated legacy lock include while keeping one current lock.
          s=s.replace('<script src="site-theme-selection-lock.js?v=20260912-lock4"></script>\n<!-- APPLE_SEED_THEME_SELECTION_LOCK_V1 -->\n<script src="site-theme-selection-lock.js?v=20260912-lock4"></script>\n<!-- APPLE_SEED_THEME_SELECTION_LOCK_V2 -->', '<script src="site-theme-selection-lock.js?v=20260912-lock4"></script>\n<!-- APPLE_SEED_THEME_SELECTION_LOCK_V2 -->')

          marker='APPLE_SEED_LAYOUTS_LINK_V2'; link='<link rel="stylesheet" href="site-builder-layouts.css?v=20260912-layout2">'
          if marker not in s:s=s.replace('</head>',link+'\n<!-- '+marker+' -->\n</head>',1)
          lock_marker='APPLE_SEED_THEME_SELECTION_LOCK_V2'; lock_script='<script src="site-theme-selection-lock.js?v=20260912-lock4"></script>'
          if lock_marker not in s:s=s.replace('</body>',lock_script+'\n<!-- '+lock_marker+' -->\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name "Apple Seed Deploy"; git config user.email "0898888269tv@gmail.com"
          if git diff --quiet; then echo "Builder cache already current."; else git add site-builder.html; git commit -m "fix: make Builder theme state single-source"; git push origin HEAD:main; fi
      - name: Inject live website layout stylesheet
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); marker='APPLE_SEED_LIVE_LAYOUTS_V2'; link='<link rel="stylesheet" href="site-builder-layouts.css?v=20260912-layout2">'
          if marker not in s:s=s.replace('</head>',link+'\n<!-- '+marker+' -->\n</head>',1); p.write_text(s,encoding='utf-8')
          PY
          git diff --check; git config user.name "Apple Seed Deploy"; git config user.email "0898888269tv@gmail.com"
          if git diff --quiet; then echo "Live layout link already current."; else git add index.html; git commit -m "feat: enable real website layouts"; git push origin HEAD:main; fi
      - name: Remove legacy Hero phone mockups and force Slider mode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          phone_html='''<!-- APPLE_SEED_HERO_PHONE_SLOTS_V1 -->
          <div class="as3-phone as3-p1"><div class="as3-screen" data-phone-slot="0"></div><div class="as3-island"></div><div class="as3-label">iPhone Pro</div></div>
          <div class="as3-phone as3-p2"><div class="as3-screen" data-phone-slot="1"></div><div class="as3-island"></div><div class="as3-label">iPhone Pro Max</div></div>
          <div class="as3-phone as3-p3"><div class="as3-screen" data-phone-slot="2"></div><div class="as3-island"></div><div class="as3-label">iPhone 16 Pro Max</div></div>
          <div class="as3-phone as3-p4"><div class="as3-screen" data-phone-slot="3"></div><div class="as3-island"></div><div class="as3-label">iPhone 15 Pro Max</div></div>
          <div class="as3-phone as3-p5"><div class="as3-screen" data-phone-slot="4"></div><div class="as3-island"></div><div class="as3-label">iPhone 14 Pro Max</div></div>
          <div class="as3-phone as3-p6"><div class="as3-screen" data-phone-slot="5"></div><div class="as3-island"></div><div class="as3-label">iPhone</div></div>'''
          if phone_html in s:s=s.replace(phone_html,'',1)
          s=s.replace('<!-- APPLE_SEED_HERO_PHONE_SLOTS_V1 -->\n','')
          marker='APPLE_SEED_HERO_MODE_INITIAL_V4'
          css='''<style id="apple-seed-hero-mode-initial-v4">html .as3-phone,html .asph-phone{display:none!important;visibility:hidden!important}html[data-apple-seed-hero-mode="slider"] .apple-seed-runtime-slider-host,html[data-apple-seed-hero-mode="slider"] #apple-seed-runtime-slider{display:block!important;visibility:visible!important}</style>'''
          if marker not in s:s=s.replace('</head>',css+'\n<!-- '+marker+' -->\n</head>',1)
          for old in ['20260830-v6','20260912-v8','20260912-v9','20260912-v10','20260912-v11','20260912-v12','20260912-v13','20260912-v14','20260912-v15']:s=s.replace('site-builder-runtime.js?v='+old,'site-builder-runtime.js?v=20260912-v16')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name "Apple Seed Deploy"; git config user.email "0898888269tv@gmail.com"
          if git diff --quiet; then echo "Legacy Hero phones already removed."; else git add index.html; git commit -m "fix: remove legacy Hero phone mockups"; git push origin HEAD:main; fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
