name: Deploy Apple Seed to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare embedded Scrcpy server
        run: |
          set -e
          curl -L --fail --retry 3 -o /tmp/scrcpy-server-v2.5 https://github.com/Genymobile/scrcpy/releases/download/v2.5/scrcpy-server-v2.5
          test -s /tmp/scrcpy-server-v2.5
          test "$(wc -c < /tmp/scrcpy-server-v2.5)" -gt 60000
          base64 -w0 /tmp/scrcpy-server-v2.5 > /tmp/scrcpy-server-v2.5.b64
          test -s /tmp/scrcpy-server-v2.5.b64
          python3 -c 'from pathlib import Path; p=Path("huawei-tool.html"); s=p.read_text(encoding="utf-8"); b64=Path("/tmp/scrcpy-server-v2.5.b64").read_text(encoding="utf-8").strip(); marker="__APPLESEED_SCRCPY_SERVER_B64__"; assert marker in s, "Scrcpy placeholder not found"; p.write_text(s.replace(marker,b64,1),encoding="utf-8")'
          ! grep -q '__APPLESEED_SCRCPY_SERVER_B64__' huawei-tool.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
