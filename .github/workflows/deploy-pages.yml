name: Deploy Apple Seed to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: One-time repair Site Builder image controls
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('site-builder.html')
          s=p.read_text(encoding='utf-8')
          marker='AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V4'
          if marker not in s:
            def replace_assignment(src,key,replacement):
              token=f"$(''{key}'').onclick=".replace("''", "'")
              start=src.find(token)
              if start<0: raise SystemExit(f'handler not found: {key}')
              eq=src.find('=',start)+1
              i=eq;depth=0;quote=None;esc=False;line=False;block=False
              while i<len(src):
                c=src[i];n=src[i+1] if i+1<len(src) else ''
                if line:
                  if c=='\n':line=False
                elif block:
                  if c=='*' and n=='/':block=False;i+=1
                elif quote:
                  if esc:esc=False
                  elif c=='\\':esc=True
                  elif c==quote:quote=None
                else:
                  if c in "'\"`":quote=c
                  elif c=='/' and n=='/':line=True;i+=1
                  elif c=='/' and n=='*':block=True;i+=1
                  elif c=='{':depth+=1
                  elif c=='}':
                    depth-=1
                    if depth==0:
                      j=i+1
                      while j<len(src) and src[j].isspace():j+=1
                      if j<len(src) and src[j]==';':j+=1
                      return src[:start]+replacement+src[j:]
                i+=1
              raise SystemExit(f'unterminated handler: {key}')

            helper="""
/* AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V4 */
function as4ImagePhone(el){
  if(!el)return null;
  if(el.matches?.('.as3-phone'))return el;
  return el.closest?.('.as3-phone')||el.querySelector?.('.as3-phone')||null;
}
function as4ImageCapable(el){
  if(!el)return false;
  if(el.tagName==='IMG')return true;
  if(as4ImagePhone(el))return true;
  if(el.querySelector?.('img'))return true;
  try{return getComputedStyle(el).backgroundImage!=='none'||el.style.backgroundImage!=='none'}catch(_){return !!el.style?.backgroundImage}
}
function as4ImageUrl(el){
  const phone=as4ImagePhone(el);
  if(phone){
    const bg=phone.style.backgroundImage||'';
    const m=bg.match(/url\\([\"']?(.*?)[\"']?\\)/i);
    if(m)return m[1];
    const img=phone.querySelector('.as3-screen > img');
    if(img)return img.currentSrc||img.src||'';
  }
  const img=el?.tagName==='IMG'?el:el?.querySelector?.('img');
  if(img)return img.currentSrc||img.src||'';
  const bg=el?.style?.backgroundImage||'';
  const m=bg.match(/url\\([\"']?(.*?)[\"']?\\)/i);
  return m?m[1]:'';
}
function as4RestoreImage(el,item){
  if(item){delete item.src;delete item.bgImage;}
  const phone=as4ImagePhone(el);
  if(phone){restoreBuilderImage(phone);return;}
  if(el?.tagName==='IMG'){restoreBuilderImage(el);return;}
  const img=el?.querySelector?.('img');
  if(img){restoreBuilderImage(img);return;}
  restoreBuilderImage(el);
}
"""
            pos=s.find("$('deleteImage').onclick=")
            if pos<0:raise SystemExit('deleteImage anchor missing')
            s=s[:pos]+helper+s[pos:]

            delete_code="""$('deleteImage').onclick=()=>{
  if(!selected){toast('Chưa chọn đối tượng ảnh / khối ảnh');return}
  checkpoint();
  const item=getItem();
  as4RestoreImage(selected,item);
  pendingFile=null;
  $('file').value='';
  $('imageUrl').value='';
  $('imagePreview').removeAttribute('src');
  applyAll();
  saveDraft();
  refreshInspector();
  toast('↩️ Đã khôi phục ảnh gốc');
};"""
            s=replace_assignment(s,'deleteImage',delete_code)

            apply_code="""$('applyImage').onclick=async()=>{
  if(!selected){toast('Chưa chọn đối tượng ảnh / khối ảnh');return}
  let url=$('imageUrl').value.trim();
  try{
    if(pendingFile){url=await upload(pendingFile);pendingFile=null}
  }catch(e){toast('Upload lỗi: '+e.message);return}
  if(!url){toast('Hãy chọn ảnh hoặc nhập URL');return}
  checkpoint();
  const item=getItem();
  const phone=as4ImagePhone(selected);
  const img=selected.tagName==='IMG'?selected:(phone?null:selected.querySelector?.('img'));
  if(phone){applyHeroPhoneImage(phone,url);item.bgImage=url;delete item.src}
  else if(img){img.src=url;item.src=url;delete item.bgImage}
  else{selected.style.backgroundImage='url("'+url.replaceAll('"','%22')+'")';item.bgImage=url;delete item.src}
  $('file').value='';
  $('imageUrl').value=url;
  $('imagePreview').src=url;
  applyAll();
  saveDraft();
  refreshInspector();
  toast('☁️ Đã thêm / thay ảnh');
};"""
            s=replace_assignment(s,'applyImage',apply_code)

            old="$('imagePanel').hidden=!(selected.tagName==='IMG'||isHeroPhone||computedBg!=='none');"
            new="$('imagePanel').hidden=!as4ImageCapable(selected);"
            if old not in s:raise SystemExit('refreshInspector image visibility anchor missing')
            s=s.replace(old,new,1)

            old_apply="if(el.matches?.('.as3-phone,.as3-screen')) applyHeroPhoneImage(el,item.bgImage);\n      else el.style.backgroundImage=item.bgImage?'url(\"'+item.bgImage+'\")':'';"
            new_apply="const phoneTarget=el.matches?.('.as3-phone')?el:(el.querySelector?.('.as3-phone')||el.closest?.('.as3-phone'));\n      if(phoneTarget) applyHeroPhoneImage(phoneTarget,item.bgImage);\n      else if(el.matches?.('.as3-screen')) applyHeroPhoneImage(el,item.bgImage);\n      else el.style.backgroundImage=item.bgImage?'url(\"'+item.bgImage+'\")':'';"
            if old_apply not in s:raise SystemExit('applyAll image anchor missing')
            s=s.replace(old_apply,new_apply,1)

            old_block="""if(selected.tagName==='IMG'){$('imagePreview').src=selected.currentSrc||selected.src;$('imageUrl').value=selected.src}
  else if(isHeroPhone){$('imagePreview').src=phoneImage||'';$('imageUrl').value=phoneImage||''}
  else if(computedBg!=='none'){
    const m=computedBg.match(/url\\([\"']?(.+?)[\"']?\\)/i);
    $('imagePreview').src=m?.[1]||'';$('imageUrl').value=m?.[1]||'';
  }"""
            new_block="""if(as4ImageCapable(selected)){
    const cur=as4ImageUrl(selected);
    $('imagePreview').src=cur||'';
    $('imageUrl').value=cur||'';
  }"""
            if old_block in s:s=s.replace(old_block,new_block,1)

            css="""
/* V4 robust image controls */
#imagePanel{scroll-margin-top:8px}
#imagePanel .drop{min-height:40px;display:flex;align-items:center;justify-content:center;font-weight:850;border-style:dashed}
#imagePanel #deleteImage{color:#b42318;border-color:#efb4b4;background:#fffafa;font-weight:900}
#imagePanel #deleteImage:hover{background:#fff1f0;border-color:#dc8d88}
#imagePanel #applyImage{font-weight:900}
"""
            s=s.replace('</style>',css+'</style>',1)
            s=s.replace('// AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V2','// AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V2\n'+marker,1)
            p.write_text(s,encoding='utf-8')
            print('V4 image controls patch written')
          else:
            print('V4 marker already present')

          # Validate all embedded JavaScript before publishing anything.
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/site-builder.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('marker count:',s.count(marker))
      - name: Validate Site Builder JavaScript
        run: node --check /tmp/site-builder.js
      - name: Commit repair and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-builder.html
          git rm -f .github/workflows/fix-site-builder-image-v3.yml .github/workflows/fix-site-builder-image-v4.yml .github/site-builder-image-v3-trigger .github/site-builder-image-v4-trigger || true
          git diff --cached --quiet || git commit -m 'fix: repair Site Builder image controls'
          git checkout -- .github/workflows/deploy-pages.yml
          git commit -m 'chore: remove temporary image repair workflows' || true
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
