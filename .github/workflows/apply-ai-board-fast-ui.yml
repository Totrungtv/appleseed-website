name: Apply AI Board fast UI
on:
  push:
    branches: [main]
    paths:
      - 'ai-board-fast-ui-v1.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject fast UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai-board.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<script[^>]+src=["\']ai-board-fast-ui-v1\.js[^>]*></script>\s*','',s,flags=re.I)
          if '</body>' not in s: raise SystemExit('ai-board.html missing </body>')
          s=s.replace('</body>','<script src="ai-board-fast-ui-v1.js?v=20260917diag1"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-board.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: add AI Board diagnostics guide"
          git push
