name: Apple Seed Hero Motion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apple-seed-hero-motion.yml"
      - "scripts/apple-seed-hero-motion.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple-seed-hero-motion
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Hero motion effects
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apple-seed-hero-motion.py
          git diff --check
          git config user.name "Apple Seed Hero Motion"
          git config user.email "0898888269tv@gmail.com"
          if git diff --quiet -- index.html icloud-check.html; then
            echo "No Hero or iCloud changes needed."
            exit 0
          fi
          git add index.html icloud-check.html
          git commit -m "fix: prevent iCloud check error UI crash [skip ci]"
          git push origin HEAD:main
