name: Premium AI Board Library UI
on:
  push:
    paths:
      - 'backups/ai-board-library-premium-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply premium UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai-board.html')
          s=p.read_text(encoding='utf-8')
          marker='AI_BOARD_SCHEMATIC_LIBRARY_PREMIUM_V2'
          if marker not in s:
            css=r'''<style id="apple-seed-schematic-library-premium">
/* AI_BOARD_SCHEMATIC_LIBRARY_PREMIUM_V2 */
.as-schematic-pro{overflow:hidden!important;background:linear-gradient(180deg,#fff 0%,#f8fbff 100%)!important;border:1px solid #d5e3f2!important;border-radius:26px!important;box-shadow:0 24px 70px rgba(19,66,112,.13)!important;padding:0!important}
.as-schematic-pro .as-lib-head{position:relative;overflow:hidden;padding:28px 30px!important;background:radial-gradient(circle at 88% 18%,rgba(93,181,255,.30),transparent 32%),linear-gradient(135deg,#071d35,#0b4d91 58%,#1677e8)!important;color:#fff!important}
.as-schematic-pro .as-lib-head:after{content:'';position:absolute;width:220px;height:220px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-70px;top:-100px;box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 58px rgba(255,255,255,.025)}
.as-schematic-pro .as-lib-head h2{position:relative;z-index:2;font-size:27px!important;letter-spacing:-.035em!important;margin:0!important;color:#fff!important}
.as-schematic-pro .as-lib-head p{position:relative;z-index:2;margin:7px 0 0!important;color:#d8ecff!important;font-size:13px!important;max-width:650px}
.as-schematic-pro .as-lib-head .as-lib-badge{position:relative;z-index:2;padding:8px 12px!important;border-radius:999px!important;background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.22)!important;color:#fff!important;font-size:10px!important;letter-spacing:.08em}
.as-schematic-pro .as-lib-body{padding:22px 26px 28px!important}
.as-lib-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.as-lib-search{position:relative;flex:1;min-width:240px}.as-lib-search input{width:100%!important;height:44px!important;padding:0 14px 0 42px!important;border:1px solid #d4e2f0!important;border-radius:13px!important;background:#fff!important;box-shadow:0 5px 18px rgba(30,80,130,.06)!important;font-size:13px!important;outline:none!important}.as-lib-search input:focus{border-color:#5fa8ed!important;box-shadow:0 0 0 4px rgba(23,105,255,.10)!important}.as-lib-search:before{content:'⌕';position:absolute;left:15px;top:8px;font-size:23px;color:#7590aa;z-index:2}.as-lib-count{padding:11px 13px;border-radius:12px;background:#eef6ff;color:#145ca8;border:1px solid #d2e5f8;font-size:12px;font-weight:900;white-space:nowrap}
.as-schematic-pro .as-platform-btn{min-height:44px!important;padding:10px 16px!important;border-radius:13px!important;font-size:13px!important;background:#fff!important;border:1px solid #d5e3f1!important;box-shadow:0 4px 12px rgba(30,80,130,.05)!important}.as-schematic-pro .as-platform-btn.active{background:linear-gradient(135deg,#1267e8,#35a1ff)!important;border-color:#1267e8!important;box-shadow:0 9px 22px rgba(18,103,232,.24)!important}
.as-schematic-pro details{border:1px solid #dbe6f1!important;border-radius:16px!important;background:#fff!important;overflow:hidden!important;margin:9px 0!important;box-shadow:0 5px 18px rgba(30,80,130,.035)!important}.as-schematic-pro details:hover{border-color:#a9cbed!important}.as-schematic-pro details>summary{list-style:none!important;cursor:pointer!important;padding:14px 16px!important;background:linear-gradient(180deg,#fff,#f8fbff)!important;color:#173b5c!important;font-weight:900!important;display:flex!important;align-items:center!important;gap:9px!important}.as-schematic-pro details>summary::-webkit-details-marker{display:none!important}.as-schematic-pro details>summary:before{content:'›';display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:#eaf4ff;color:#1769ff;font-size:20px;transition:.18s}.as-schematic-pro details[open]>summary:before{transform:rotate(90deg);background:#1769ff;color:#fff}.as-schematic-pro details>details{margin:0 10px 10px!important}
.as-schematic-pro button:not(.as-platform-btn){font-family:inherit!important}.as-schematic-pro details button,.as-schematic-pro details a{border:1px solid #e1eaf3!important;border-radius:11px!important;background:#fff!important;color:#31506d!important;min-height:40px!important;padding:9px 11px!important;font-weight:800!important;font-size:12px!important;text-align:left!important;transition:.15s!important;box-sizing:border-box}.as-schematic-pro details button:hover,.as-schematic-pro details a:hover{background:#eef7ff!important;border-color:#8bb9e8!important;color:#1267e8!important;transform:translateY(-1px)}
.as-schematic-pro .as-selected-model{margin-top:18px!important;padding:17px 18px!important;border-radius:16px!important;background:linear-gradient(135deg,#eef6ff,#fbfdff)!important;border:1px solid #c9def2!important;box-shadow:inset 0 1px 0 #fff!important}.as-schematic-pro .as-selected-model .as-model-name{font-size:18px!important;font-weight:950!important;color:#123b5d!important}.as-schematic-pro .as-selected-model .as-model-meta{font-size:12px!important;color:#70869d!important;margin-top:4px!important}
.as-schematic-pro .as-upload-panel{margin-top:20px!important;padding:20px!important;border:1px solid #d6e3ef!important;border-radius:18px!important;background:#fff!important;box-shadow:0 12px 35px rgba(30,80,130,.07)!important}.as-schematic-pro .as-upload-panel h3{font-size:17px!important;color:#123b5d!important}.as-schematic-pro .as-upload-panel>p{font-size:12px!important;color:#748aa0!important}.as-schematic-pro .as-upload-grid{gap:12px!important}.as-schematic-pro .as-upload-grid select,.as-schematic-pro .as-upload-grid input[type=file]{height:44px!important;background:#f8fbff!important;border:1px solid #d4e2ef!important;border-radius:12px!important}.as-schematic-pro .as-upload-action button{min-height:44px!important;border-radius:12px!important;background:linear-gradient(135deg,#1267e8,#35a1ff)!important;box-shadow:0 9px 20px rgba(18,103,232,.22)!important}
.as-schematic-pro .as-file-list{gap:9px!important}.as-schematic-pro .as-file-item{padding:13px 15px!important;border-radius:13px!important;background:#fff!important}.as-schematic-pro .as-file-name{font-size:13px!important}.as-schematic-pro .as-empty{background:#f8fbff!important;border:1px dashed #cbdceb!important;border-radius:14px!important}
.as-schematic-pro .as-platform-details{border:0!important;box-shadow:none!important;background:transparent!important;margin:0!important}.as-schematic-pro .as-platform-details>summary{background:transparent!important;padding:0 0 10px!important;font-size:13px!important;color:#60788f!important}.as-schematic-pro .as-platform-details>summary:before{display:none!important}
.as-lib-hidden{display:none!important}
@media(max-width:800px){.as-schematic-pro .as-lib-head{padding:22px 18px!important}.as-schematic-pro .as-lib-body{padding:16px!important}.as-lib-toolbar{align-items:stretch}.as-lib-search{min-width:100%}.as-lib-count{width:max-content}.as-schematic-pro details button,.as-schematic-pro details a{width:100%!important}}
</style>'''
            js=r'''<script id="apple-seed-schematic-library-premium-js">
(function(){
  function enhance(){
    const h=[...document.querySelectorAll('h1,h2,h3')].find(x=>(x.textContent||'').trim().toLowerCase()==='schematic library');
    if(!h) return false;
    const card=h.closest('.card')||h.parentElement;
    if(!card) return false;
    card.classList.add('as-schematic-pro');
    if(!card.querySelector('.as-lib-toolbar')){
      const body=card.querySelector('.as-lib-body')||card;
      const bar=document.createElement('div');bar.className='as-lib-toolbar';
      const search=document.createElement('div');search.className='as-lib-search';
      const input=document.createElement('input');input.type='search';input.placeholder='Tìm nhanh model, dòng máy, mã board...';search.append(input);
      const count=document.createElement('div');count.className='as-lib-count';count.textContent='Đang tải thư viện…';bar.append(search,count);
      const first=body.querySelector('.as-platforms')||body.firstElementChild;body.insertBefore(bar,first||null);
      input.addEventListener('input',()=>filter(input.value,body,count));
    }
    const btns=[...card.querySelectorAll('button')];
    btns.filter(b=>/iphone|ipad/i.test(b.textContent||'')).slice(0,2).forEach(b=>b.classList.add('as-platform-btn'));
    [...card.querySelectorAll('details')].forEach(d=>{
      d.classList.add('as-family-list-item');
      const sums=d.querySelectorAll(':scope > summary');
      sums.forEach(s=>{if(/iphone|ipad/i.test(s.textContent||''))d.classList.add('as-platform-details')});
    });
    const all=[...card.querySelectorAll('button,a')].filter(x=>!x.classList.contains('as-platform-btn'));
    all.forEach(x=>{if(!x.closest('.as-lib-toolbar')) x.classList.add('as-library-item')});
    const c=card.querySelector('.as-lib-count'); if(c && !c.dataset.live){c.dataset.live='1'; updateCount(card,c)}
    return true;
  }
  function filter(q,root,count){
    q=(q||'').trim().toLowerCase();let visible=0;
    root.querySelectorAll('details').forEach(d=>{
      const text=(d.textContent||'').toLowerCase();const hit=!q||text.includes(q);d.classList.toggle('as-lib-hidden',!!q&&!hit);if(hit)visible++;
    });
    root.querySelectorAll('button,a').forEach(x=>{if(!x.classList.contains('as-platform-btn')&&!x.closest('.as-lib-toolbar')){const t=(x.textContent||'').toLowerCase();x.classList.toggle('as-lib-hidden',!!q&&!t.includes(q))}});
    if(count)count.textContent=q?('Kết quả: '+visible):'Thư viện iPhone & iPad';
  }
  function updateCount(card,count){
    const details=card.querySelectorAll('details').length; const files=card.querySelectorAll('.as-file-item').length;
    count.textContent=files?(''+files+' file trong model'):(''+details+' nhóm model');
  }
  let n=0;const t=setInterval(()=>{if(enhance()||++n>80)clearInterval(t)},250);new MutationObserver(enhance).observe(document.body,{childList:true,subtree:true});
})();
</script>'''
            s=s.replace('</head>',css+'\n</head>').replace('</body>',js+'\n</body>')
            p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-board.html
          git commit -m 'Upgrade Schematic Library to premium UI' || true
          git push origin main
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/ai-board-library-premium.yml backups/ai-board-library-premium-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-time premium library workflow' || true
          git push origin main || true
