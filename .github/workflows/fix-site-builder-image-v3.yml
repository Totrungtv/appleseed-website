name: Repair Site Builder image controls V3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'trigger site builder image controls v3')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch image controls
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('site-builder.html')
          s=p.read_text(encoding='utf-8')
          marker='AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V3'
          if marker in s:
              print('V3 already installed')
              raise SystemExit(0)

          def replace_assignment(src, key, replacement):
              token=f"$(''{key}'').onclick=".replace("''", "'")
              start=src.find(token)
              if start<0: raise SystemExit(f'handler not found: {key}')
              eq=src.find('=', start)+1
              i=eq; depth=0; quote=None; esc=False; line_comment=False; block_comment=False
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if line_comment:
                      if c=='\n': line_comment=False
                  elif block_comment:
                      if c=='*' and n=='/': block_comment=False; i+=1
                  elif quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='/' and n=='/': line_comment=True; i+=1
                      elif c=='/' and n=='*': block_comment=True; i+=1
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:
                              j=i+1
                              while j<len(src) and src[j].isspace(): j+=1
                              if j<len(src) and src[j]==';': j+=1
                              return src[:start]+replacement+src[j:]
                  i+=1
              raise SystemExit(f'unterminated handler: {key}')

          helper='''
/* AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V3 */
function as3ImageTarget(el){
  if(!el)return null;
  if(el.tagName==='IMG')return el;
  return el.querySelector?.('img')||null;
}
function as3ImageCapable(el){
  return !!(el && (el.tagName==='IMG' || el.querySelector?.('img') || el.style?.backgroundImage));
}
function as3CurrentImage(el){
  const img=as3ImageTarget(el);
  if(img)return img.currentSrc||img.src||'';
  const bg=el?.style?.backgroundImage||'';
  const m=bg.match(/url\\([\"']?(.*?)[\"']?\\)/);
  return m?m[1]:'';
}
function as3ClearImageOverride(el,item){
  if(item){item.src='';delete item.bgImage;}
  if(typeof restoreBuilderImage==='function'){
    try{restoreBuilderImage(el);return;}catch(_){ }
  }
  const img=as3ImageTarget(el);
  if(img){img.removeAttribute('src');img.removeAttribute('srcset');img.removeAttribute('sizes');}
  else if(el)el.style.removeProperty('background-image');
}
'''
          first=s.find("$('deleteImage').onclick=")
          if first<0: raise SystemExit('deleteImage anchor not found')
          s=s[:first]+helper+s[first:]

          delete_code='''$('deleteImage').onclick=()=>{
  if(!selected){toast('Chưa chọn đối tượng ảnh / khối ảnh');return}
  checkpoint();
  const item=getItem();
  as3ClearImageOverride(selected,item);
  pendingFile=null;
  $('file').value='';
  $('imageUrl').value='';
  $('imagePreview').removeAttribute('src');
  applyAll();
  saveDraft();
  refreshInspector();
  toast('↩️ Đã khôi phục ảnh gốc');
};'''
          s=replace_assignment(s,'deleteImage',delete_code)

          apply_code='''$('applyImage').onclick=()=>{
  if(!selected){toast('Chưa chọn đối tượng ảnh / khối ảnh');return}
  const url=String($('imageUrl').value||'').trim();
  const src=String(pendingFile?.dataUrl||url||'').trim();
  if(!src){toast('Hãy chọn ảnh từ máy hoặc nhập URL');return}
  checkpoint();
  const item=getItem();
  const img=as3ImageTarget(selected);
  if(img){img.src=src;item.src=src;delete item.bgImage;}
  else{selected.style.backgroundImage=`url("${src.replaceAll('"','%22')}")`;item.bgImage=src;delete item.src;}
  pendingFile=null;
  $('file').value='';
  $('imageUrl').value=src;
  $('imagePreview').src=src;
  applyAll();
  saveDraft();
  refreshInspector();
  toast('☁️ Đã thêm / thay ảnh');
};'''
          s=replace_assignment(s,'applyImage',apply_code)

          # Show the image panel for IMG, image-containing wrappers, and background-image blocks.
          pat=r"\$\('imagePanel'\)\.hidden\s*=\s*[^;]+;?"
          new,n=re.subn(pat,"$('imagePanel').hidden=!as3ImageCapable(selected);",s,count=1)
          if n:
              s=new
          else:
              print('warning: no imagePanel visibility statement found; adding fallback observer')
              insert='''
function syncImagePanelV3(){
  try{
    $('imagePanel').hidden=!as3ImageCapable(selected);
    if(selected){const cur=as3CurrentImage(selected);if(cur)$('imagePreview').src=cur;}
  }catch(_){ }
}
setInterval(syncImagePanelV3,350);
'''
              pos=s.rfind('</script>')
              s=s[:pos]+insert+s[pos:]

          css='''
/* V3 image controls */
#imagePanel{scroll-margin-top:8px}
#imagePanel .drop{min-height:38px;display:flex;align-items:center;justify-content:center;font-weight:800}
#imagePanel #deleteImage{color:#b42318;border-color:#f2b8b5;background:#fffafa}
#imagePanel #deleteImage:hover{background:#fff1f0;border-color:#e58b86}
'''
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          print('patched image controls V3')
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('site-builder.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/site-builder.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('scripts:',len(scripts),'marker:',s.count('AI_BOARD_SITE_BUILDER_IMAGE_CONTROLS_FIX_V3'))
          PY
          node --check /tmp/site-builder.js
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-builder.html
          git diff --cached --quiet || git commit -m 'fix: make Site Builder image add and restore controls robust'
          git rm -f .github/workflows/fix-site-builder-image-v3.yml .github/site-builder-image-v3-trigger || true
          git commit -m 'chore: remove temporary image repair workflow' || true
          git push
