name: Apple Seed Hero Mode Fix2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hero-mode-fix2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          bpath=Path('site-builder.html'); ipath=Path('index.html')
          b=bpath.read_text(encoding='utf-8'); i=ipath.read_text(encoding='utf-8')

          if 'APPLE_SEED_HERO_MODE_ADMIN_V1' not in b:
              pub=b.find("$('publish').onclick=async()=>{")
              if pub<0: raise SystemExit('publish handler not found')
              snap=b.find('const payload=snapshot();',pub)
              if snap<0: raise SystemExit('snapshot not found')
              line_end=b.find('\n',snap)
              if line_end<0: line_end=len(b)
              inject="\n  payload.hero_mode=(function(){try{return localStorage.getItem('APPLE_SEED_HERO_MODE_DRAFT_V1')||'slider'}catch(_){return 'slider'}})();"
              b=b[:line_end]+inject+b[line_end:]

              script="""<script id='APPLE_SEED_HERO_MODE_ADMIN_V1'>
          (function(){
            'use strict';
            const KEY='APPLE_SEED_HERO_MODE_DRAFT_V1';
            const VALID=['slider','phones'];
            const client=window.supabaseClient;
            let panel=null;
            function valid(v){return VALID.includes(v)?v:'slider'}
            function get(){try{return valid(localStorage.getItem(KEY))}catch(_){return 'slider'}}
            function render(v){
              if(!panel)return;
              panel.querySelectorAll('[data-hero-mode]').forEach(x=>x.classList.toggle('active',x.dataset.heroMode===v));
              const s=panel.querySelector('[data-hero-current]');
              if(s)s.textContent='Đang chọn: '+(v==='slider'?'HERO SLIDER':'HERO 6 ĐIỆN THOẠI');
            }
            function set(v){
              v=valid(v);
              try{localStorage.setItem(KEY,v)}catch(_){ }
              render(v);
              const f=document.getElementById('preview');
              try{f&&f.contentWindow.postMessage({type:'APPLE_SEED_HERO_MODE_V1',mode:v},location.origin)}catch(_){ }
            }
            async function live(){
              try{
                const r=await client.from('site_builder_versions').select('config').eq('site_key','default').eq('status','published').order('version_no',{ascending:false}).limit(1).maybeSingle();
                return valid(r.data&&r.data.config&&r.data.config.hero_mode);
              }catch(_){return 'slider'}
            }
            async function init(){
              let v=''; try{v=localStorage.getItem(KEY)||''}catch(_){ }
              if(!VALID.includes(v)){v=await live();try{localStorage.setItem(KEY,v)}catch(_){ }}
              render(v);
            }
            function make(){
              if(panel||!document.querySelector('.side.right'))return;
              panel=document.createElement('div'); panel.className='panel'; panel.id='appleSeedHeroModePanel';
              panel.innerHTML='<h3>🎛 Chế độ Hero</h3><div class="muted" style="margin-bottom:8px">LIVE chỉ hiển thị một kiểu Hero.</div><div style="display:grid;gap:7px"><button type="button" class="btn" data-hero-mode="slider" style="width:100%;text-align:left">🎞 <b>HERO SLIDER</b><small style="display:block;color:#667085;font-weight:500">Chỉ hiện Slider</small></button><button type="button" class="btn" data-hero-mode="phones" style="width:100%;text-align:left">📱 <b>HERO 6 ĐIỆN THOẠI</b><small style="display:block;color:#667085;font-weight:500">Tắt Slider, hiện 6 máy</small></button></div><div data-hero-current style="margin-top:8px;font-size:10px;font-weight:850;color:#1769ff"></div><div class="muted" style="margin-top:6px">Chọn rồi bấm 🚀 Xuất bản.</div>';
              const right=document.querySelector('.side.right'); right.insertBefore(panel,right.firstElementChild);
              panel.querySelectorAll('[data-hero-mode]').forEach(x=>x.addEventListener('click',()=>set(x.dataset.heroMode)));
              render(get());
            }
            const t=setInterval(()=>{if(document.querySelector('.side.right')){make();clearInterval(t)}},100);
            setTimeout(()=>clearInterval(t),30000);
            document.getElementById('clear')?.addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(_){ }});
            setTimeout(init,300);
          })();
          </script>"""
              b=b.replace('</body>',script+'\n</body>',1)

          if 'APPLE_SEED_HERO_MODE_RUNTIME_V1' not in i:
              head="""<style id='APPLE_SEED_HERO_MODE_RUNTIME_CSS_V1'>
          html.apple-seed-hero-mode-pending .as3-phone{visibility:hidden!important}
          html.apple-seed-hero-mode-pending .apple-seed-hero-slider,html.apple-seed-hero-mode-pending .apple-seed-runtime-slider-host,html.apple-seed-hero-mode-pending #apple-seed-runtime-slider{visibility:hidden!important}
          html[data-apple-seed-hero-mode='slider'] .as3-phone{display:none!important}
          html[data-apple-seed-hero-mode='phones'] .apple-seed-hero-slider,html[data-apple-seed-hero-mode='phones'] .apple-seed-runtime-slider-host>.apple-seed-runtime-slider,html[data-apple-seed-hero-mode='phones'] #apple-seed-runtime-slider{display:none!important}
          html[data-apple-seed-hero-mode='phones'] .as3-stage.apple-seed-runtime-slider-host>.as3-phone{display:block!important;visibility:visible!important}
          </style><script>document.documentElement.classList.add('apple-seed-hero-mode-pending');</script>"""
              runtime="""<script id='APPLE_SEED_HERO_MODE_RUNTIME_V1'>
          (function(){
            'use strict';
            const KEY='APPLE_SEED_HERO_MODE_DRAFT_V1';
            const VALID=['slider','phones'];
            const client=window.supabaseClient;
            function valid(v){return VALID.includes(v)?v:'slider'}
            function apply(v){document.documentElement.dataset.appleSeedHeroMode=valid(v);document.documentElement.classList.remove('apple-seed-hero-mode-pending')}
            async function run(){
              const q=new URLSearchParams(location.search); const preview=q.get('builderCanvas')==='1'||q.get('appleSeedBuilderPreview')==='1';
              if(preview){let v='';try{v=localStorage.getItem(KEY)||''}catch(_){ }apply(v||'slider');return}
              try{const r=await client.from('site_builder_versions').select('config').eq('site_key','default').eq('status','published').order('version_no',{ascending:false}).limit(1).maybeSingle();apply(r.data&&r.data.config&&r.data.config.hero_mode)}catch(_){apply('slider')}
            }
            window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.type==='APPLE_SEED_HERO_MODE_V1')apply(e.data.mode)});
            run();
          })();
          </script>"""
              i=i.replace('</style>',head+'\n</style>',1)
              i=i.replace('</body>',runtime+'\n</body>',1)

          bpath.write_text(b,encoding='utf-8'); ipath.write_text(i,encoding='utf-8')
          print('patched')
          PY
          grep -q 'APPLE_SEED_HERO_MODE_ADMIN_V1' site-builder.html
          grep -q 'APPLE_SEED_HERO_MODE_RUNTIME_V1' index.html
          grep -q 'payload.hero_mode' site-builder.html
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          for fn in ('site-builder.html','index.html'):
            s=Path(fn).read_text(encoding='utf-8')
            for n,js in enumerate(re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S),1):
              if not js.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8');f.write(js);f.close()
              r=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'{fn} script {n}: {r.stderr}')
          print('JS syntax OK')
          PY
          git diff --check
          git config user.name 'Apple Seed Hero Mode'
          git config user.email '0898888269tv@gmail.com'
          git add site-builder.html index.html
          git commit -m 'feat: add exclusive Hero Slider or Phone mode'
          git push origin HEAD:main
      - name: Cleanup temporary workflow
        if: success()
        run: |
          git rm .github/workflows/hero-mode-fix2.yml .github/workflows/hero-mode-v1.yml
          git commit -m 'cleanup: remove temporary Hero mode workflows'
          git push origin HEAD:main
