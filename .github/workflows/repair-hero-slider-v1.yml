name: Repair Hero Slider V1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply Hero Slider patch
        run: python .github/repair-hero-slider-v1.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ['site-builder.html','index.html']:
              s=Path(name).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
              for i,b in enumerate(blocks):
                  if not b.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(b); fn=f.name
                  r=subprocess.run(['node','--check',fn],text=True,capture_output=True)
                  if r.returncode:
                      print(f'JS syntax error in {name} script {i}:')
                      print(r.stderr)
                      raise SystemExit(1)
          print('All inline JavaScript syntax checks passed')
          PY
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-builder.html index.html
          if git diff --cached --quiet; then
            echo 'No patch changes'
            exit 0
          fi
          git commit -m 'fix: add multi-image Hero Slider to Site Builder'
          git push
