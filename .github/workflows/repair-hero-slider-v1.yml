name: Repair Hero Slider V1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply Hero Slider patch
        run: python .github/repair-hero-slider-v1.py
      - name: Normalize generated Hero Slider block
        run: |
          python - <<'PY'
          from pathlib import Path
          # The patch script stores its generated JS block with literal \\n          # sequences because it is embedded in a Python raw string. Normalize
          # only that newly generated block; never touch the rest of Builder JS.
          p=Path('site-builder.html')
          s=p.read_text(encoding='utf-8')
          marker='/* APPLE_SEED_HERO_SLIDER_V1 */'
          if marker in s:
              a=s.index(marker)
              b=s.find("$('deleteImage').onclick=()=>{",a)
              if b<0: raise SystemExit('Cannot locate Hero Slider block end')
              block=s[a:b].replace('\\\\n','\\n')
              s=s[:a]+block+s[b:]
              p.write_text(s,encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* APPLE_SEED_HERO_SLIDER_LIVE_V1 */'
          if marker in s:
              a=s.index(marker)
              b=s.find('</script>',a)
              if b<0: raise SystemExit('Cannot locate live Hero Slider script end')
              block=s[a:b].replace('\\\\n','\\n')
              s=s[:a]+block+s[b:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ['site-builder.html','index.html']:
              s=Path(name).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
              for i,b in enumerate(blocks):
                  if not b.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(b); fn=f.name
                  r=subprocess.run(['node','--check',fn],text=True,capture_output=True)
                  if r.returncode:
                      print(f'JS syntax error in {name} script {i}:')
                      print(r.stderr)
                      raise SystemExit(1)
          print('All inline JavaScript syntax checks passed')
          PY
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-builder.html index.html
          if git diff --cached --quiet; then
            echo 'No patch changes'
            exit 0
          fi
          git commit -m 'fix: add multi-image Hero Slider to Site Builder'
          git push
