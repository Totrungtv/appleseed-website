name: Fix English Academy navigation guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protect Academy link from CMS navigation cleanup
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '<a class="academy-nav" href="english-academy.html">'
          new = '<a class="booking-nav academy-nav" href="english-academy.html">'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("Academy nav protected.")
          elif new in s:
              print("Academy nav already protected.")
          else:
              raise SystemExit("Academy navigation anchor not found")
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: protect English Academy navigation"
          git push
