name: Apple Seed Hero Mode V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hero-mode-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Hero mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          BUILDER=Path('site-builder.html')
          INDEX=Path('index.html')
          BM='APPLE_SEED_HERO_MODE_ADMIN_V1'
          IM='APPLE_SEED_HERO_MODE_RUNTIME_V1'

          b=BUILDER.read_text(encoding='utf-8')
          i=INDEX.read_text(encoding='utf-8')

          builder_script=r'''<script id="APPLE_SEED_HERO_MODE_ADMIN_V1">
          (function(){
            'use strict';
            const KEY='APPLE_SEED_HERO_MODE_DRAFT_V1';
            const VALID=['slider','phones'];
            const client=window.supabaseClient;
            const STAGE_SELECTOR='section.as3-hero>div.as3-wrap>div.as3-main:nth-of-type(1)>div.as3-stage:nth-of-type(2)';
            let panel;

            function valid(v){return VALID.includes(v)?v:'slider'}
            function get(){try{return valid(localStorage.getItem(KEY))}catch(_){return 'slider'}}
            function set(v){
              v=valid(v);
              try{localStorage.setItem(KEY,v)}catch(_){ }
              render(v);
              const f=document.getElementById('preview');
              try{f?.contentWindow?.postMessage({type:'APPLE_SEED_HERO_MODE_V1',mode:v},location.origin)}catch(_){ }
            }
            function label(v){return v==='slider'?'🎞 HERO SLIDER':'📱 HERO 6 ĐIỆN THOẠI'}
            function render(v){
              if(!panel)return;
              panel.querySelectorAll('[data-hero-mode]').forEach(x=>{
                const on=x.dataset.heroMode===v;
                x.classList.toggle('active',on);
                x.setAttribute('aria-pressed',on?'true':'false');
              });
              const s=panel.querySelector('[data-hero-live]');
              if(s)s.textContent='Đang chọn: '+label(v);
            }
            async function readLive(){
              if(!client)return null;
              try{
                const r=await client.from('site_builder_versions').select('config,version_no').eq('site_key','default').eq('status','published').order('version_no',{ascending:false}).limit(1).maybeSingle();
                if(r.error)return null;
                return r.data||null;
              }catch(_){return null}
            }
            async function initMode(){
              let draft='';
              try{draft=localStorage.getItem(KEY)||''}catch(_){ }
              if(!VALID.includes(draft)){
                const live=await readLive();
                const liveMode=valid(live?.config?.hero_mode);
                try{localStorage.setItem(KEY,liveMode)}catch(_){ }
                draft=liveMode;
              }
              render(valid(draft));
            }
            function makePanel(){
              if(panel||!document.querySelector('.side.right'))return;
              panel=document.createElement('div');
              panel.className='panel';
              panel.id='appleSeedHeroModePanel';
              panel.innerHTML='<h3>🎛 Chế độ Hero</h3>'+
                '<div class="muted" style="margin-bottom:8px">Website chỉ hiển thị <b>một</b> kiểu Hero sau khi reload.</div>'+
                '<div style="display:grid;gap:7px">'+
                '<button type="button" class="btn" data-hero-mode="slider" style="width:100%;text-align:left">🎞 <b>HERO SLIDER</b><small style="display:block;color:#667085;font-weight:500;margin-top:3px">Chỉ hiện Slider, ẩn 6 điện thoại</small></button>'+
                '<button type="button" class="btn" data-hero-mode="phones" style="width:100%;text-align:left">📱 <b>HERO 6 ĐIỆN THOẠI</b><small style="display:block;color:#667085;font-weight:500;margin-top:3px">Tắt Slider, hiện lại 6 điện thoại gốc</small></button>'+
                '</div><div data-hero-live style="margin-top:8px;font-size:10px;font-weight:850;color:#1769ff"></div>'+
                '<div class="muted" style="margin-top:6px">Chọn xong bấm 🚀 Xuất bản để áp dụng LIVE.</div>';
              const right=document.querySelector('.side.right');
              right.insertBefore(panel,right.firstElementChild);
              panel.querySelectorAll('[data-hero-mode]').forEach(btn=>btn.addEventListener('click',()=>set(btn.dataset.heroMode)));
              render(get());
            }
            const timer=setInterval(()=>{if(document.querySelector('.side.right')){makePanel();clearInterval(timer);}},100);
            setTimeout(()=>clearInterval(timer),30000);
            document.getElementById('clear')?.addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(_){}});
            window.addEventListener('load',initMode);
            setTimeout(initMode,500);
          })();
          </script>'''

          index_head=r'''<style id="APPLE_SEED_HERO_MODE_RUNTIME_CSS_V1">
          html.apple-seed-hero-mode-pending .as3-phone{visibility:hidden!important}
          html.apple-seed-hero-mode-pending .apple-seed-hero-slider,
          html.apple-seed-hero-mode-pending .apple-seed-runtime-slider-host,
          html.apple-seed-hero-mode-pending #apple-seed-runtime-slider{visibility:hidden!important}
          html[data-apple-seed-hero-mode="slider"] .as3-phone{display:none!important}
          html[data-apple-seed-hero-mode="phones"] .apple-seed-hero-slider,
          html[data-apple-seed-hero-mode="phones"] .apple-seed-runtime-slider-host > .apple-seed-runtime-slider,
          html[data-apple-seed-hero-mode="phones"] #apple-seed-runtime-slider{display:none!important}
          html[data-apple-seed-hero-mode="phones"] .as3-stage.apple-seed-runtime-slider-host > .as3-phone{display:block!important;visibility:visible!important}
          html[data-apple-seed-hero-mode="slider"] .apple-seed-hero-slider,
          html[data-apple-seed-hero-mode="slider"] .as3-stage.apple-seed-runtime-slider-host > .apple-seed-runtime-slider,
          html[data-apple-seed-hero-mode="slider"] #apple-seed-runtime-slider{visibility:visible!important}
          </style>
          <script id="APPLE_SEED_HERO_MODE_EARLY_V1">document.documentElement.classList.add('apple-seed-hero-mode-pending');</script>'''

          index_script=r'''<script id="APPLE_SEED_HERO_MODE_RUNTIME_V1">
          (function(){
            'use strict';
            const KEY='APPLE_SEED_HERO_MODE_DRAFT_V1';
            const VALID=['slider','phones'];
            const client=window.supabaseClient;
            function valid(v){return VALID.includes(v)?v:'slider'}
            function apply(mode){
              mode=valid(mode);
              document.documentElement.dataset.appleSeedHeroMode=mode;
              document.documentElement.classList.remove('apple-seed-hero-mode-pending');
              document.querySelectorAll('.as3-phone').forEach(el=>{el.style.removeProperty('visibility')});
              try{window.dispatchEvent(new CustomEvent('appleSeedHeroModeChanged',{detail:{mode}}))}catch(_){ }
            }
            async function liveMode(){
              if(!client)return 'slider';
              try{
                const r=await client.from('site_builder_versions').select('config,version_no').eq('site_key','default').eq('status','published').order('version_no',{ascending:false}).limit(1).maybeSingle();
                return valid(r.data?.config?.hero_mode);
              }catch(_){return 'slider'}
            }
            async function init(){
              const isPreview=new URLSearchParams(location.search).get('builderCanvas')==='1' || new URLSearchParams(location.search).get('appleSeedBuilderPreview')==='1';
              if(isPreview){
                let d='';try{d=localStorage.getItem(KEY)||''}catch(_){ }
                apply(valid(d||'slider'));
              }else{
                apply(await liveMode());
              }
            }
            window.addEventListener('message',e=>{
              if(e.origin===location.origin && e.data?.type==='APPLE_SEED_HERO_MODE_V1')apply(e.data.mode);
            });
            init();
          })();
          </script>'''

          if BM not in b:
              # Add mode to the existing publish payload without depending on minified line layout.
              pub=b.find("$('publish').onclick=async()=>{")
              if pub<0: raise SystemExit('Builder publish handler not found')
              snap=b.find('const payload=snapshot();',pub)
              if snap<0: raise SystemExit('Builder publish snapshot not found')
              end=b.find('\n',snap)
              if end<0:end=len(b)
              b=b[:end]+'\n  payload.hero_mode=(function(){try{return localStorage.getItem(\'APPLE_SEED_HERO_MODE_DRAFT_V1\')||\'slider\'}catch(_){return \'slider\'}})();'+b[end:]
              # Preserve the already-published slider if the builder draft accidentally has an empty slider.
              helper=r'''\n  try{\n    const __live=await window.supabaseClient.from('site_builder_versions').select('config,version_no').eq('site_key','default').eq('status','published').order('version_no',{ascending:false}).limit(1).maybeSingle();\n    const __sel='section.as3-hero>div.as3-wrap>div.as3-main:nth-of-type(1)>div.as3-stage:nth-of-type(2)';\n    const __ls=__live.data?.config?.items?.[__sel]?.slider;\n    const __ds=payload?.items?.[__sel]?.slider;\n    const __li=Array.isArray(__ls?.images)?__ls.images:[];\n    const __di=Array.isArray(__ds?.images)?__ds.images:[];\n    if(__li.some(x=>x&&String(x.src||'').trim()) && __di.length===0){\n      payload.items=payload.items||{}; payload.items[__sel]=payload.items[__sel]||{};\n      payload.items[__sel].slider=JSON.parse(JSON.stringify(__ls));\n    }\n  }catch(__e){console.warn('Hero slider publish guard',__e)}'''
              # Insert immediately after hero_mode assignment.
              marker_line="payload.hero_mode=(function(){try{return localStorage.getItem('APPLE_SEED_HERO_MODE_DRAFT_V1')||'slider'}catch(_){return 'slider'}})();"
              b=b.replace(marker_line,marker_line+helper,1)
              b=b.replace('</body>',builder_script+'\n</body>',1)

          if IM not in i:
              i=i.replace('</style>',index_head+'\n</style>',1)
              i=i.replace('</body>',index_script+'\n</body>',1)

          BUILDER.write_text(b,encoding='utf-8')
          INDEX.write_text(i,encoding='utf-8')
          print('Hero mode patch applied.')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q "APPLE_SEED_HERO_MODE_ADMIN_V1" site-builder.html
          grep -q "APPLE_SEED_HERO_MODE_RUNTIME_V1" index.html
          grep -q "payload.hero_mode" site-builder.html
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for fn in ['site-builder.html','index.html']:
              s=Path(fn).read_text(encoding='utf-8')
              for n,js in enumerate(re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S),1):
                  if not js.strip() or js.strip().startswith('http'): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(js); p=f.name
                  r=subprocess.run(['node','--check',p],capture_output=True,text=True)
                  if r.returncode:
                      print(f'{fn} script {n} syntax error:\n{r.stderr}')
                      raise SystemExit(1)
          print('All inline scripts passed node --check.')
          PY
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "Apple Seed Hero Mode"
          git config user.email "0898888269tv@gmail.com"
          git add site-builder.html index.html
          git commit -m "feat: add exclusive Hero Slider or Phone mode"
          git push origin HEAD:main

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/hero-mode-v1.yml
          git commit -m "cleanup: remove temporary hero mode workflow"
          git push origin HEAD:main
