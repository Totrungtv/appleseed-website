name: Fix Schematic Library CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed CSS block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ai-board.html')
          s = p.read_text(encoding='utf-8')
          start = '/* SCHEMATIC_LIBRARY_FULL_IPHONE_IPAD_V1 */'
          nxt = '<style id="apple-seed-schematic-library-polish">'
          if start in s and nxt in s:
              a = s.index(start)
              b = s.index(nxt, a)
              block = s[a:b]
              if '<style' not in block:
                  block = '<style id="apple-seed-schematic-library-base">\n' + block + '\n</style>\n'
                  s = s[:a] + block + s[b:]
                  p.write_text(s, encoding='utf-8')
                  print('Repaired malformed schematic library CSS block.')
              else:
                  print('CSS block already wrapped; no change.')
          else:
              raise SystemExit('Expected schematic library CSS markers were not found.')
          PY
      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('ai-board.html').read_text(encoding='utf-8')
          assert '<style id="apple-seed-schematic-library-base">' in s
          assert '/* SCHEMATIC_LIBRARY_FULL_IPHONE_IPAD_V1 */' in s
          assert s.count('<style id="apple-seed-schematic-library-base">') == 1
          print('HTML/CSS marker validation passed.')
          PY
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-board.html
          git diff --cached --quiet && { echo 'No changes to commit.'; exit 0; }
          git commit -m 'Fix malformed schematic library CSS'
          git push
          rm -f .github/workflows/fix-library-css.yml .as-fix-library-css
          git add -A
          git commit -m 'chore: remove one-time library CSS fixer'
          git push
