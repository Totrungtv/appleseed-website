name: Repair Index Builder V2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final repair
        run: python3 .github/repair_index_builder_v2.py
      - name: Validate Builder and Index JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for src,out in [('site-builder.html','/tmp/builder.js'),('index.html','/tmp/index.js')]:
              s=Path(src).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
              Path(out).write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/builder.js
          node --check /tmp/index.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-builder.html index.html
          git diff --cached --quiet || git commit -m 'fix: unify index and site builder canvas'
          git rm -f .github/repair_index_builder.py .github/repair_index_builder_v2.py .github/workflows/repair-index-builder.yml .github/workflows/repair-index-builder-v2.yml .github/workflows/unify-index-builder.yml .github/unify-index-builder-trigger || true
          git commit -m 'chore: remove temporary builder repair workflows' || true
          git push
