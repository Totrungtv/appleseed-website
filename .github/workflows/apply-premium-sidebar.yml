name: Apply Apple Seed Premium Sidebar
on:
  push:
    paths:
      - .github/workflows/apply-premium-sidebar.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sidebar safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site-builder.html')
          s=p.read_text(encoding='utf-8')
          marker='/* APPLE_SEED_SIDEBAR_PREMIUM_V1 */'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          css=r'''/* APPLE_SEED_SIDEBAR_PREMIUM_V1 */
          :root{--as-side-line:#e6eaf0;--as-side-blue:#1769ff;--as-side-ink:#172033;--as-side-shadow:0 8px 28px rgba(16,24,40,.06)}
          .side{background:linear-gradient(180deg,#fbfcfe 0%,#f6f8fb 100%)!important;padding:10px!important;scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}.side::-webkit-scrollbar{width:7px}.side::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}.side .panel{position:relative;border:1px solid var(--as-side-line)!important;border-radius:15px!important;background:rgba(255,255,255,.94)!important;box-shadow:var(--as-side-shadow);padding:12px!important;margin-bottom:9px!important;transition:border-color .18s,box-shadow .18s}.side .panel:hover{border-color:#d8e2f2!important;box-shadow:0 10px 32px rgba(16,24,40,.08)}.side .panel.as3-collapsed{padding-bottom:8px!important}.side .panel.as3-collapsed>*:not(h3){display:none!important}.side .panel h3{font-size:11px!important;letter-spacing:.15px;color:#273247!important;display:flex;align-items:center;gap:7px;min-height:22px;margin:0!important;padding-right:25px;cursor:pointer;user-select:none}.side .panel h3::after{content:'⌄';position:absolute;right:12px;top:12px;font-size:14px;color:#98a2b3;transition:transform .18s}.side .panel.as3-collapsed h3::after{transform:rotate(-90deg)}.side .hint{border:1px solid #dce8ff!important;background:linear-gradient(135deg,#f7faff,#eef5ff)!important;color:#475467!important;border-radius:11px!important}.side .btn{border-radius:10px!important;border-color:#dfe5ed!important;transition:transform .12s,box-shadow .12s}.side .btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(16,24,40,.07)}.side .btn.primary{box-shadow:0 7px 18px rgba(23,105,255,.18)!important}.side .field input,.side .field textarea,.side .field select{border-color:#dfe5ed!important;border-radius:10px!important;background:#fbfcfe!important;transition:border-color .15s,box-shadow .15s}.side .field input:focus,.side .field textarea:focus,.side .field select:focus{border-color:#8bb0ff!important;box-shadow:0 0 0 3px rgba(23,105,255,.10)!important;background:#fff!important}.as3-side-head{display:flex;align-items:center;gap:9px;padding:8px 4px 11px;position:sticky;top:-10px;z-index:5;background:linear-gradient(180deg,#f9fbfd 75%,rgba(249,251,253,0));margin:0 -2px 3px}.as3-side-logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#1769ff,#4e8dff);color:#fff;display:grid;place-items:center;font-weight:950;box-shadow:0 7px 18px rgba(23,105,255,.22)}.as3-side-title{font-size:12px;font-weight:950;letter-spacing:.2px;color:#172033}.as3-side-sub{font-size:9px;color:#8a94a2;margin-top:1px}.as3-side-status{margin-left:auto;font-size:8px;font-weight:900;color:#16834a;background:#eafaf1;border:1px solid #ccefdc;padding:4px 7px;border-radius:999px}.as3-side-search{display:flex;align-items:center;gap:7px;margin:0 0 9px;background:#fff;border:1px solid #e1e7ef;border-radius:11px;padding:7px 9px;box-shadow:0 5px 18px rgba(16,24,40,.04)}.as3-side-search span{font-size:12px}.as3-side-search input{border:0;outline:0;width:100%;font-size:10px;background:transparent;color:#172033}.as3-side-search input::placeholder{color:#98a2b3}.as3-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:9px}.as3-quick button{border:1px solid #e1e7ef;background:#fff;border-radius:10px;padding:7px 3px;font-size:9px;font-weight:850;color:#344054;cursor:pointer}.as3-quick button:hover{border-color:#9dbaff;background:#f7faff;color:#1769ff}.as3-object-card{margin-top:8px;padding:9px;border-radius:11px;background:#f7f9fc;border:1px solid #e6eaf0;font-size:9px;color:#667085;line-height:1.45;word-break:break-word}.as3-object-card b{display:block;color:#172033;font-size:10px;margin-bottom:3px}#imagePanel .image-preview{width:100%;height:145px;max-height:145px;border-radius:11px;background:linear-gradient(135deg,#f5f7fa,#eef2f7);border:1px solid #e3e8ef;padding:5px;object-fit:contain}.side .drop{background:linear-gradient(135deg,#fafcff,#f5f8fc);border:1px dashed #aebbd0!important;border-radius:10px!important;padding:10px!important;font-weight:800;color:#526071;transition:.15s}.side .drop:hover{border-color:#1769ff!important;background:#f4f8ff!important;color:#1769ff}.layers{max-height:360px!important;gap:5px!important}.layer{border:1px solid #e7ebf1!important;background:#fbfcfe!important;border-radius:9px!important;padding:8px!important;font-size:9px!important}.layer.active{border-color:#7ea6ff!important;background:#eff5ff!important;box-shadow:inset 3px 0 #1769ff}.as3-layer-tools{display:flex;gap:5px;margin:7px 0}.as3-layer-tools input{width:100%;border:1px solid #e0e6ee;border-radius:9px;padding:7px 8px;font-size:9px;outline:0}.as3-layer-tools button{border:1px solid #e0e6ee;background:#fff;border-radius:9px;padding:6px 8px;cursor:pointer}.history{max-height:280px!important}.history-item{border:1px solid #e7ebf1!important;border-radius:9px!important;background:#fbfcfe}.history-item:hover{background:#f7faff;border-color:#c9d8f5!important}
          '''
          js=r'''/* APPLE_SEED_SIDEBAR_PREMIUM_JS */(()=>{const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],L=q('.side.left'),R=q('.side.right');if(!L||!R)return;function head(side,icon,title,sub){if(side.querySelector('.as3-side-head'))return;const h=document.createElement('div');h.className='as3-side-head';h.innerHTML=`<div class="as3-side-logo">${icon}</div><div><div class="as3-side-title">${title}</div><div class="as3-side-sub">${sub}</div></div><span class="as3-side-status">LIVE</span>`;side.prepend(h)}head(L,'S','APPLE SEED','CONTROL CENTER');head(R,'✦','INSPECTOR','DESIGN STUDIO');function search(side,ph){const b=document.createElement('div');b.className='as3-side-search';b.innerHTML=`<span>⌕</span><input type="search" placeholder="${ph}">`;side.querySelector('.as3-side-head').after(b);return b.querySelector('input')}const ls=search(L,'Tìm công cụ, thành phần…'),rs=search(R,'Tìm thuộc tính, thao tác…');const qb=document.createElement('div');qb.className='as3-quick';qb.innerHTML='<button data-q="image">🖼 Ảnh</button><button data-q="hero">🎯 Hero</button><button data-q="ai">🤖 AI</button>';R.querySelector('.as3-side-search').after(qb);qb.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.q==='image')q('#pick')?.click();if(b.dataset.q==='hero')q('#targetHero')?.click();if(b.dataset.q==='ai')q('#aiOpen')?.click()};const info=q('#info');if(info&&!info.dataset.premium){info.dataset.premium='1';const w=document.createElement('div');w.className='as3-object-card';info.parentElement.appendChild(w);const u=()=>{const t=(info.textContent||'Chưa chọn').trim();w.innerHTML=`<b>Đang chỉnh</b>${t.length>220?t.slice(0,220)+'…':t}`};u();new MutationObserver(u).observe(info,{childList:true,subtree:true,characterData:true})}function collapse(S,keep){qa(S===L?'.side.left .panel h3':'.side.right .panel h3').forEach(h=>{const p=h.parentElement;if(!p||keep.includes(p.id))return;h.addEventListener('click',()=>p.classList.toggle('as3-collapsed'))})}collapse(L,[]);collapse(R,['imagePanel','pageDesignPanel']);function filter(i,S){i.addEventListener('input',()=>{const t=i.value.trim().toLowerCase();qa(S===L?'.side.left .panel':'.side.right .panel').forEach(p=>p.style.display=!t||p.innerText.toLowerCase().includes(t)?'':'none')})}filter(ls,L);filter(rs,R);const lp=q('#layerList')?.closest('.panel');if(lp&&!lp.querySelector('.as3-layer-tools')){const t=document.createElement('div');t.className='as3-layer-tools';t.innerHTML='<input id="as3LayerSearch" placeholder="Lọc layer…"><button title="Xóa lọc">×</button>';lp.querySelector('h3')?.after(t);const i=t.querySelector('input');i.oninput=()=>qa('#layerList .layer').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(i.value.toLowerCase())?'':'none');t.querySelector('button').onclick=()=>{i.value='';i.dispatchEvent(new Event('input'))}}document.addEventListener('keydown',e=>{if(e.ctrlKey&&!e.shiftKey&&e.key.toLowerCase()==='s'){e.preventDefault();q('#save')?.click()}if(e.ctrlKey&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();q('#undo')?.click()}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();q('#redo')?.click()}if(e.key==='Escape')qa('.as3-collapsed').forEach(x=>x.classList.remove('as3-collapsed'))});window.__APPLE_SEED_SIDEBAR_PREMIUM_V1__=true})();'''
          s=s.replace('</head>','<style>'+css+'</style>\n</head>',1)
          s=s.replace('</body>','<script>'+js+'</script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 /tmp/patch.py
      - name: Commit premium sidebar
        run: |
          git config user.name "apple-seed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site-builder.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: upgrade Visual Builder sidebar to Premium"
          git push
