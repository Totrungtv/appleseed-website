name: Add English Academy navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Academy link to index
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          text = p.read_text(encoding="utf-8")

          marker = 'href="english-academy.html"'
          if marker in text:
              print("English Academy link already exists; nothing to do.")
              raise SystemExit(0)

          anchor = '<a class="booking-nav" href="booking.html"><span class="mi">📅</span><span>Đặt lịch</span></a>'
          if anchor not in text:
              raise SystemExit("Could not find the existing booking navigation anchor in index.html")

          academy = '<a class="academy-nav" href="english-academy.html"><span class="mi">🎓</span><span>English Academy</span></a>\n'
          text = text.replace(anchor, academy + anchor, 1)

          p.write_text(text, encoding="utf-8")
          print("English Academy navigation inserted.")

      - name: Commit index change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change to commit."
            exit 0
          fi
          git commit -m "feat: add English Academy navigation"
          git push
