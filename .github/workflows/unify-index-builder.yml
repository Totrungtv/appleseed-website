name: Unify Index and Site Builder
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unify:
    if: contains(github.event.head_commit.message, 'trigger unify index builder')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Builder and live index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site-builder.html')
          s = p.read_text(encoding='utf-8')
          marker = 'AI_BOARD_INDEX_BUILDER_UNIFIED_V1'
          if marker not in s:
              old = '<button class="btn" id="syncLive">🔄 Đồng bộ LIVE</button><button class="btn primary" id="publish">🚀 Xuất bản</button>'
              new = '<button class="btn" id="syncLive">🔄 Đồng bộ LIVE</button><button class="btn" id="unifyIndexBuilder" style="border-color:#1769ff;color:#1769ff;background:#eef5ff">🧬 Hợp nhất INDEX ↔ BUILDER</button><button class="btn primary" id="publish">🚀 Xuất bản</button>'
              if old not in s:
                  raise SystemExit('Builder toolbar anchor not found')
              s = s.replace(old, new, 1)

              anchor = "$('syncLive').onclick=async()=>{"
              if anchor not in s:
                  raise SystemExit('syncLive handler anchor not found')
              fn = r'''/* AI_BOARD_INDEX_BUILDER_UNIFIED_V1
 * INDEX.html is the canonical canvas. This command refreshes the real index,
 * keeps the current Builder draft, removes stale selectors, then reapplies the
 * draft on top of the freshly loaded index. It never publishes by itself.
 */
async function unifyIndexAndBuilder(){
  if(!allowed){toast('Tài khoản không có quyền');return}
  const btn=$('unifyIndexBuilder');
  if(btn)btn.disabled=true;
  setStatus('Đang hợp nhất INDEX ↔ BUILDER…');
  try{
    const preserved=JSON.parse(JSON.stringify(draft||{items:{},page:{desktop:{},mobile:{}}}));
    localStorage.setItem(DRAFT_KEY,JSON.stringify(preserved));
    const beforeSelectors=Object.keys(preserved.items||{});
    const p=$('preview');
    if(!p)throw new Error('Không tìm thấy canvas INDEX.');
    const waitForLoad=new Promise((resolve,reject)=>{
      let done=false;
      const finish=ok=>{if(done)return;done=true;clearTimeout(timer);p.removeEventListener('load',onload);ok?resolve():reject(new Error('INDEX không tải được.'))};
      const onload=()=>finish(true);
      const timer=setTimeout(()=>finish(false),15000);
      p.addEventListener('load',onload,{once:true});
    });
    const u=new URL('index.html',location.href);
    u.searchParams.set('appleSeedBuilderPreview','1');
    u.searchParams.set('builderCanvas','1');
    u.searchParams.set('v','unified-'+Date.now());
    p.dataset.builderRetry='';
    p.src=u.toString();
    await waitForLoad;

    doc=p.contentDocument;
    if(!doc?.body)throw new Error('INDEX đã tải nhưng không có nội dung.');
    captureBuilderImageBaseline();

    const fresh={items:{},page:preserved.page||{desktop:{},mobile:{}}};
    for(const sel of beforeSelectors){
      let el=null;
      try{el=doc.querySelector(sel)}catch(_){el=null}
      if(el)fresh.items[sel]=preserved.items[sel];
    }
    draft=fresh;
    localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));
    applyAll();
    refreshPageDesign();
    renderLayers();
    refreshOverlay();
    const kept=Object.keys(draft.items||{}).length;
    setStatus('INDEX ↔ BUILDER đã hợp nhất · '+kept+'/'+beforeSelectors.length+' override hợp lệ');
    toast('🧬 Đã hợp nhất INDEX thật với Builder — sẵn sàng chỉnh sửa');
  }catch(e){
    console.error('Unify INDEX ↔ Builder:',e);
    try{draft=preserved||draft;localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));applyAll()}catch(_){}
    setStatus('Hợp nhất thất bại — Builder không bị mất nháp');
    toast('⚠️ Hợp nhất lỗi: '+(e?.message||'Không xác định'));
  }finally{
    if(btn)btn.disabled=false;
  }
}

'''
              s = s.replace(anchor, fn + anchor, 1)

              oldbind = "$('syncLive').onclick=async()=>{"
              # Bind the new button immediately before syncLive binding.
              s = s.replace(oldbind, "$('unifyIndexBuilder').onclick=unifyIndexAndBuilder;\n" + oldbind, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('site-builder-runtime.js')
          s = p.read_text(encoding='utf-8')
          marker2 = 'AI_BOARD_INDEX_BUILDER_UNIFIED_RUNTIME_V1'
          if marker2 not in s:
              anchor = 'if(!el && item.src && selector.indexOf(".as3-screen")!==-1){'
              replacement = r'''/* AI_BOARD_INDEX_BUILDER_UNIFIED_RUNTIME_V1 */
    if(!el && (item.src || item.bgImage) && selector.indexOf(".as3-screen")!==-1){
      /* Dynamic product rendering can recreate .as3-screen children. Resolve
         the original phone slot from its stable .as3-pN class instead of ever
         falling back to the first phone. */
      var slotMatch=selector.match(/\.as3-p(\d+)\b/);
      var slotIndex=slotMatch?Math.max(1,Number(slotMatch[1])):0;
      el=slotIndex?document.querySelector(".as3-p"+slotIndex+" .as3-screen"):document.querySelector(".as3-screen");
      if(el && item.src){
        el.querySelectorAll(":scope > img").forEach(function(img){img.remove()});
        var customImg=document.createElement("img");
        customImg.src=String(item.src);
        customImg.alt="iPhone";
        customImg.loading="eager";
        customImg.decoding="async";
        customImg.onerror=function(){customImg.remove()};
        el.appendChild(customImg);
      }
    }
    if(false){'''
              if anchor not in s:
                  raise SystemExit('runtime image fallback anchor not found')
              # Replace the old block only by wrapping it unreachable, then close it before the following !el guard.
              s = s.replace(anchor, replacement, 1)
              old = '''        el.appendChild(customImg);
      }
    }
    if(!el) return;'''
              new = '''        el.appendChild(customImg);
      }
    }
    }
    if(!el) return;'''
              if old not in s:
                  raise SystemExit('runtime fallback close anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker3 = 'AI_BOARD_INDEX_BUILDER_CANONICAL_HERO_V1'
          if marker3 not in s:
              old = '''.as3-stage > .as3-phone{
  display:none!important;
}'''
              new = '''.as3-stage > .as3-phone{
  display:block!important;
}
/* AI_BOARD_INDEX_BUILDER_CANONICAL_HERO_V1
   The real index and Builder must render the same Hero phone slots. */'''
              if old not in s:
                  raise SystemExit('hidden phone CSS anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

          node --check <(python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('site-builder.html').read_text(encoding='utf-8')
          print(re.search(r'<script>(.*?)</script>',s,re.S).group(1))
          PY
          )
          node --check <(python3 - <<'PY'
          from pathlib import Path
          print(Path('site-builder-runtime.js').read_text(encoding='utf-8'))
          PY
          )
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-builder.html site-builder-runtime.js index.html
          git commit -m 'fix: unify index and site builder canvas'
          git rm .github/workflows/unify-index-builder.yml .github/unify-index-builder-trigger
          git commit -m 'chore: remove temporary unify workflow'
          git push
