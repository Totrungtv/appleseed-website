name: Build Apple Seed App Watch

on:
  push:
    paths:
      - 'appwatch/**'
      - '.github/workflows/build-appwatch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: appwatch
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appwatch-v1.0.0
          name: Apple Seed App Watch v1.0.0
          body: Apple Seed App Watch — scanner adware/bloatware and app manager.
          files: appwatch/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
