name: Install Slider Editor V3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'install slider editor v3') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch slider manager
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('site-builder.html')
          s=p.read_text(encoding='utf-8')
          if 'APPLE_SEED_SLIDER_MANAGER_V3' in s:
              print('already installed')
              raise SystemExit(0)
          new_script=Path('slider-manager-v3.js').read_text(encoding='utf-8')
          pat=r'<script id="APPLE_SEED_SLIDER_MANAGER_V2">[\s\S]*?</script>'
          s2,n=re.subn(pat,new_script,s,count=1)
          if n!=1:
              raise SystemExit(f'old slider manager block not found: {n}')
          p.write_text(s2,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-builder.html
          git commit -m 'install slider editor v3'
          git push
      - name: Remove patch payload and workflow
        if: success()
        run: |
          git rm slider-manager-v3.js .github/workflows/slider-manager-v3.yml
          git commit -m 'cleanup slider editor v3 installer'
          git push
