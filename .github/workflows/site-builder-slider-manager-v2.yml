name: Install Slider Image Manager V2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'install slider image manager') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site-builder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site-builder.html')
          s=p.read_text(encoding='utf-8')
          marker='APPLE_SEED_SLIDER_MANAGER_V2'
          if marker in s:
              print('already installed')
              raise SystemExit(0)
          js=r'''<script id="APPLE_SEED_SLIDER_MANAGER_V2">
          (function(){
            'use strict';
            var panel,grid,replaceBtn,delBtn,status,activeIndex=0;
            function q(id){return document.getElementById(id)}
            function doc(){var f=q('preview');return f&&f.contentDocument}
            function list(){
              var d=doc(); if(!d)return [];
              var out=[],seen=[];
              ['.apple-seed-runtime-slider-host img','.apple-seed-hero-slider .apple-seed-hero-slide img','.apple-seed-hero-slider img'].forEach(function(sel){
                try{d.querySelectorAll(sel).forEach(function(img){var src=img.currentSrc||img.src||img.getAttribute('src')||'';if(src&&!seen.includes(src)){seen.push(src);out.push(img)}})}catch(e){}
              });
              return out;
            }
            function select(i){
              var a=list();if(!a[i])return;activeIndex=i;
              a.forEach(function(x,n){x.style.outline=n===i?'3px solid #1769ff':''});
              try{a[i].click()}catch(e){}
              render();
            }
            function render(){
              if(!grid)return;var a=list();grid.innerHTML='';
              if(!a.length){grid.innerHTML='<div style="font-size:11px;color:#667085;padding:8px">Chưa tìm thấy ảnh Slider.</div>';return}
              a.forEach(function(img,i){
                var b=document.createElement('button');b.type='button';b.title='Ảnh Slider '+(i+1);b.style.cssText='border:2px solid '+(i===activeIndex?'#1769ff':'#e3e8ef')+';border-radius:8px;background:#fff;padding:3px;cursor:pointer;aspect-ratio:16/10;overflow:hidden;position:relative';
                var im=document.createElement('img');im.src=img.currentSrc||img.src;im.style.cssText='width:100%;height:100%;object-fit:cover;display:block';b.appendChild(im);
                var n=document.createElement('span');n.textContent=String(i+1);n.style.cssText='position:absolute;left:4px;top:4px;background:#17202a;color:#fff;border-radius:5px;padding:2px 5px;font:800 9px system-ui';b.appendChild(n);
                b.onclick=function(){select(i)};grid.appendChild(b);
              });
              status.textContent=a.length+' ảnh trong Slider';delBtn.disabled=a.length<=1;
            }
            function removeActive(){
              var a=list();if(!a.length)return;
              if(a.length<=1){status.textContent='Slider phải còn ít nhất 1 ảnh';return}
              if(!confirm('Xóa ảnh Slider số '+(activeIndex+1)+' khỏi Slider?'))return;
              var img=a[activeIndex]||a[0],node=img.closest('.apple-seed-hero-slide,.apple-seed-runtime-slide,.apple-seed-runtime-slide-wrap')||img;
              try{node.remove()}catch(e){img.remove()}
              activeIndex=Math.max(0,Math.min(activeIndex,list().length-1));render();
              status.textContent='Đã xóa ảnh khỏi Preview — hãy bấm Xuất bản để lưu.';
            }
            function replaceActive(){var f=q('file');if(f)f.click()}
            function build(){
              if(panel)return;var right=document.querySelector('.right');if(!right)return;
              panel=document.createElement('div');panel.id='appleSeedSliderPanel';panel.className='panel';
              panel.innerHTML='<h3>🎞 Slider — Tất cả ảnh</h3><div id="asSliderGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:280px;overflow:auto;padding:2px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px"><button class="btn" id="asSliderReplace">🖼 Thay ảnh</button><button class="btn danger" id="asSliderDelete">🗑 Xóa ảnh</button></div><div id="asSliderStatus" class="muted" style="margin-top:6px"></div>';
              right.insertBefore(panel,right.firstChild);
              grid=q('asSliderGrid');replaceBtn=q('asSliderReplace');delBtn=q('asSliderDelete');status=q('asSliderStatus');
              replaceBtn.onclick=replaceActive;delBtn.onclick=removeActive;
              var f=q('file');if(f)f.addEventListener('change',function(){setTimeout(render,500)});
              render();
            }
            function boot(){build();var f=q('preview');if(f)f.addEventListener('load',function(){setTimeout(render,300);setTimeout(render,1200)});setInterval(render,1200)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
          })();
          </script>'''
          if '</body>' not in s:
              raise SystemExit('site-builder.html missing </body>')
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-builder.html
          git commit -m 'install slider image manager'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/site-builder-slider-manager-v2.yml
          git commit -m 'cleanup slider manager installer'
          git push
