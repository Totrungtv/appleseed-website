name: Entertainment PR-safe one-shot patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/entertainment-image-handler-20260924'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate RSS image error handler
        shell: python
        run: |
          from pathlib import Path
          p = Path('entertainment.html')
          s = p.read_text(encoding='utf-8')
          old = """document.addEventListener('error',e=>{\n const img=e.target;if(!(img instanceof HTMLImageElement))return;\n let candidates=[];try{candidates=JSON.parse(decodeURIComponent(img.dataset.imageCandidates||'[]'));}catch(_){}\n if(!candidates.length)return;\n let idx=Number(img.dataset.imageIndex||0),variant=Number(img.dataset.imageVariant||0);\n if(variant<3){variant++;img.dataset.imageVariant=String(variant);img.src=imageProxyUrl(candidates[idx],variant);return;}\n if(idx+1<candidates.length){idx++;img.dataset.imageIndex=String(idx);img.dataset.imageVariant='0';img.src=imageProxyUrl(candidates[idx],0);return;}\n img.removeAttribute('src');img.style.display='none';\n},{capture:true});\n"""
          if old not in s:
              raise SystemExit('expected duplicate image error handler not found; refusing unsafe rewrite')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')
      - name: Validate and remove one-shot workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('entertainment.html').read_text(encoding='utf-8')
          assert "function installImageFallbacks()" in s
          assert "document.addEventListener('error',function(e){" in s
          assert "document.addEventListener('error',e=>{" not in s
          print('Entertainment image error handler validation: PASS')
          PY
          rm -f .github/workflows/entertainment-hotfix-once.yml .github/workflows/entertainment-hotfix-pr.yml
      - name: Commit patch only
        shell: bash
        run: |
          git config user.name "Apple Seed Stable Guard"
          git config user.email "0898888269tv@gmail.com"
          git add entertainment.html .github/workflows/entertainment-hotfix-once.yml .github/workflows/entertainment-hotfix-pr.yml
          git commit -m "fix(entertainment): remove duplicate RSS image error handler"
          git push