name: Verify Site Builder image replace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Builder image replacement
        run: |
          set -euo pipefail
          grep -q 'APPLE_SEED_IMAGE_REPLACE_SELECTED_V2' site-builder.html
          grep -q 'site-builder-image-controls.js' site-builder.html
          grep -q 'APPLE_SEED_IMAGE_CONTROLS_V1' site-builder.html
          grep -q 'appleSeedVisualBuilderImageOverridesV3' site-builder-image-controls.js
          grep -q 'function beforePublish' site-builder-image-controls.js
          grep -q 'function getDoc' site-builder-image-controls.js
          node --check site-builder-image-controls.js
          git diff --check
          echo 'Builder image replacement/publish persistence controls validated.'
