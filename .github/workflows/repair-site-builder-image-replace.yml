name: Repair Site Builder image replace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: builder-image-replace
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Builder image picker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('site-builder.html')
          s=p.read_text(encoding='utf-8')
          marker='APPLE_SEED_IMAGE_REPLACE_SELECTED_V2'
          if marker not in s:
              old="""$('file').onchange=e=>{
            pendingFile=e.target.files[0]||null;
            if(pendingFile)showLocalImagePreview(pendingFile,'file','imagePreview');
          };"""
              new="""$('file').onchange=async e=>{
            const file=e.target.files[0]||null;
            pendingFile=file;
            if(!file)return;
            if(!selected){toast('Chưa chọn đối tượng ảnh / khối ảnh');return}
            if(!showLocalImagePreview(file,'file','imagePreview')){pendingFile=null;return}
            const before=snapshot();
            try{
              toast('☁️ Đang tải ảnh và thay ảnh đang chọn…');
              const url=await upload(file);
              checkpoint();
              const item=getItem();
              item.imageRemoved=false;
              const phone=as4ImagePhone(selected);
              const img=selected.tagName==='IMG'?selected:(phone?null:selected.querySelector?.('img'));
              if(phone){applyHeroPhoneImage(phone,url);item.bgImage=url;delete item.src}
              else if(img){img.src=url;item.src=url;delete item.bgImage}
              else{selected.style.backgroundImage='url(\"'+url.replaceAll('\\\"','%22')+'\")';item.bgImage=url;delete item.src}
              pendingFile=null;
              e.target.value='';
              $('imageUrl').value=url;
              $('imagePreview').src=url;
              applyAll();
              saveDraft();
              refreshInspector();
              toast('🖼️ Đã thay ảnh đang chọn');
            }catch(err){
              pendingFile=null;
              e.target.value='';
              history.push(before);
              toast('Upload lỗi: '+(err?.message||String(err)));
            }
          };
          /* APPLE_SEED_IMAGE_REPLACE_SELECTED_V2 */"""
              if old not in s:
                  raise SystemExit('main image file onchange handler not found')
              s=s.replace(old,new,1)
          s=s.replace("function pickFile(){const f=q('file');if(f){f.value='';f.click()}}","function pickFile(){const f=q('asSliderFile');if(f){f.value='';f.click()}}",1)
          s=s.replace("function bindFile(){if(fileBound)return;const f=q('file');if(!f)return;fileBound=true;f.addEventListener('change',()=>{const file=f.files?.[0];if(file)handleFile(file)})}","function bindFile(){if(fileBound)return;const f=q('asSliderFile');if(!f)return;fileBound=true;f.addEventListener('change',()=>{const file=f.files?.[0];if(file)handleFile(file)})}",1)
          slider_marker="panel.innerHTML='<h3>🎞 Slider — Tất cả ảnh</h3>"
          slider_repl="panel.innerHTML='<h3>🎞 Slider — Tất cả ảnh</h3><input id=\"asSliderFile\" type=\"file\" accept=\"image/png,image/jpeg,image/webp,image/gif\" hidden>"
          if slider_marker in s:
              s=s.replace(slider_marker,slider_repl,1)
          s=re.sub(r'site-builder-image-controls\\.js\\?v=[^\"\']+','site-builder-image-controls.js?v=20260913-image2',s)
          p.write_text(s,encoding='utf-8')
          print('Image picker patch checked.')
          PY
      - name: Preserve unsaved Builder image edits across reload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site-builder.html')
          s=p.read_text(encoding='utf-8')
          marker='APPLE_SEED_IMAGE_RELOAD_PERSISTENCE_V1'
          if marker in s:
              print('Reload persistence already installed.')
              raise SystemExit(0)
          old="""    if(forcePublished || !localRaw || !localBase || localBase!==publishedVersion){
      draft=JSON.parse(JSON.stringify(r.data.config));
      draft.items=draft.items||{};
      draft.page=draft.page||{desktop:{},mobile:{}};
      draft.page.desktop=draft.page.desktop||{};
      draft.page.mobile=draft.page.mobile||{};
      localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));
    }
    localStorage.setItem(PUBLISHED_VERSION_KEY,publishedVersion);"""
          new="""    if(forcePublished || !localRaw || !localBase || localBase!==publishedVersion){
      const publishedDraft=JSON.parse(JSON.stringify(r.data.config));
      publishedDraft.items=publishedDraft.items||{};
      publishedDraft.page=publishedDraft.page||{desktop:{},mobile:{}};
      publishedDraft.page.desktop=publishedDraft.page.desktop||{};
      publishedDraft.page.mobile=publishedDraft.page.mobile||{};
      // A published version can advance while this browser still has an
      // unsaved image edit. Keep ONLY image overrides from the local draft;
      // do not resurrect stale text/layout/theme changes.
      if(!forcePublished && localRaw && localBase && localBase!==publishedVersion){
        try{
          const localDraft=JSON.parse(localRaw);
          for(const [sel,li] of Object.entries(localDraft.items||{})){
            if(!li || (!('src' in li) && !('bgImage' in li) && !('imageRemoved' in li)))continue;
            const pi=publishedDraft.items[sel]||{styles:{desktop:{},mobile:{}}};
            if(li.src!==undefined)pi.src=li.src;else delete pi.src;
            if(li.bgImage!==undefined)pi.bgImage=li.bgImage;else delete pi.bgImage;
            if(li.imageRemoved!==undefined)pi.imageRemoved=li.imageRemoved;
            publishedDraft.items[sel]=pi;
          }
        }catch(_){ }
      }
      draft=publishedDraft;
      localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));
    }else{
      // Same published version: keep the browser's current unsaved draft.
      try{draft=JSON.parse(localRaw)}catch(_){draft=JSON.parse(JSON.stringify(r.data.config))}
      draft.items=draft.items||{};
      draft.page=draft.page||{desktop:{},mobile:{}};
      draft.page.desktop=draft.page.desktop||{};
      draft.page.mobile=draft.page.mobile||{};
    }
    localStorage.setItem(PUBLISHED_VERSION_KEY,publishedVersion);
    /* APPLE_SEED_IMAGE_RELOAD_PERSISTENCE_V1 */"""
          if old not in s:
              raise SystemExit('loadPublished version gate anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('Installed reload persistence.')
          PY
          git diff --check
          grep -q 'APPLE_SEED_IMAGE_REPLACE_SELECTED_V2' site-builder.html
          grep -q 'APPLE_SEED_IMAGE_RELOAD_PERSISTENCE_V1' site-builder.html
          grep -q "q('asSliderFile')" site-builder.html
          grep -q 'id="asSliderFile"' site-builder.html
          git config user.name "Apple Seed Repair"; git config user.email "0898888269tv@gmail.com"
          if git diff --quiet; then echo "No Builder image persistence changes."; else git add site-builder.html; git commit -m "fix: preserve Builder image edits across reload"; git push origin HEAD:main; fi
