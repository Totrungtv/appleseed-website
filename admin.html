<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Seed — Quản trị website</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
:root{--blue:#2563eb;--bg:#f6f8fb;--line:#e5e7eb;--text:#111827;--muted:#667085}
body{background:var(--bg);color:var(--text)}
.admin-wrap{max-width:1180px;margin:0 auto;padding:30px 18px 70px}
.admin-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}
.admin-top h1{margin:0}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:22px;box-shadow:0 5px 20px rgba(0,0,0,.04)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
.panel-head h2{margin:0}.plus{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.item{border:1px solid var(--line);border-radius:14px;padding:16px}
.item h3{margin:0 0 8px}.item p{margin:5px 0;color:var(--muted);line-height:1.5}
.item-actions{display:flex;gap:8px;margin-top:13px}
.btn2{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer;font-weight:700}
.danger{color:#b42318;border-color:#fecdca}.edit{color:#175cd3}
.form{display:grid;gap:12px;background:#f8fafc;border:1px solid var(--line);padding:16px;border-radius:14px;margin-top:15px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:700;font-size:14px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;font:inherit}textarea{min-height:120px;resize:vertical}
.hidden{display:none}.status{padding:11px 13px;border-radius:10px;margin-bottom:16px;background:#eff8ff;color:#175cd3}.status.error{background:#fef3f2;color:#b42318}
.login{max-width:460px;margin:80px auto;padding:22px}.login h1{margin-top:0}
.small{font-size:13px;color:var(--muted)}
.icon-pop{position:absolute;z-index:9999;background:#fff;border:1px solid #d0d5dd;border-radius:12px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.16);display:grid;grid-template-columns:repeat(8,36px);gap:4px;max-width:330px}.icon-pop.hidden{display:none !important;visibility:hidden !important}
.icon-pop button{border:0;background:#fff;border-radius:7px;font-size:21px;padding:6px;cursor:pointer}
.icon-pop button:hover{background:#f2f4f7}
.upload-status{font-size:13px;color:#475467;margin-top:8px}

@media(max-width:750px){.grid,.form-row{grid-template-columns:1fr}.admin-top{align-items:flex-start;flex-direction:column}}

.native-editor{min-height:300px;padding:16px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;outline:none;line-height:1.7;font-size:16px}
.native-editor:empty:before{content:attr(data-placeholder);color:#98a2b3}
.native-editor img{max-width:100%;height:auto;border-radius:8px}
.native-toolbar{display:flex;flex-wrap:wrap;gap:5px;padding:9px;background:#f8fafc;border:1px solid #d0d5dd;border-top:0;border-radius:0 0 10px 10px}
.native-toolbar button{border:1px solid #d0d5dd;background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;font-weight:700}
.native-toolbar button:hover{background:#f2f4f7}
.native-icon-picker{position:absolute;z-index:1000;display:grid;grid-template-columns:repeat(8,36px);gap:4px;background:#fff;border:1px solid #d0d5dd;border-radius:12px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.16)}
.native-icon-picker[hidden]{display:none!important}
.native-icon-picker button{border:0;background:#fff;border-radius:7px;font-size:21px;padding:6px;cursor:pointer}
.native-upload-status{font-size:13px;color:#475467;margin:7px 0}

.tool-button{border:1px solid #d0d5dd;background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;font-weight:700;display:inline-block}
.tool-button:hover{background:#f2f4f7}
.emoji-box{display:grid;grid-template-columns:repeat(8,36px);gap:4px;background:#fff;border:1px solid #d0d5dd;border-radius:12px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.16);margin-top:5px;max-width:330px}
.emoji-box[hidden]{display:none!important}
.emoji-box button{border:0;background:#fff;border-radius:7px;font-size:21px;padding:6px;cursor:pointer}
.emoji-box button:hover{background:#f2f4f7}
</style>
<link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
</head>
<body>
<div id="loginView" class="panel login">
  <h1>🔐 Apple Seed Admin</h1>
  <p>Đăng nhập tài khoản Supabase của ông để quản lý website.</p>
  <div class="form">
    <label>Email<input id="loginEmail" type="email" autocomplete="username"></label>
    <label>Mật khẩu<input id="loginPassword" type="password" autocomplete="current-password"></label>
    <button class="plus" id="loginBtn">Đăng nhập</button>
  </div>
  <p id="loginStatus" class="small"></p>
  <p><a href="index.html">← Về website</a></p>
</div>

<div id="app" class="admin-wrap hidden">
  <div class="admin-top">
    <div><h1>⚙️ Quản trị Apple Seed</h1><div class="small" id="userEmail"></div></div>
    <div class="admin-actions">
      <a class="btn2" href="index.html">← Website</a>
      <button class="btn2" id="logoutBtn">Đăng xuất</button>
    </div>
  </div>

  <div id="status" class="status hidden"></div>

  <section class="panel">
    <div class="panel-head">
      <div><h2>＋ Sản phẩm</h2><div class="small">Thêm, sửa, ẩn hoặc xóa sản phẩm đang hiển thị.</div></div>
      <button class="plus" id="addProductBtn">＋ Thêm sản phẩm</button>
    </div>

    <form id="productForm" class="form hidden">
      <input id="productId" type="hidden">
      <div class="form-row">
        <label>Tên sản phẩm<input id="productName" required></label>
        <label>Danh mục<input id="productCategory" placeholder="iPhone / Linh kiện / Máy cũ"></label>
      </div>
      <div class="form-row">
        <label>Giá (VNĐ)<input id="productPrice" type="number" min="0" value="0"></label>
        <label>Link ảnh<input id="productImage" placeholder="https://..."></label>
      </div>
      <label>Mô tả sản phẩm</label>
      <div class="native-editor" id="productEditor" contenteditable="true" data-placeholder="Mô tả sản phẩm..."></div>
      <div class="native-toolbar" data-editor="productEditor">
      <button type="button" onclick="focusEd('productEditor');document.execCommand('bold')"><b>B</b></button>
      <button type="button" onclick="focusEd('productEditor');document.execCommand('italic')"><i>I</i></button>
      <button type="button" onclick="focusEd('productEditor');document.execCommand('underline')"><u>U</u></button>
      <button type="button" onclick="formatEd('productEditor','h2')">H2</button>
      <button type="button" onclick="formatEd('productEditor','h3')">H3</button>
      <button type="button" onclick="focusEd('productEditor');document.execCommand('insertUnorderedList')">• List</button>
      <button type="button" onclick="focusEd('productEditor');document.execCommand('insertOrderedList')">1. List</button>
      <button type="button" onclick="focusEd('productEditor');document.execCommand('justifyLeft')">←</button>
      <button type="button" onclick="focusEd('productEditor');document.execCommand('justifyCenter')">↔</button>
      <button type="button" onclick="focusEd('productEditor');document.execCommand('justifyRight')">→</button>
      <label class="tool-button">🖼️ Ảnh<input type="file" accept="image/*" hidden onchange="uploadInlineImage(this,'productEditor')"></label>
      <button type="button" onclick="toggleEmoji('productEditor',this)">😊 Icon</button>
      
      <button type="button" onclick="insertLinkDirect('productEditor')">🔗 Link</button>
      <button type="button" onclick="editHtmlDirect('productEditor')">&lt;/&gt; HTML</button>
    
    </div>
    <div class="emoji-box" hidden data-for="productEditor"></div>
    <div class="native-upload-status" data-status="productEditor"></div>
      <label>Trạng thái
        <select id="productActive"><option value="true">Đang bán</option><option value="false">Ẩn</option></select>
      </label>
      <div class="admin-actions">
        <button class="plus" type="submit">Lưu sản phẩm</button>
        <button class="btn2" type="button" id="cancelProduct">Hủy</button>
      </div>
    </form>
    <div id="productsList" class="grid"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div><h2>＋ Trang dịch vụ</h2><div class="small">Tạo trang mới mà không phải sửa code index.</div></div>
      <button class="plus" id="addPageBtn">＋ Thêm trang</button>
    </div>

    <form id="pageForm" class="form hidden">
      <input id="pageId" type="hidden">
      <div class="form-row">
        <label>Tiêu đề trang<input id="pageTitle" required placeholder="Ví dụ: Sửa Camera iPhone Trà Vinh"></label>
        <label>Slug<input id="pageSlug" required placeholder="sua-camera-iphone-tra-vinh"></label>
      </div>
      <label>Mô tả ngắn<input id="pageDescription" placeholder="Mô tả hiển thị trên danh sách và SEO"></label>
      <label>Nội dung trang</label>
      <div class="native-editor" id="pageEditor" contenteditable="true" data-placeholder="Viết nội dung trang..."></div>
      <div class="native-toolbar" data-editor="pageEditor">
      <button type="button" onclick="focusEd('pageEditor');document.execCommand('bold')"><b>B</b></button>
      <button type="button" onclick="focusEd('pageEditor');document.execCommand('italic')"><i>I</i></button>
      <button type="button" onclick="focusEd('pageEditor');document.execCommand('underline')"><u>U</u></button>
      <button type="button" onclick="formatEd('pageEditor','h2')">H2</button>
      <button type="button" onclick="formatEd('pageEditor','h3')">H3</button>
      <button type="button" onclick="focusEd('pageEditor');document.execCommand('insertUnorderedList')">• List</button>
      <button type="button" onclick="focusEd('pageEditor');document.execCommand('insertOrderedList')">1. List</button>
      <button type="button" onclick="focusEd('pageEditor');document.execCommand('justifyLeft')">←</button>
      <button type="button" onclick="focusEd('pageEditor');document.execCommand('justifyCenter')">↔</button>
      <button type="button" onclick="focusEd('pageEditor');document.execCommand('justifyRight')">→</button>
      <label class="tool-button">🖼️ Ảnh<input type="file" accept="image/*" hidden onchange="uploadInlineImage(this,'pageEditor')"></label>
      <button type="button" onclick="toggleEmoji('pageEditor',this)">😊 Icon</button>
      
      <button type="button" onclick="insertLinkDirect('pageEditor')">🔗 Link</button>
      <button type="button" onclick="editHtmlDirect('pageEditor')">&lt;/&gt; HTML</button>
    <button type="button" onclick="insertVideoDirect('pageEditor')">🎬 Video</button>
    </div>
    <div class="emoji-box" hidden data-for="pageEditor"></div>
    <div class="native-upload-status" data-status="pageEditor"></div>
      <label>Trạng thái
        <select id="pageActive"><option value="true">Đang xuất bản</option><option value="false">Ẩn</option></select>
      </label>
      <div class="admin-actions">
        <button class="plus" type="submit">Lưu trang</button>
        <button class="btn2" type="button" id="cancelPage">Hủy</button>
      </div>
    </form>
    <div id="pagesList" class="grid"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script src="supabase-config.js"></script>
<script>
let sb = window.supabaseClient;

const $ = id => document.getElementById(id);

window.quill = new Quill("#pageEditor", {
  theme: "snow",
  placeholder: "Viết nội dung trang... Bạn có thể chèn ảnh, icon, link, video, tiêu đề, danh sách, bảng màu, căn lề, code...",
  modules: {
    toolbar: [
      [{header:[1,2,3,false]}],
      ["bold","italic","underline","strike"],
      [{color:[]},{background:[]}],
      [{list:"ordered"},{list:"bullet"},{indent:"-1"},{indent:"+1"}],
      [{align:[]}],
      ["blockquote","code-block"],
      ["link","image","video"],
      ["clean"]
    ]
  }
});



const iconList = [
"😀","😃","😄","😁","😆","😅","😂","🤣","😊","😍","🥰","😘","😎","🤩","🤔",
"👍","👎","👏","🙌","🙏","💪","🔥","⭐","✨","❤️","💯","🎉","🚀","📱","💻","🛠️",
"🔧","🔩","⚙️","🔋","🔌","📷","🎧","🎤","💡","📍","☎️","📞","✉️","🌐","🛒","🏷️",
"✅","❌","⚠️","❗","❓","ℹ️","➡️","⬅️","⬆️","⬇️","➕","➖","🔴","🟢","🔵"
];

const iconPicker = $("iconPicker");
iconList.forEach(icon => {
  const b=document.createElement("button");
  b.type="button"; b.textContent=icon; b.title="Chèn "+icon;
  b.onclick=()=>{
    const range=null || {index:quill.getLength(),length:0};
    quill.insertText(range.index, icon);
    quill.setSelection(range.index+icon.length, 0);
    if (iconPicker) iconPicker.classList.add("hidden");
  };
  if (iconPicker) iconPicker.appendChild(b);
});


window.productQuill = new Quill("#productEditor", {
  theme: "snow",
  placeholder: "Mô tả sản phẩm: tình trạng, thông số, bảo hành, phụ kiện...",
  modules: {
    toolbar: [
      [{header:[2,3,false]}],
      ["bold","italic","underline","strike"],
      [{color:[]},{background:[]}],
      [{list:"ordered"},{list:"bullet"}],
      [{align:[]}],
      ["link","image"],
      ["clean"]
    ]
  }
});

window.setProductEditorHtml=function setProductEditorHtml(html=""){ productQuill.root.innerHTML = html || ""; }
window.getProductEditorHtml=function getProductEditorHtml(){ return productQuill.root.innerHTML; }

const productIconPicker = $("productIconPicker");

if (productIconPicker) {
  iconList.forEach(icon => {
    const b = document.createElement("button");

    b.type = "button";
    b.textContent = icon;
    b.title = "Chèn " + icon;

    b.onclick = () => {
      const range = null || {
        index: productQuill.getLength(),
        length: 0
      };

      productQuill.insertText(range.index, icon);
      productQuill.setSelection(range.index + icon.length, 0);
      productIconPicker.classList.add("hidden");
    };

    productIconPicker.appendChild(b);
  });
}




window.setEditorHtml=function setEditorHtml(html=""){
  quill.root.innerHTML = html || "";
}
window.getEditorHtml=function getEditorHtml(){
  return quill.root.innerHTML;
}




async function productUploadImage(event){
  const file=event.target.files && event.target.files[0];
  if(!file) return;
  const statusBox=$("productUploadStatus");
  if(file.size>8*1024*1024){statusBox.textContent="Ảnh tối đa 8MB.";event.target.value="";return;}
  if(!sb || !sb.storage){statusBox.textContent="Chưa kết nối Supabase Storage.";return;}
  statusBox.textContent="Đang tải ảnh lên...";
  try{
    const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,"-");
    const path=`products/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe}`;
    const r=await sb.storage.from("site-images").upload(path,file,{cacheControl:"3600",upsert:false});
    if(r.error) throw r.error;
    const url=sb.storage.from("site-images").getPublicUrl(path).data.publicUrl;
    const range=null||{index:productQuill.getLength(),length:0};
    productQuill.insertEmbed(range.index,"image",url,"user");
    productQuill.setSelection(range.index+1,0);
    statusBox.textContent="✅ Đã chèn ảnh.";
  }catch(err){statusBox.textContent="❌ Upload lỗi: "+(err?.message||err);}
  event.target.value="";
}
async function pageUploadImage(event){
  const file=event.target.files && event.target.files[0];
  if(!file) return;
  const statusBox=$("uploadStatus");
  if(file.size>8*1024*1024){statusBox.textContent="Ảnh tối đa 8MB.";event.target.value="";return;}
  if(!sb || !sb.storage){statusBox.textContent="Chưa kết nối Supabase Storage.";return;}
  statusBox.textContent="Đang tải ảnh lên...";
  try{
    const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,"-");
    const path=`pages/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe}`;
    const r=await sb.storage.from("site-images").upload(path,file,{cacheControl:"3600",upsert:false});
    if(r.error) throw r.error;
    const url=sb.storage.from("site-images").getPublicUrl(path).data.publicUrl;
    const range=null||{index:quill.getLength(),length:0};
    quill.insertEmbed(range.index,"image",url,"user");
    quill.setSelection(range.index+1,0);
    statusBox.textContent="✅ Đã chèn ảnh.";
  }catch(err){statusBox.textContent="❌ Upload lỗi: "+(err?.message||err);}
  event.target.value="";
}

function productToggleIcons(e){
  if(e) e.preventDefault();
  const box=$("productIconPicker");
  if(!box) return;
  const willShow=box.hidden;
  box.hidden=!willShow;
  box.classList.toggle("hidden",!willShow);
}
function pageToggleIcons(e){
  if(e) e.preventDefault();
  const box=$("iconPicker");
  if(!box) return;
  const willShow=box.hidden;
  box.hidden=!willShow;
  box.classList.toggle("hidden",!willShow);
}
function productChooseImage(){
  const input=$("productImageFileInput");
  if(input) input.click();
}
function pageChooseImage(){
  const input=$("imageFileInput");
  if(input) input.click();
}
function productInsertLink(){
  const url=window.prompt("Nhập URL sản phẩm:");
  if(!url) return;
  const range=null||{index:productQuill.getLength(),length:0};
  if(range.length) productQuill.formatText(range.index,range.length,"link",url);
  else productQuill.insertText(range.index,url,"link",url);
  productQuill.focus();
}
function pageInsertLink(){
  const url=window.prompt("Nhập URL:");
  if(!url) return;
  const range=null||{index:quill.getLength(),length:0};
  if(range.length) quill.formatText(range.index,range.length,"link",url);
  else quill.insertText(range.index,url,"link",url);
  quill.focus();
}
function productEditHtml(){
  const edited=window.prompt("HTML mô tả sản phẩm:",getProductEditorHtml());
  if(edited!==null) setProductEditorHtml(edited);
}
function pageEditHtml(){
  const edited=window.prompt("HTML của nội dung trang:",getEditorHtml());
  if(edited!==null) setEditorHtml(edited);
}
function pageInsertVideo(){
  const url=window.prompt("Dán link video YouTube/Vimeo:");
  if(!url) return;
  const range=null||{index:quill.getLength(),length:0};
  quill.insertEmbed(range.index,"video",url,"user");
  quill.setSelection(range.index+1,0);
  quill.focus();
}

const show = (el, on=true) => el.classList.toggle("hidden", !on);

function status(msg, error=false){
  const box=$("status"); box.textContent=msg; box.classList.toggle("hidden",false); box.classList.toggle("error",error);
  setTimeout(()=>box.classList.add("hidden"),4500);
}
function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}


const ICONS = ["😀","😃","😄","😁","😂","🤣","😊","😍","🥰","😘","😎","🤩","👍","👏","🙏","💪","🔥","⭐","✨","❤️","💯","🎉","🚀","📱","💻","🛠️","🔧","🔩","⚙️","🔋","🔌","📷","🎧","🎤","💡","📍","☎️","📞","✉️","🌐","🛒","🏷️","✅","❌","⚠️","❗","❓","➡️","⬅️","➕","➖"];

let activeEditor = null;
let savedRange = null;

function editor(id){ return document.getElementById(id); }

function focusEditor(id){
  const el=editor(id);
  if(!el) return;
  el.focus();
  activeEditor=el;
}

function saveSelection(el){
  const sel=window.getSelection();
  if(sel && sel.rangeCount){
    const r=sel.getRangeAt(0);
    if(el.contains(r.commonAncestorContainer)) savedRange=r.cloneRange();
  }
}

function restoreSelection(el){
  el.focus();
  if(savedRange){
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }
}

function insertHtml(el, html){
  restoreSelection(el);
  document.execCommand("insertHTML", false, html);
  saveSelection(el);
}

function buildIconPicker(toolbar){
  let box=toolbar.parentElement.querySelector(".native-icon-picker");
  if(!box || box.dataset.ready==="1") return box;
  box.dataset.ready="1";
  ICONS.forEach(icon=>{
    const b=document.createElement("button");
    b.type="button"; b.textContent=icon;
    b.onclick=()=>{ insertHtml(toolbar._editor, icon); box.hidden=true; };
    box.appendChild(b);
  });
  return box;
}

function setupEditorToolbar(toolbar){
  const id=toolbar.dataset.editor;
  const el=editor(id);
  toolbar._editor=el;
  const picker=buildIconPicker(toolbar);

  el.addEventListener("keyup",()=>saveSelection(el));
  el.addEventListener("mouseup",()=>saveSelection(el));
  el.addEventListener("input",()=>saveSelection(el));

  toolbar.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("mousedown",e=>e.preventDefault());
    btn.addEventListener("click",async()=>{
      focusEditor(id);
      saveSelection(el);
      const cmd=btn.dataset.cmd;
      const action=btn.dataset.action;

      if(cmd){
        document.execCommand(cmd,false,btn.dataset.value||null);
        saveSelection(el);
        return;
      }

      if(action==="icon"){
        picker.hidden=!picker.hidden;
        return;
      }

      if(action==="link"){
        const url=prompt("Nhập URL:");
        if(url) document.execCommand("createLink",false,url);
        saveSelection(el);
        return;
      }

      if(action==="html"){
        const value=prompt("HTML nội dung:",el.innerHTML);
        if(value!==null) el.innerHTML=value;
        return;
      }

      if(action==="video"){
        const url=prompt("Dán link YouTube/Vimeo:");
        if(!url) return;
        insertHtml(el, `<p><a href="${escapeAttr(url)}" target="_blank" rel="noopener">🎬 Xem video</a></p>`);
        return;
      }

      if(action==="image"){
        const input=toolbar.querySelector(".native-image-input");
        input.value="";
        input.click();
      }
    });
  });

if (imageInput) imageInput.addEventListener("change",async(e)=>{

  ...
});
}

    const sbNow=window.supabaseClient;
    if(!sbNow){status.textContent="Chưa kết nối Supabase.";return;}
    status.textContent="Đang tải ảnh...";
    try{

function escapeAttr(s){
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

document.querySelectorAll(".native-toolbar").forEach(setupEditorToolbar);

function setEditorHtml(html){ const e=editor("pageEditor"); if(e)e.innerHTML=html||""; }
function getEditorHtml(){ const e=editor("pageEditor"); return e?e.innerHTML:""; }
function setProductEditorHtml(html){ const e=editor("productEditor"); if(e)e.innerHTML=html||""; }
function getProductEditorHtml(){ const e=editor("productEditor"); return e?e.innerHTML:""; }


window.focusEd=function(id){
  var e=document.getElementById(id);
  if(e){e.focus();window._activeEditor=e;}
};
window.formatEd=function(id,tag){
  window.focusEd(id);
  document.execCommand("formatBlock",false,tag);
};
window.insertLinkDirect=function(id){
  window.focusEd(id);
  var u=prompt("Nhập URL:");
  if(u) document.execCommand("createLink",false,u);
};
window.editHtmlDirect=function(id){
  var e=document.getElementById(id);
  if(!e)return;
  var v=prompt("HTML nội dung:",e.innerHTML);
  if(v!==null)e.innerHTML=v;
};
window.insertVideoDirect=function(id){
  window.focusEd(id);
  var u=prompt("Dán link YouTube/Vimeo:");
  if(u) document.execCommand("insertHTML",false,'<p><a href="'+escapeAttr(u)+'" target="_blank" rel="noopener">🎬 Xem video</a></p>');
};
window.toggleEmoji=function(id,button){
  var box=document.querySelector('.emoji-box[data-for="'+id+'"]');
  if(!box)return;
  if(!box.dataset.ready){
    var icons=["😀","😂","😊","😍","😎","👍","👏","🙏","💪","🔥","⭐","✨","❤️","💯","🎉","🚀","📱","💻","🛠️","🔧","🔋","🔌","📷","💡","📍","☎️","✅","❌","⚠️","❗","❓","➡️","⬅️","➕","➖"];
    icons.forEach(function(icon){
      var b=document.createElement("button");
      b.type="button";b.textContent=icon;
      b.onclick=function(){window.focusEd(id);document.execCommand("insertText",false,icon);box.hidden=true;};
      box.appendChild(b);
    });
    box.dataset.ready="1";
  }
  box.hidden=!box.hidden;
};
window.uploadInlineImage=async function(input,id){
  var file=input.files&&input.files[0];
  if(!file)return;
  var status=document.querySelector('.native-upload-status[data-status="'+id+'"]');
  if(file.size>8*1024*1024){status.textContent="Ảnh tối đa 8MB.";return;}
  status.textContent="Đang tải ảnh...";
  try{
    var sb=window.supabaseClient;
    if(!sb)throw new Error("Không có kết nối Supabase.");
    var safe=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,"-");
    var path=(id==="productEditor"?"products":"pages")+"/"+Date.now()+"-"+safe;
    var r=await sb.storage.from("site-images").upload(path,file,{cacheControl:"3600",upsert:false});
    if(r.error)throw r.error;
    var url=sb.storage.from("site-images").getPublicUrl(path).data.publicUrl;
    window.focusEd(id);
    document.execCommand("insertHTML",false,'<img src="'+escapeAttr(url)+'" alt="" style="max-width:100%;height:auto">');
    status.textContent="✅ Đã chèn ảnh.";
  }catch(err){status.textContent="❌ "+(err&&err.message?err.message:err);}
  input.value="";
};
window.escapeAttr=function(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};

async function checkSession(){
  if(!sb){ $("loginStatus").textContent="Không tìm thấy supabase-config.js."; return; }
  const {data:{session}}=await sb.auth.getSession();
  if(session){ $("userEmail").textContent=session.user.email||""; show($("loginView"),false); show($("app"),true); await refreshAll(); }
}
$("loginBtn").onclick=async()=>{
  const btn=$("loginBtn"), msg=$("loginStatus");
  btn.disabled=true; btn.textContent="Đang đăng nhập..."; msg.textContent="";
  try{
    if(!sb) throw new Error("Không kết nối được Supabase. Kiểm tra supabase-config.js.");
    const email=$("loginEmail").value.trim(), password=$("loginPassword").value;
    if(!email || !password) throw new Error("Vui lòng nhập email và mật khẩu.");
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    await checkSession();
  }catch(err){
    msg.textContent="Lỗi đăng nhập: "+(err?.message || String(err));
  }finally{
    btn.disabled=false; btn.textContent="Đăng nhập";
  }
};
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload();};

async function refreshAll(){await loadProducts();await loadPages();}

async function loadProducts(){
  const {data,error}=await sb.from("products").select("id,name,category,price,description,image_url,is_active").order("id",{ascending:false});
  if(error){status("Không tải được products: "+error.message,true);return;}
  $("productsList").innerHTML=(data||[]).map(p=>`
    <article class="item">
      <h3>${esc(p.name)}</h3>
      <p>${esc(p.category||"")}</p>
      <p><strong>${Number(p.price||0).toLocaleString("vi-VN")}đ</strong> · ${p.is_active?"Đang bán":"Đang ẩn"}</p>
      <p>${esc(p.description||"")}</p>
      <div class="item-actions">
        <button class="btn2 edit" onclick='editProduct(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Sửa</button>
        <button class="btn2 danger" onclick="deleteProduct(${p.id})">Xóa</button>
      </div>
    </article>`).join("") || "<p>Chưa có sản phẩm.</p>";
}
$("addProductBtn").onclick=()=>{ $("productForm").reset(); $("productId").value=""; $("productActive").value="true"; setProductEditorHtml(""); show($("productForm")); };
$("cancelProduct").onclick=()=>show($("productForm"),false);
window.editProduct=(p)=>{
  $("productId").value=p.id;$("productName").value=p.name||"";$("productCategory").value=p.category||"";
  $("productPrice").value=p.price||0;$("productImage").value=p.image_url||"";
  setProductEditorHtml(p.description||"");$("productActive").value=String(p.is_active);
  show($("productForm"));
};
$("productForm").onsubmit=async e=>{
  e.preventDefault();
  const payload={name:$("productName").value.trim(),category:$("productCategory").value.trim(),price:Number($("productPrice").value||0),image_url:$("productImage").value.trim(),description:getProductEditorHtml(),is_active:$("productActive").value==="true"};
  let res;
  if($("productId").value) res=await sb.from("products").update(payload).eq("id",Number($("productId").value));
  else res=await sb.from("products").insert(payload);
  if(res.error){status("Lưu sản phẩm lỗi: "+res.error.message,true);return;}
  show($("productForm"),false);status("Đã lưu sản phẩm.");await loadProducts();
};
window.deleteProduct=async id=>{
  if(!confirm("Xóa sản phẩm này?"))return;
  const {error}=await sb.from("products").delete().eq("id",id);
  if(error){status("Xóa sản phẩm lỗi: "+error.message,true);return;}
  status("Đã xóa sản phẩm.");await loadProducts();
};

async function loadPages(){
  const {data,error}=await sb.from("pages").select("id,title,slug,description,content,is_active").order("id",{ascending:false});
  if(error){status("Chưa có bảng pages hoặc chưa cấp quyền: "+error.message,true);$("pagesList").innerHTML="<p>Hãy chạy file supabase-pages.sql trong Supabase SQL Editor.</p>";return;}
  $("pagesList").innerHTML=(data||[]).map(p=>`
    <article class="item">
      <h3>${esc(p.title)}</h3><p>/page.html?slug=${encodeURIComponent(p.slug)}</p>
      <p>${esc(p.description||"")}</p><p>${p.is_active?"Đang xuất bản":"Đang ẩn"}</p>
      <div class="item-actions">
        <button class="btn2 edit" onclick='editPage(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Sửa</button>
        <button class="btn2 danger" onclick="deletePage(${p.id})">Xóa</button>
        <a class="btn2" href="page.html?slug=${encodeURIComponent(p.slug)}" target="_blank">Xem</a>
      </div>
    </article>`).join("") || "<p>Chưa có trang động.</p>";
}
$("addPageBtn").onclick=()=>{ $("pageForm").reset(); $("pageId").value=""; $("pageActive").value="true"; setEditorHtml(""); show($("pageForm")); };
$("cancelPage").onclick=()=>show($("pageForm"),false);
window.editPage=(p)=>{
  $("pageId").value=p.id;$("pageTitle").value=p.title||"";$("pageSlug").value=p.slug||"";
  $("pageDescription").value=p.description||"";setEditorHtml(p.content||"");
  $("pageActive").value=String(p.is_active);show($("pageForm"));
};
$("pageForm").onsubmit=async e=>{
  e.preventDefault();
  const slug=$("pageSlug").value.trim().toLowerCase().replace(/[^a-z0-9\-]+/g,"-").replace(/^-+|-+$/g,"");
  const payload={title:$("pageTitle").value.trim(),slug,description:$("pageDescription").value.trim(),content:getEditorHtml(),is_active:$("pageActive").value==="true"};
  let res;
  if($("pageId").value) res=await sb.from("pages").update(payload).eq("id",Number($("pageId").value));
  else res=await sb.from("pages").insert(payload);
  if(res.error){status("Lưu trang lỗi: "+res.error.message,true);return;}
  show($("pageForm"),false);status("Đã lưu trang.");await loadPages();
};
window.deletePage=async id=>{
  if(!confirm("Xóa trang này khỏi website?"))return;
  const {error}=await sb.from("pages").delete().eq("id",id);
  if(error){status("Xóa trang lỗi: "+error.message,true);return;}
  status("Đã xóa trang.");await loadPages();
};

checkSession();
</script>

<script>
(function(){
  function byId(id){return document.getElementById(id);}
  function prevent(e){ if(e){e.preventDefault();e.stopPropagation();} }

  window.productChooseImage=function(e){
    prevent(e);
    var x=byId("productImageFileInput");
    if(x){x.removeAttribute("disabled");x.click();}
  };
  window.pageChooseImage=function(e){
    prevent(e);
    var x=byId("imageFileInput");
    if(x){x.removeAttribute("disabled");x.click();}
  };
  window.productToggleIcons=function(e){
    prevent(e);
    var x=byId("productIconPicker");
    if(!x)return;
    x.hidden=!x.hidden;
    x.classList.toggle("hidden",x.hidden);
  };
  window.pageToggleIcons=function(e){
    prevent(e);
    var x=byId("iconPicker");
    if(!x)return;
    x.hidden=!x.hidden;
    x.classList.toggle("hidden",x.hidden);
  };
  window.productInsertLink=function(e){
    prevent(e);
    var u=window.prompt("Nhập URL sản phẩm:");
    if(!u)return;
    if(window.productQuill){
      var r=window.null||{index:window.productQuill.getLength(),length:0};
      if(r.length)window.productQuill.formatText(r.index,r.length,"link",u);
      else window.productQuill.insertText(r.index,u,"link",u);
    }
  };
  window.pageInsertLink=function(e){
    prevent(e);
    var u=window.prompt("Nhập URL:");
    if(!u)return;
    if(window.quill){
      var r=window.null||{index:window.quill.getLength(),length:0};
      if(r.length)window.quill.formatText(r.index,r.length,"link",u);
      else window.quill.insertText(r.index,u,"link",u);
    }
  };
  window.productEditHtml=function(e){
    prevent(e);
    var current=window.getProductEditorHtml?window.getProductEditorHtml():"";
    var v=window.prompt("HTML mô tả sản phẩm:",current);
    if(v!==null && window.setProductEditorHtml)window.setProductEditorHtml(v);
  };
  window.pageEditHtml=function(e){
    prevent(e);
    var current=window.getEditorHtml?window.getEditorHtml():"";
    var v=window.prompt("HTML nội dung trang:",current);
    if(v!==null && window.setEditorHtml)window.setEditorHtml(v);
  };
  window.pageInsertVideo=function(e){
    prevent(e);
    var u=window.prompt("Dán link YouTube/Vimeo:");
    if(!u)return;
    if(window.quill){
      var r=window.null||{index:window.quill.getLength(),length:0};
      window.quill.insertEmbed(r.index,"video",u,"user");
    }
  };

  // Force icon pickers closed on initial page load.
  function closePickers(){
    ["iconPicker","productIconPicker"].forEach(function(id){
      var x=byId(id); if(x){x.hidden=true;x.classList.add("hidden");}
    });
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",closePickers);
  else closePickers();
})();
</script>
