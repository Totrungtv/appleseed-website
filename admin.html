<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppleSeed — Quản trị</title><link rel="stylesheet" href="style.css">
<style>
body{background:#f5f7fb}.admin-wrap{max-width:1100px;margin:auto;padding:35px 22px 70px}
.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.admin-top h1{margin:0;font-size:30px}
.admin-top p{margin:4px 0 0;color:#667085}.actions{display:flex;gap:10px}
.btn2{border:1px solid #d9dee8;background:#fff;color:#172033;padding:10px 15px;border-radius:9px;font-weight:700;cursor:pointer;text-decoration:none}
.btn-primary{border:0;background:#2563eb;color:#fff}.editor-grid{display:grid;grid-template-columns:240px 1fr;gap:18px}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:18px}
.section-list button{width:100%;text-align:left;padding:11px 12px;border:0;background:transparent;border-radius:8px;cursor:pointer;margin-bottom:4px}
.section-list button.active{background:#eef4ff;color:#1d4ed8;font-weight:700}
.field{margin-bottom:18px}.field label{display:block;font-weight:700;margin-bottom:7px}
.field input,.field textarea{width:100%;padding:12px;border:1px solid #d9dee8;border-radius:9px;font:inherit}
.field textarea{min-height:180px;resize:vertical}.status{margin-top:12px;color:#067647;font-weight:700;min-height:22px}.error{color:#b42318}
@media(max-width:700px){.editor-grid{grid-template-columns:1fr}.admin-top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="site-header"><div class="nav">
<a class="brand" href="index.html"><img src="logo.png" alt="Apple Seed" class="brand-logo"></a>
<a class="brand" href="index.html"><img src="logo.png" alt="Apple Seed" class="brand-logo"></a>
</div></header>
<main class="admin-wrap">
<div class="admin-top"><div><h1>Quản trị AppleSeed</h1><p id="userbar">Đang kiểm tra tài khoản...</p></div></div>
<div class="editor-grid">
<aside class="panel"><strong>Nội dung website</strong><div id="sectionList" class="section-list" style="margin-top:12px"></div></aside>
<section class="panel">
<div class="field"><label>Tiêu đề</label><input id="title"></div>
<div class="field"><label>Nội dung</label><textarea id="content"></textarea></div>
<div class="field">
    <label>Ảnh</label>

    <input id="image_file" type="file" accept="image/*">

    <div id="image_preview" style="margin-top:10px;"></div>

    <input
        id="image_url"
        type="url"
        placeholder="Hoặc nhập URL ảnh..."
        style="margin-top:10px;"
    >
</div>
<button id="saveBtn" class="btn2 btn-primary">Lưu thay đổi</button>
<div id="status" class="status"></div>
</section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script><script src="admin.js"></script>
</body></html>
