<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đổi mật khẩu - Apple Seed</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f4ff;font-family:Arial,sans-serif}.card{width:min(460px,92%);background:#fff;padding:30px;border-radius:20px;box-shadow:0 15px 50px rgba(0,0,0,.10)}.logo{text-align:center;margin-bottom:20px}.logo img{width:120px;max-width:100%}h1{margin:0 0 10px;text-align:center;color:#17233d}.note{color:#61708a;text-align:center;line-height:1.5;margin-bottom:24px}label{display:block;font-weight:700;color:#17233d;margin-bottom:7px}input{width:100%;padding:13px 14px;border:1px solid #d8deea;border-radius:10px;font-size:16px;margin-bottom:16px;outline:none}input:focus{border-color:#1769ff}button{width:100%;border:0;border-radius:10px;padding:14px;background:#1769ff;color:#fff;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}#status{display:none;margin-top:16px;padding:12px;border-radius:10px;line-height:1.5}.success{background:#ecfdf3;color:#087443}.error{background:#fff1f0;color:#b42318}.back{display:block;margin-top:18px;text-align:center;color:#1769ff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="logo.png" alt="Apple Seed"></div>
  <h1>Đổi mật khẩu</h1>
  <div class="note">Nhập mật khẩu mới cho tài khoản Apple Seed Member của bạn.</div>
  <form id="resetForm">
    <label for="password">Mật khẩu mới</label>
    <input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự" required>
    <label for="password2">Nhập lại mật khẩu mới</label>
    <input id="password2" type="password" minlength="6" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required>
    <button id="resetBtn" type="submit">🔐 Đổi mật khẩu</button>
  </form>
  <div id="status"></div>
  <a class="back" href="index.html">← Về Apple Seed</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const sb=window.supabaseClient;
const form=document.getElementById('resetForm');
const btn=document.getElementById('resetBtn');
const status=document.getElementById('status');
function showStatus(text,success=false){status.textContent=text;status.className=success?'success':'error';status.style.display='block'}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  status.style.display='none';
  const password=document.getElementById('password').value;
  const password2=document.getElementById('password2').value;
  if(password.length<6){showStatus('Mật khẩu phải có ít nhất 6 ký tự.');return}
  if(password!==password2){showStatus('Hai mật khẩu không giống nhau.');return}
  btn.disabled=true;btn.textContent='Đang đổi mật khẩu...';
  try{
    if(!sb) throw new Error('Supabase chưa được tải.');
    const result=await sb.auth.updateUser({password});
    if(result.error) throw result.error;
    showStatus('Đổi mật khẩu thành công! Bạn có thể đăng nhập bằng mật khẩu mới.',true);
    form.reset();
    setTimeout(()=>{window.location.href='index.html'},2000);
  }catch(error){
    console.error('RESET PASSWORD ERROR:',error);
    showStatus(error.message||'Không thể đổi mật khẩu.');
  }finally{btn.disabled=false;btn.textContent='🔐 Đổi mật khẩu'}
});
</script>
</body>
</html>
