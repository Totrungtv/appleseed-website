<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đặt lại mật khẩu | Apple Seed</title>
<style>
:root{--blue:#1769ff;--ink:#17233d;--muted:#61708a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f1f4ff;color:var(--ink);display:grid;place-items:center;padding:18px}
.box{width:min(460px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 25px 80px rgba(35,54,91,.16)}
.icon{width:62px;height:62px;border-radius:17px;background:#eef4ff;display:grid;place-items:center;font-size:30px;margin-bottom:18px}
h1{margin:0 0 8px;font-size:27px}p{color:var(--muted);line-height:1.6;font-size:14px;margin:0 0 22px}
form{display:grid;gap:13px}label{font-size:13px;font-weight:800}input{width:100%;margin-top:6px;border:1px solid #d9dfeb;border-radius:11px;padding:13px;outline:0}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,255,.1)}
button{min-height:47px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}button:disabled{opacity:.65}
.status{display:none;padding:12px;border-radius:11px;font-size:13px;line-height:1.5}.status.show{display:block}.ok{background:#ecfdf3;color:#16794a}.err{background:#fff1f2;color:#b42318}
a{display:block;text-align:center;margin-top:14px;color:var(--blue);font-weight:800;text-decoration:none}
.hidden{display:none}
</style>
</head>
<body>
<main class="box">
  <div class="icon">🔐</div>
  <h1>Đặt lại mật khẩu</h1>
  <p>Tạo mật khẩu mới cho tài khoản Apple Seed của bạn.</p>

  <form id="resetForm">
    <label>Mật khẩu mới
      <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="Tối thiểu 6 ký tự">
    </label>
    <label>Nhập lại mật khẩu
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="Nhập lại mật khẩu">
    </label>
    <div id="status" class="status"></div>
    <button id="submit" type="submit">🔐 Đổi mật khẩu</button>
  </form>

  <a href="index.html">← Quay lại Apple Seed</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="member-auth.js"></script>
<script>
(function(){
  const form=document.getElementById('resetForm');
  const a=document.getElementById('newPassword');
  const b=document.getElementById('confirmPassword');
  const btn=document.getElementById('submit');
  const status=document.getElementById('status');

  const show=(msg,ok=false)=>{
    status.textContent=msg;
    status.className='status show '+(ok?'ok':'err');
  };

  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const p=a.value;
    const c=b.value;

    if(p.length<6){show('Mật khẩu mới phải có ít nhất 6 ký tự.');return}
    if(p!==c){show('Hai mật khẩu không giống nhau.');b.focus();return}
    if(!window.memberUpdatePassword){
      show('Hệ thống chưa tải chức năng đổi mật khẩu.');return;
    }

    btn.disabled=true;
    btn.textContent='Đang cập nhật...';

    try{
      await memberUpdatePassword(p);
      show('Đổi mật khẩu thành công. Bạn có thể đăng nhập bằng mật khẩu mới.',true);
      form.reset();
      setTimeout(()=>location.href='index.html',1600);
    }catch(err){
      console.error(err);
      show(err?.message||'Không thể đổi mật khẩu. Link có thể đã hết hạn.');
    }finally{
      btn.disabled=false;
      btn.textContent='🔐 Đổi mật khẩu';
    }
  });
})();
</script>
</body>
</html>
