<style>
.products-page{width:100%;max-width:1180px;margin:0 auto;padding:72px 24px 90px;box-sizing:border-box}

.products-status{text-align:center;color:#667085;padding:30px}

<body>

<div><div class="brand-title">Apple Seed</div><div class="brand-sub">TRUNG TÂM SỬA CHỮA IPHONE</div></div>
</a>
<div class="menu">
<a href="index.html#dich-vu"><span class="mi">🔧</span><span>Dịch vụ</span></a>
<a href="products.html"><span class="mi">🛍</span><span>Sản phẩm</span></a>

<main class="products-page">
<section class="products-head">
<div class="kicker">APPLE SEED • ENGINEERING CENTER</div>
<h1>Không chỉ sửa iPhone.<br><span style="color:#63a9ff">Chọn đúng sản phẩm.</span></h1>
<p>Sản phẩm và linh kiện Apple Seed được cập nhật trực tiếp từ hệ thống. Xem hình ảnh, thông tin và giá trước khi liên hệ.</p>
</section>

<div id="productsStatus" class="products-status">Đang tải sản phẩm...</div>
<div id="productsGrid" class="products-grid"></div>
</main>

<div id="productModal" class="modal" role="dialog" aria-modal="true">
<div class="modal-box">
<button id="modalClose" class="modal-close" type="button">×</button>
<div id="modalMain" class="modal-main"></div>
<div id="modalInfo" class="modal-title"></div>
<div id="modalThumbs" class="modal-thumbs"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
  "use strict";

  const sb = window.supabaseClient;
  const BUCKET = "site-images";
  const $ = id => document.getElementById(id);

  function esc(v){
    return String(v ?? "").replace(/[&<>"']/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function cleanStoragePath(value){
    if(!value) return "";

    let v=String(value).trim();
    if(!v) return "";

    // Nếu database lưu nguyên URL Supabase thì lấy phần path trong bucket.
    try{
      if(/^https?:\\/\\//i.test(v)){
        const u=new URL(v);
        const marker="/storage/v1/";
        const i=u.pathname.indexOf(marker);

        if(i>=0){
          let p=u.pathname.slice(i+marker.length);

          p=p.replace(/^render\\/image\\/public\\//,"");
          p=p.replace(/^object\\/public\\//,"");
          p=p.replace(/^object\\/sign\\/[^/]+\\//,"");

          if(p.startsWith(BUCKET+"/")){
            return decodeURIComponent(p.slice(BUCKET.length+1));
          }
        }

        // URL ngoài Supabase: giữ nguyên URL.
        return v;
      }
    }catch(e){}

    // Nếu lỡ lưu "site-images/ten-file.jpg" thì bỏ tên bucket.
    if(v.startsWith(BUCKET+"/")) v=v.slice(BUCKET.length+1);

    // Một số dữ liệu có dấu "/" đầu.
    v=v.replace(/^\\/+/, "");

    return v;
  }

  function pathUrl(path){
    if(!path || !sb)return "";
    const clean=cleanStoragePath(path);

    // cleanStoragePath trả về URL ngoài nếu giá trị vốn đã là URL.
    if(/^https?:\\/\\//i.test(clean)) return clean;

    return sb.storage.from(BUCKET).getPublicUrl(clean).data.publicUrl || "";
  }

  function imageUrl(value){
    if(!value) return "";
    const v=String(value).trim();
    if(!v) return "";

    if(/^https?:\\/\\//i.test(v)) return v;

    return pathUrl(v);
  }

  function price(v){
    const n=Number(v||0);
    return n ? n.toLocaleString("vi-VN")+"đ" : "Liên hệ";
  }

  function normalizeImages(product, gallery){
    const result=[];
    const seen=new Set();

    const add=(url,path,primary)=>{
      const u=imageUrl(url) || pathUrl(path);
      if(!u || seen.has(u))return;
      seen.add(u);
      result.push({
        url:u,
        path:cleanStoragePath(path || url),
        primary:!!primary
      });
    };

    add(product.image_url,product.image_path,true);

    (gallery||[])
      .slice()
      .sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0))
      .forEach(x=>add(x.image_url,x.image_path,x.is_primary));

    return result;
  }

  async function signedUrl(path){
    const clean=cleanStoragePath(path);
    if(!clean || !sb || /^https?:\\/\\//i.test(clean)) return "";

    try{
      const r=await sb.storage.from(BUCKET).createSignedUrl(clean,3600);
      return r?.data?.signedUrl || "";
    }catch(e){
      console.warn("Signed image:",e);
      return "";
    }
  }

  async function tryImageFallback(img){
    if(!img || img.dataset.fallbackTried==="1") return;
    img.dataset.fallbackTried="1";

    const original=img.getAttribute("src") || "";
    const path=img.dataset.path || "";

    // 1) Nếu đang dùng render/image URL, thử object/public URL.
    if(original.includes("/storage/v1/render/image/public/")){
      const fallback=original.replace(
        "/storage/v1/render/image/public/",
        "/storage/v1/object/public/"
      );

      img.onerror=null;
      img.src=fallback+"?v="+Date.now();
      img.dataset.fallbackTried="2";
      return;
    }

    // 2) Nếu bucket private hoặc public URL không đọc được,
    // dùng signed URL cho đúng file đã upload.
    if(path){
      const signed=await signedUrl(path);
      if(signed){
        img.onerror=null;
        img.src=signed;
        return;
      }
    }

    img.onerror=null;
    img.style.display="none";
    img.parentElement.classList.add("no-image");
    if(!img.parentElement.textContent.trim()){
      img.parentElement.textContent="🛍️";
    }
  }

  function bindImageFallbacks(root=document){
    root.querySelectorAll("img[data-storage-path]").forEach(img=>{
      img.addEventListener("error",()=>tryImageFallback(img),{once:true});
    });
  }

  let currentImages=[];

  function openProduct(product,images){
    currentImages=images||[];
    const first=currentImages[0]?.url||"";
    $("modalMain").innerHTML=first
      ? `<img src="${esc(first)}" data-storage-path="${esc(currentImages[0]?.path||"")}" alt="${esc(product.name)}">`
      : `<div class="product-photo no-image">🛍️</div>`;

    $("modalInfo").innerHTML=`
      <h2>${esc(product.name)}</h2>
      <div class="modal-price">${price(product.price)}</div>
      ${product.category?`<div class="product-category" style="margin-top:7px">${esc(product.category)}</div>`:""}
      ${product.description?`<p class="product-desc">${esc(product.description)}</p>`:""}
    `;

    $("modalThumbs").innerHTML=currentImages.map((x,i)=>`
      <button type="button" data-thumb="${i}">
        <img src="${esc(x.url)}" data-storage-path="${esc(x.path||"")}" alt="Ảnh ${i+1}">
      </button>
    `).join("");

    bindImageFallbacks($("modalMain"));
    bindImageFallbacks($("modalThumbs"));

    $("modalThumbs").querySelectorAll("[data-thumb]").forEach(b=>{
      b.onclick=()=>{
        const x=currentImages[Number(b.dataset.thumb)];
        if(x){ $("modalMain").innerHTML=`<img src="${esc(x.url)}" data-storage-path="${esc(x.path||"")}" alt="${esc(product.name)}">`; bindImageFallbacks($("modalMain")); }
      };
    });

    $("productModal").classList.add("open");
    document.body.style.overflow="hidden";
  }

  $("modalClose").onclick=()=>{
    $("productModal").classList.remove("open");
    document.body.style.overflow="";
  };

  $("productModal").addEventListener("click",e=>{
    if(e.target === $("productModal")) $("modalClose").click();
  });

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape" && $("productModal").classList.contains("open")) $("modalClose").click();
  });

  async function loadProducts(){
    if(!sb){
      $("productsStatus").innerHTML='<div class="products-error">Không khởi tạo được Supabase.</div>';
      return;
    }

    const p=await sb.from("products")
      .select("id,name,category,price,description,image_url,image_path,is_active")
      .eq("is_active",true)
      .order("id",{ascending:false});

    if(p.error){
      $("productsStatus").innerHTML=`<div class="products-error">Không tải được sản phẩm: ${esc(p.error.message)}</div>`;
      return;
    }

    const products=p.data||[];
    if(!products.length){
      $("productsStatus").innerHTML="";
      $("productsGrid").innerHTML='<div class="empty">Chưa có sản phẩm đang bán.</div>';
      return;
    }

    const ids=products.map(x=>x.id);
    const g=await sb.from("product_images")
      .select("id,product_id,image_url,image_path,sort_order,is_primary")
      .in("product_id",ids)
      .order("sort_order",{ascending:true})
      .order("id",{ascending:true});

    if(g.error){
      console.warn("product_images:",g.error.message);
    }

    const byProduct=new Map();
    (g.data||[]).forEach(x=>{
      if(!byProduct.has(x.product_id))byProduct.set(x.product_id,[]);
      byProduct.get(x.product_id).push(x);
    });

    $("productsStatus").innerHTML="";
    $("productsGrid").innerHTML=products.map(product=>{
      const images=normalizeImages(product,byProduct.get(product.id)||[]);
      const image=images[0]?.url||"";
      return `<article class="product-card-public" data-product-id="${product.id}">
        <div class="product-photo ${image?"":"no-image"}">
          ${image
            ? `<img src="${esc(image)}" data-storage-path="${esc(images[0]?.path||"")}" alt="${esc(product.name)}" loading="lazy">`
            : "🛍️"}
        </div>
        <div class="product-body">
          ${product.category?`<div class="product-category">${esc(product.category)}</div>`:""}
          <h2>${esc(product.name)}</h2>
          <div class="product-desc">${esc(product.description||"")}</div>
          <div class="product-price">${price(product.price)}</div>
          ${images.length>1?`<div class="product-gallery-count">📷 ${images.length} ảnh — Bấm để xem</div>`:""}
        </div>
      </article>`;
    }).join("");

    bindImageFallbacks($("productsGrid"));

    $("productsGrid").querySelectorAll("[data-product-id]").forEach(card=>{
      card.onclick=()=>{
        const product=products.find(x=>Number(x.id)===Number(card.dataset.productId));
        if(!product)return;
        openProduct(product,normalizeImages(product,byProduct.get(product.id)||[]));
      };
    });
  }

  loadProducts();
})();
</script>
</body>
