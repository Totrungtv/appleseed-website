<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sản phẩm Apple Seed</title>
<meta name="description" content="Sản phẩm Apple Seed Trà Vinh">
<link rel="stylesheet" href="style.css">
<style>
.products-page{max-width:1180px;margin:0 auto;padding:72px 24px 90px}
.products-head{text-align:center;margin-bottom:42px}
.products-head .kicker{color:#22b8df;font-weight:900;letter-spacing:2px;font-size:13px}
.products-head h1{margin:10px 0 0;font-size:40px}
.products-head p{color:#667085;margin:12px auto 0;max-width:700px}
.products-status{text-align:center;color:#667085;padding:30px}
.products-error{text-align:center;color:#b42318;padding:30px}
.products-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.product-card-public{background:#fff;border:1px solid #e5eaf1;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(15,23,42,.06);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
.product-card-public:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(15,23,42,.10)}
.product-photo{height:260px;background:#f6f8fb;display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-photo img{width:100%;height:100%;object-fit:cover;display:block}
.product-photo.no-image{font-size:54px}
.product-body{padding:18px 18px 20px}
.product-category{font-size:12px;color:#22b8df;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.product-body h2{font-size:20px;margin:7px 0}
.product-desc{color:#667085;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.product-price{font-weight:900;color:#1769ff;font-size:18px;margin-top:12px}
.product-gallery-count{font-size:12px;color:#98a2b3;margin-top:7px}
.empty{background:#fff;border:1px dashed #d9dee8;border-radius:16px;padding:35px;text-align:center;color:#667085}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.72);display:none;align-items:center;justify-content:center;padding:22px;z-index:9999}
.modal.open{display:flex}
.modal-box{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;position:relative}
.modal-close{position:absolute;right:14px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.14);font-size:22px;cursor:pointer;z-index:2}
.modal-main{background:#f6f8fb;border-radius:14px;min-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.modal-main img{max-width:100%;max-height:60vh;object-fit:contain}
.modal-title{padding:16px 4px 5px}.modal-title h2{margin:0}.modal-price{color:#1769ff;font-weight:900;font-size:20px;margin-top:6px}
.modal-thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.modal-thumbs button{border:1px solid #e5e7eb;background:#fff;padding:0;border-radius:9px;overflow:hidden;cursor:pointer}
.modal-thumbs img{width:100%;height:90px;object-fit:cover;display:block}
@media(max-width:900px){.products-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.products-page{padding:48px 16px 70px}.products-head h1{font-size:32px}.products-grid{grid-template-columns:1fr}.product-photo{height:250px}.modal-thumbs{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header class="site-header">
<nav class="nav" aria-label="Điều hướng chính">
<a class="brand" href="./index.html">
<img src="logo.png" alt="Apple Seed - Trung tâm sửa chữa iPhone Trà Vinh">
<div><div class="brand-title">Apple Seed</div><div class="brand-sub">TRUNG TÂM SỬA CHỮA IPHONE</div></div>
</a>
<div class="menu">
<a href="index.html#dich-vu"><span class="mi">🔧</span><span>Dịch vụ</span></a>
<a href="products.html"><span class="mi">🛍</span><span>Sản phẩm</span></a>
<a href="index.html#gioi-thieu"><span class="mi">ⓘ</span><span>Giới thiệu</span></a>
<a href="index.html#lien-he"><span class="mi">☎</span><span>Liên hệ</span></a>
</div>
</nav>
</header>

<main class="products-page">
<section class="products-head">
<div class="kicker">SẢN PHẨM</div>
<h1>Sản phẩm Apple Seed</h1>
<p>Sản phẩm được cập nhật trực tiếp từ hệ thống quản trị Apple Seed.</p>
</section>

<div id="productsStatus" class="products-status">Đang tải sản phẩm...</div>
<div id="productsGrid" class="products-grid"></div>
</main>

<div id="productModal" class="modal" role="dialog" aria-modal="true">
<div class="modal-box">
<button id="modalClose" class="modal-close" type="button">×</button>
<div id="modalMain" class="modal-main"></div>
<div id="modalInfo" class="modal-title"></div>
<div id="modalThumbs" class="modal-thumbs"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
  "use strict";

  const sb = window.supabaseClient;
  const BUCKET = "site-images";
  const $ = id => document.getElementById(id);

  function esc(v){
    return String(v ?? "").replace(/[&<>"']/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function pathUrl(path){
    if(!path || !sb)return "";
    return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl || "";
  }

  function price(v){
    const n=Number(v||0);
    return n ? n.toLocaleString("vi-VN")+"đ" : "Liên hệ";
  }

  function normalizeImages(product, gallery){
    const result=[];
    const seen=new Set();

    const add=(url,path,primary)=>{
      const u=url || pathUrl(path);
      if(!u || seen.has(u))return;
      seen.add(u);
      result.push({url:u,path:path||"",primary:!!primary});
    };

    add(product.image_url,product.image_path,true);

    (gallery||[])
      .slice()
      .sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0))
      .forEach(x=>add(x.image_url,x.image_path,x.is_primary));

    return result;
  }

  let currentImages=[];

  function openProduct(product,images){
    currentImages=images||[];
    const first=currentImages[0]?.url||"";
    $("modalMain").innerHTML=first
      ? `<img src="${esc(first)}" alt="${esc(product.name)}">`
      : `<div class="product-photo no-image">🛍️</div>`;

    $("modalInfo").innerHTML=`
      <h2>${esc(product.name)}</h2>
      <div class="modal-price">${price(product.price)}</div>
      ${product.category?`<div class="product-category" style="margin-top:7px">${esc(product.category)}</div>`:""}
      ${product.description?`<p class="product-desc">${esc(product.description)}</p>`:""}
    `;

    $("modalThumbs").innerHTML=currentImages.map((x,i)=>`
      <button type="button" data-thumb="${i}">
        <img src="${esc(x.url)}" alt="Ảnh ${i+1}">
      </button>
    `).join("");

    $("modalThumbs").querySelectorAll("[data-thumb]").forEach(b=>{
      b.onclick=()=>{
        const x=currentImages[Number(b.dataset.thumb)];
        if(x) $("modalMain").innerHTML=`<img src="${esc(x.url)}" alt="${esc(product.name)}">`;
      };
    });

    $("productModal").classList.add("open");
    document.body.style.overflow="hidden";
  }

  $("modalClose").onclick=()=>{
    $("productModal").classList.remove("open");
    document.body.style.overflow="";
  };

  $("productModal").addEventListener("click",e=>{
    if(e.target === $("productModal")) $("modalClose").click();
  });

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape" && $("productModal").classList.contains("open")) $("modalClose").click();
  });

  async function loadProducts(){
    if(!sb){
      $("productsStatus").innerHTML='<div class="products-error">Không khởi tạo được Supabase.</div>';
      return;
    }

    const p=await sb.from("products")
      .select("id,name,category,price,description,image_url,image_path,is_active")
      .eq("is_active",true)
      .order("id",{ascending:false});

    if(p.error){
      $("productsStatus").innerHTML=`<div class="products-error">Không tải được sản phẩm: ${esc(p.error.message)}</div>`;
      return;
    }

    const products=p.data||[];
    if(!products.length){
      $("productsStatus").innerHTML="";
      $("productsGrid").innerHTML='<div class="empty">Chưa có sản phẩm đang bán.</div>';
      return;
    }

    const ids=products.map(x=>x.id);
    const g=await sb.from("product_images")
      .select("id,product_id,image_url,image_path,sort_order,is_primary")
      .in("product_id",ids)
      .order("sort_order",{ascending:true})
      .order("id",{ascending:true});

    if(g.error){
      console.warn("product_images:",g.error.message);
    }

    const byProduct=new Map();
    (g.data||[]).forEach(x=>{
      if(!byProduct.has(x.product_id))byProduct.set(x.product_id,[]);
      byProduct.get(x.product_id).push(x);
    });

    $("productsStatus").innerHTML="";
    $("productsGrid").innerHTML=products.map(product=>{
      const images=normalizeImages(product,byProduct.get(product.id)||[]);
      const image=images[0]?.url||"";
      return `<article class="product-card-public" data-product-id="${product.id}">
        <div class="product-photo ${image?"":"no-image"}">
          ${image
            ? `<img src="${esc(image)}" alt="${esc(product.name)}" loading="lazy"
                onerror="this.onerror=null;this.src='';this.parentElement.classList.add('no-image');this.parentElement.textContent='🛍️';">`
            : "🛍️"}
        </div>
        <div class="product-body">
          ${product.category?`<div class="product-category">${esc(product.category)}</div>`:""}
          <h2>${esc(product.name)}</h2>
          <div class="product-desc">${esc(product.description||"")}</div>
          <div class="product-price">${price(product.price)}</div>
          ${images.length>1?`<div class="product-gallery-count">📷 ${images.length} ảnh — Bấm để xem</div>`:""}
        </div>
      </article>`;
    }).join("");

    $("productsGrid").querySelectorAll("[data-product-id]").forEach(card=>{
      card.onclick=()=>{
        const product=products.find(x=>Number(x.id)===Number(card.dataset.productId));
        if(!product)return;
        openProduct(product,normalizeImages(product,byProduct.get(product.id)||[]));
      };
    });
  }

  loadProducts();
})();
</script>
</body>
</html>
