<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple Seed — Electronic Brain</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#101828}
.wrap{max-width:1180px;margin:auto;padding:28px 16px 60px}h1{margin:0}.muted{color:#667085;font-size:13px}
.panel{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 4px 16px rgba(16,24,40,.04)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8fafc;border:1px solid #eaecf0;border-radius:12px;padding:14px}.stat b{font-size:24px;display:block;margin-top:4px}
.drop{border:2px dashed #84adf0;border-radius:15px;padding:30px;text-align:center;background:#f8fbff;cursor:pointer;display:block;transition:.15s}.drop:hover{background:#eef6ff;border-color:#2563eb}
.drop strong{display:block;font-size:18px;margin:8px 0 4px}.drop input{display:none}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}
button.secondary{background:#eef2f7;color:#344054}button:disabled{opacity:.45;cursor:not-allowed}
.preview{display:none;margin-top:12px;padding:10px;border:1px solid #eaecf0;border-radius:12px;background:#fafafa}.preview.show{display:block}
.preview img{display:block;max-width:100%;max-height:300px;margin:8px auto;border-radius:8px}.file{border:1px solid #eaecf0;border-radius:12px;padding:12px;margin-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.bar{height:8px;background:#eaecf0;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:#2563eb;width:0}
.status{margin-top:10px;font-weight:700}.error{color:#b42318}.ok{color:#027a48}
@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<h1>🧠 Apple Seed Electronic Brain</h1>
<p class="muted">Quăng PDF, schematic, datasheet hoặc hình ảnh boardview vào đây. AI sẽ hấp thụ kiến thức thành bộ não điện tử.</p>

<section class="panel"><div class="grid">
<div class="stat">Tài liệu <b id="docs">0</b></div>
<div class="stat">Knowledge atoms <b id="atoms">0</b></div>
<div class="stat">Quan hệ mạch <b id="rels">0</b></div>
</div></section>

<section class="panel">
<label class="drop" id="drop">
  <div style="font-size:34px">📚</div>
  <strong>CHỌN TÀI LIỆU ĐỂ HỌC</strong>
  <span class="muted">PDF · JPG · JPEG · PNG · TXT · MD · JSON</span><br><span style="color:#2563eb;font-weight:800">⚡ Hoặc Ctrl + V để dán ảnh trực tiếp</span>
  <input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.txt,.md,.json,application/pdf,image/jpeg,image/png,text/plain,text/markdown,application/json">
</label>
<div id="picked" class="muted" style="margin-top:10px">Chưa chọn file.</div>
<div id="preview" class="preview"></div>
<div class="actions">
  <button id="choose" type="button">📂 CHỌN FILE</button>
  <button id="learn" type="button" disabled>🧠 HỌC VÀO BỘ NÃO</button>
  <button id="refresh" type="button" class="secondary">↻ Làm mới</button>
</div>
<div id="status" class="status">Đang khởi tạo...</div>
</section>

<section class="panel"><h2>Đã học</h2><div id="list"><div class="muted">Đang tải...</div></div></section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const sb=window.supabaseClient;
let picked=null, busy=false;

function msg(t,cls){const x=$("status");x.textContent=t;x.className="status "+(cls||"")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

async function auth(){
 if(!sb) throw Error("Supabase chưa khởi tạo — kiểm tra supabase-config.js");
 const {data:{session},error}=await sb.auth.getSession();
 if(error) throw error;
 if(!session) throw Error("Chưa đăng nhập. Hãy đăng nhập AI Board Admin trước.");
 const r=await sb.from("profiles").select("role").eq("id",session.user.id).maybeSingle();
 if(r.error) throw r.error;
 if(!r.data||!["admin","staff"].includes(r.data.role)) throw Error("Tài khoản không có quyền Admin/Staff.");
 return session.user;
}

async function stats(){
 try{
  const [d,k,r]=await Promise.all([
   sb.from("brain_documents").select("id",{count:"exact",head:true}),
   sb.from("brain_knowledge").select("id",{count:"exact",head:true}),
   sb.from("brain_relationships").select("id",{count:"exact",head:true})
  ]);
  if(d.error) throw d.error;if(k.error) throw k.error;if(r.error) throw r.error;
  $("docs").textContent=d.count||0;$("atoms").textContent=k.count||0;$("rels").textContent=r.count||0;
  const q=await sb.from("brain_documents").select("*").order("created_at",{ascending:false}).limit(30);
  if(q.error) throw q.error;
  $("list").innerHTML=(q.data||[]).map(x=>'<div class="file"><div class="row"><b>'+esc(x.file_name)+'</b><span>'+esc(x.status)+'</span></div><div class="muted">'+(x.atoms_learned||0)+' atoms · '+(x.relationships_learned||0)+' relationships · '+(x.pages_learned||0)+' pages</div><div class="bar"><i style="width:'+(x.status==="completed"?100:x.status==="learning"?50:0)+'%"></i></div>'+(x.error_message?'<div class="error">'+esc(x.error_message)+'</div>':'')+'<div style="margin-top:10px"><button type="button" class="secondary relearn" data-id="'+esc(x.id)+'">🔄 Học lại tài liệu</button></div></div>').join("")||'<div class="muted">Chưa có tài liệu.</div>';
 }catch(e){msg("Không tải được dữ liệu: "+(e.message||e),"error")}
}

function selectFile(file){
 picked=file||null;
 $("picked").textContent=picked?("📄 "+picked.name+" · "+(picked.size/1024/1024).toFixed(2)+" MB · "+(picked.type||"unknown")):"Chưa chọn file.";
 $("learn").disabled=!picked||busy;
 const pv=$("preview");pv.innerHTML="";
 if(picked && picked.type.startsWith("image/")){
   const img=document.createElement("img");img.src=URL.createObjectURL(picked);pv.appendChild(img);pv.classList.add("show");
 }else pv.classList.remove("show");
}
document.addEventListener("paste",function(e){
  if(busy)return;
  const items=[...(e.clipboardData?.items||[])];
  const imageItem=items.find(x=>x.type&&x.type.startsWith("image/"));
  if(!imageItem)return;
  const blob=imageItem.getAsFile();
  if(!blob)return;
  const ext=blob.type==="image/png"?"png":blob.type==="image/jpeg"?"jpg":"img";
  const file=new File([blob],"pasted-boardview-"+Date.now()+"."+ext,{type:blob.type,lastModified:Date.now()});
  selectFile(file);
  msg("📋 Đã dán ảnh từ Clipboard. Bấm HỌC VÀO BỘ NÃO để phân tích.","ok");
});

$("file").addEventListener("change",e=>selectFile(e.target.files[0]));
$("choose").addEventListener("click",()=> $("file").click());
$("drop").addEventListener("dragover",e=>{e.preventDefault();$("drop").style.borderColor="#2563eb"});
$("drop").addEventListener("dragleave",()=> $("drop").style.borderColor="#84adf0");
$("drop").addEventListener("drop",e=>{e.preventDefault();$("drop").style.borderColor="#84adf0";selectFile(e.dataTransfer.files[0])});
$("refresh").addEventListener("click",()=>stats());
$("list").addEventListener("click",async e=>{
  const btn=e.target.closest(".relearn");
  if(!btn||busy)return;
  busy=true;btn.disabled=true;$("choose").disabled=true;$("learn").disabled=true;
  try{await auth();await sb.from("brain_documents").update({status:"queued",error_message:null,atoms_learned:0,relationships_learned:0}).eq("id",btn.dataset.id);await stats();await startLearning(btn.dataset.id)}
  catch(err){msg("❌ "+(err.message||err),"error")}
  finally{busy=false;btn.disabled=false;$("choose").disabled=false;$("learn").disabled=!picked}
});

async function startLearning(docId){
  msg("🧠 AI đang đọc và hấp thụ tài liệu…");
  sb.functions.invoke("brain-learn-document",{body:{document_id:docId}})
    .then(r=>{if(r.error)console.warn("Brain worker:",r.error)})
    .catch(e=>console.warn("Brain worker:",e));
  for(let i=0;i<180;i++){
    await new Promise(r=>setTimeout(r,2000));
    const q=await sb.from("brain_documents").select("status,atoms_learned,relationships_learned,error_message").eq("id",docId).maybeSingle();
    if(q.error||!q.data)continue;
    const d=q.data;
    if(d.status==="completed"){
      if((d.atoms_learned||0)>0) msg("✅ Đã học xong: "+d.atoms_learned+" knowledge atoms · "+(d.relationships_learned||0)+" quan hệ.","ok");
      else msg("⚠️ AI hoàn tất nhưng chưa tạo knowledge atoms. Đã sửa bộ đọc Responses API — hãy bấm Học lại.","error");
      await stats(); return;
    }
    if(d.status==="failed"){msg("❌ AI học thất bại: "+(d.error_message||"Không rõ lỗi"),"error");await stats();return}
    msg("🧠 AI đang đọc và hấp thụ…");
  }
  msg("⏳ Tài liệu vẫn đang được xử lý. Không cần bấm lại.","");
  await stats();
}
$("learn").addEventListener("click",async()=>{
 if(!picked||busy)return;
 busy=true;$("learn").disabled=true;$("choose").disabled=true;
 try{
   const user=await auth();
   msg("Đang upload "+picked.name+"...");
   const safe=picked.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const path="documents/"+crypto.randomUUID()+"-"+safe;
   const up=await sb.storage.from("electronic-brain").upload(path,picked,{upsert:false,contentType:picked.type||"application/octet-stream"});
   if(up.error)throw up.error;

   const ins=await sb.from("brain_documents").insert({
     uploaded_by:user.id,file_name:picked.name,storage_path:path,
     mime_type:picked.type||null,file_size:picked.size,status:"queued"
   }).select("id").single();
   if(ins.error)throw ins.error;

   const docId=ins.data.id;
   msg("📤 Đã upload. AI bắt đầu hấp thụ — trang này sẽ không bị treo.");
   await stats();

   await startLearning(docId);
 }catch(e){msg("❌ "+(e.message||String(e)),"error");await stats()}
 finally{busy=false;$("choose").disabled=false;$("learn").disabled=!picked}
});

(async()=>{try{await auth();msg("✅ Đã đăng nhập · sẵn sàng học tài liệu","ok");await stats()}catch(e){msg("⚠️ "+(e.message||e),"error")}})();
})();
</script>
</main></body></html>
