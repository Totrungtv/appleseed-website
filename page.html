<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Seed Trà Vinh</title>
<meta id="description" name="description" content="Apple Seed Trà Vinh chuyên sửa điện thoại, sửa iPhone, Face ID, main, màn hình, pin, camera và linh kiện.">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta id="og-title" property="og:title" content="Apple Seed Trà Vinh">
<meta id="og-description" property="og:description" content="Apple Seed Trà Vinh chuyên sửa điện thoại và iPhone.">
<meta id="og-type" property="og:type" content="article">
<meta id="og-url" property="og:url" content="https://appleseedtravinh.com/page.html">
<meta property="og:site_name" content="Apple Seed Trà Vinh">
<script type="application/ld+json" id="page-schema">{}</script>
<link id="canonical" rel="canonical" href="https://appleseedtravinh.com/page.html">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.dynamic-page{max-width:950px;margin:0 auto;padding:55px 18px 80px}
.dynamic-page h1{font-size:42px;line-height:1.2;margin-bottom:15px}
.dynamic-content{font-size:17px;line-height:1.8;color:#344054}.dynamic-content img{max-width:100%;height:auto;border-radius:12px}.dynamic-content table{width:100%;border-collapse:collapse;margin:18px 0}.dynamic-content td,.dynamic-content th{border:1px solid #d0d5dd;padding:10px}.dynamic-content blockquote{border-left:4px solid #2563eb;background:#eff6ff;padding:10px 16px;margin:18px 0}.dynamic-content pre{background:#111827;color:#fff;padding:14px;border-radius:10px;overflow:auto}.dynamic-video{position:relative;aspect-ratio:16/9;margin:18px 0}.dynamic-video iframe{width:100%;height:100%;border:0;border-radius:12px}
.dynamic-content p{margin:0 0 18px}
.dynamic-back{
  position:fixed;
  right:24px;
  bottom:90px;
  z-index:1000;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 18px;
  margin:0;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(16,24,40,.18);
  white-space:nowrap;
}
@media(max-width:700px){
  .dynamic-back{
    right:16px;
    bottom:82px;
    padding:10px 14px;
    font-size:14px;
  }
}
@media(max-width:700px){.dynamic-page h1{font-size:31px}}
</style>
</head>
<body>
<header class="site-header"><div class="nav">
<a class="brand" href="index.html"><img src="logo.png" alt="Apple Seed Trà Vinh" class="brand-logo"></a>
<nav><a href="index.html#dich-vu">Dịch vụ</a><a href="index.html#san-pham">Sản phẩm</a><a href="index.html#lien-he">Liên hệ</a></nav>
</div></header>
<main class="dynamic-page">
<div id="state">Đang tải...</div>
<article id="content" class="hidden">
<h1 id="title"></h1>
<div id="body" class="dynamic-content"></div>
<a class="dynamic-back btn" href="index.html">← Về Apple Seed</a>
</article>
</main>
<footer>© 2026 Apple Seed Trà Vinh</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(async()=>{
 const slug=new URLSearchParams(location.search).get("slug");
 const state=document.getElementById("state"),article=document.getElementById("content");
 if(!slug){state.textContent="Thiếu slug trang.";return;}
 if(!window.supabaseClient){state.textContent="Không thể kết nối dữ liệu.";return;}
 const {data,error}=await window.supabaseClient.from("pages").select("title,description,content,is_active,slug").eq("slug",slug).eq("is_active",true).maybeSingle();
 if(error||!data){state.textContent="Không tìm thấy trang.";return;}
 const pageUrl=location.origin+location.pathname+"?slug="+encodeURIComponent(data.slug||slug);
 const pageDescription=String(data.description||data.title||"Apple Seed Trà Vinh").replace(/\s+/g," ").trim().slice(0,300);
 document.title=data.title+" | Apple Seed";
 document.getElementById("description").content=pageDescription;
 document.getElementById("canonical").href=pageUrl;
 document.getElementById("og-title").content=data.title+" | Apple Seed";
 document.getElementById("og-description").content=pageDescription;
 document.getElementById("og-url").content=pageUrl;
 document.getElementById("title").textContent=data.title;
 const schema={"@context":"https://schema.org","@type":"Article","mainEntityOfPage":{"@type":"WebPage","@id":pageUrl},"headline":String(data.title||"").slice(0,110),"description":pageDescription,"author":{"@type":"Organization","name":"Apple Seed Trà Vinh","url":"https://appleseedtravinh.com/"},"publisher":{"@type":"Organization","name":"Apple Seed Trà Vinh","logo":{"@type":"ImageObject","url":"https://appleseedtravinh.com/logo.png"}},"articleSection":"Dịch vụ sửa chữa điện thoại Trà Vinh","inLanguage":"vi-VN"};
 document.getElementById("page-schema").textContent=JSON.stringify(schema);
 const body=document.getElementById("body");
 function safeRichHtml(html){
   const tpl=document.createElement("template"); tpl.innerHTML=html||"";
   tpl.content.querySelectorAll("script,object,embed,form,style").forEach(x=>x.remove());
   tpl.content.querySelectorAll("*").forEach(el=>{
     [...el.attributes].forEach(a=>{if(a.name.toLowerCase().startsWith("on") || (a.name.toLowerCase()==="href" && /^javascript:/i.test(a.value)) || (a.name.toLowerCase()==="src" && /^javascript:/i.test(a.value))) el.removeAttribute(a.name);});
   });
   return tpl.innerHTML;
 }
 body.innerHTML=safeRichHtml(data.content||"");
 state.remove();article.classList.remove("hidden");
})();
</script>
</body>
</html>
