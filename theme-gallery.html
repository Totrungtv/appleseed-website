<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Seed — Home Themes</title><link rel="stylesheet" href="home-themes.css"><style>body{margin:0;font-family:system-ui;background:#f5f7fb;color:#17233d}.wrap{max-width:1180px;margin:auto;padding:32px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;overflow:hidden}.preview{height:150px;padding:22px;background:var(--as-theme-bg);color:var(--as-theme-text);position:relative}.preview:before{content:'APPLE SEED';font-size:22px;font-weight:900}.preview:after{content:'Premium Repair • Technology • Trust';position:absolute;left:22px;bottom:24px;color:var(--as-theme-muted)}.meta{padding:16px}.meta b{display:block;font-size:18px}.meta span{display:block;color:#64748b;margin-top:5px}.btn{margin-top:12px;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#1769ff;color:#fff}</style><div class="wrap"><h1>🎨 Apple Seed Home Themes</h1><p>Kho 30 giao diện để xem trước và chọn. Chưa thay đổi trang chủ thật.</p><div class="grid" id="grid"></div></div><script>fetch('home-themes.json').then(r=>r.json()).then(d=>{grid.innerHTML=d.themes.map(t=>'<article class="card"><div class="preview" data-t="'+t.id+'"></div><div class="meta"><b>'+t.name+'</b><span>'+t.group+' · '+t.description+'</span><button class="btn" onclick="preview(\''+t.id+'\')">👁 Xem theme</button></div></article>').join('');document.querySelectorAll('.preview').forEach(x=>{x.style.setProperty('--as-theme-bg','#fff')})});function preview(id){document.documentElement.dataset.appleSeedTheme=id;location.hash=id}</script>
