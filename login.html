<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AppleSeed — Đăng nhập quản trị</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .login-wrap {
            min-height: calc(100vh - 80px);
            display: grid;
            place-items: center;
            padding: 40px 20px;
            background: #f5f7fb;
        }

        .login-card {
            width: min(420px, 100%);
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(23, 32, 51, .08);
        }

        .login-card h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .login-card p {
            color: #667085;
            margin: 0 0 24px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .field input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 13px;
            border: 1px solid #d9dee8;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .field input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            border: 0;
            cursor: pointer;
            background: #2563eb;
            color: #fff;
            padding: 12px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 15px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .msg {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #fff3f2;
            color: #b42318;
            display: none;
            line-height: 1.45;
        }

        .msg.ok {
            background: #ecfdf3;
            color: #067647;
        }

        .back {
            display: inline-block;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="nav">
        <a class="brand" href="index.html">
            <img src="logo.png" alt="Apple Seed" class="brand-logo">
        </a>
    </div>
</header>

<main class="login-wrap">
    <section class="login-card">

        <h1>AppleSeed Admin</h1>

        <p>Đăng nhập để quản lý nội dung website.</p>

        <form id="loginForm">

            <div class="field">
                <label for="email">Email</label>
                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Mật khẩu</label>
                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button id="loginBtn" class="login-btn" type="submit">
                Đăng nhập
            </button>

            <div id="msg" class="msg"></div>

        </form>

        <a class="back" href="index.html">← Về website</a>

    </section>
</main>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- AppleSeed Supabase config -->
<script src="supabase-config.js?v=3"></script>

<script>
(function () {
    "use strict";

    const form = document.getElementById("loginForm");
    const msg = document.getElementById("msg");
    const loginBtn = document.getElementById("loginBtn");

    const MAX_RETRIES = 3;
    const RETRY_DELAY_MS = 1200;

    function showMessage(text, ok = false) {
        msg.textContent = text;
        msg.className = ok ? "msg ok" : "msg";
        msg.style.display = "block";
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function isFetchError(error) {
        const text = String(
            error?.message ||
            error ||
            ""
        ).toLowerCase();

        return (
            text.includes("failed to fetch") ||
            text.includes("networkerror") ||
            text.includes("network error") ||
            text.includes("err_name_not_resolved") ||
            text.includes("fetch")
        );
    }

    async function checkSupabaseConnection() {

        if (!window.SUPABASE_URL) {
            throw new Error(
                "SUPABASE_URL chưa được tải."
            );
        }

        if (!window.SUPABASE_ANON_KEY) {
            throw new Error(
                "SUPABASE_ANON_KEY chưa được tải."
            );
        }

        const url =
            window.SUPABASE_URL +
            "/auth/v1/health";

        console.log(
            "AppleSeed Supabase:",
            window.SUPABASE_URL
        );

        const response = await fetch(url, {
            method: "GET",
            cache: "no-store",
            headers: {
                "apikey": window.SUPABASE_ANON_KEY
            }
        });

        if (
            response.status === 200 ||
            response.status === 401 ||
            response.status === 403
        ) {
            return true;
        }

        throw new Error(
            "Supabase trả HTTP " + response.status
        );
    }

    async function loginWithRetry(email, password) {

        let lastError = null;

        for (
            let attempt = 1;
            attempt <= MAX_RETRIES;
            attempt++
        ) {

            try {

                await checkSupabaseConnection();

                if (!window.supabaseClient) {
                    throw new Error(
                        "Supabase client chưa được tạo."
                    );
                }

                const result =
                    await window.supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (result.error) {
                    throw result.error;
                }

                return result.data;

            } catch (error) {

                lastError = error;

                console.error(
                    "AppleSeed login attempt",
                    attempt,
                    error
                );

                if (
                    !isFetchError(error) ||
                    attempt === MAX_RETRIES
                ) {
                    break;
                }

                showMessage(
                    "Kết nối Supabase chập chờn. Đang thử lại " +
                    attempt +
                    "/" +
                    MAX_RETRIES +
                    "..."
                );

                await sleep(RETRY_DELAY_MS);
            }
        }

        throw lastError;
    }

    form.addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();

            msg.style.display = "none";
            loginBtn.disabled = true;
            loginBtn.textContent =
                "Đang kiểm tra kết nối...";

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;

            try {

                if (!window.supabaseClient) {
                    throw new Error(
                        "Supabase chưa được tải. Kiểm tra supabase-config.js."
                    );
                }

                if (!email || !password) {
                    throw new Error(
                        "Vui lòng nhập email và mật khẩu."
                    );
                }

                loginBtn.textContent =
                    "Đang đăng nhập...";

                const loginData =
                    await loginWithRetry(
                        email,
                        password
                    );

                const user =
                    loginData?.user;

                if (!user) {
                    throw new Error(
                        "Đăng nhập thành công nhưng không lấy được tài khoản."
                    );
                }

                /*
                 * Kiểm tra quyền admin/staff
                 * trong bảng profiles.
                 */

                const profileResult =
                    await window.supabaseClient
                        .from("profiles")
                        .select("role")
                        .eq("id", user.id)
                        .single();

                if (profileResult.error) {
                    throw profileResult.error;
                }

                const role =
                    profileResult.data?.role;

                if (
                    role !== "admin" &&
                    role !== "staff"
                ) {

                    await window.supabaseClient
                        .auth
                        .signOut();

                    throw new Error(
                        "Tài khoản không có quyền quản trị."
                    );
                }

                showMessage(
                    "Đăng nhập thành công. Đang mở trang quản trị...",
                    true
                );

                setTimeout(function () {
                    window.location.replace(
                        "./admin.html?entry=admin&v=20260830"
                    );
                }, 500);

            } catch (err) {

                console.error(
                    "APPLESEED LOGIN ERROR:",
                    err
                );

                const raw =
                    String(
                        err?.message ||
                        err ||
                        ""
                    );

                let friendly =
                    raw ||
                    "Đăng nhập thất bại.";

                if (isFetchError(err)) {

                    friendly =
                        "Không kết nối được tới Supabase. " +
                        "Kiểm tra mạng/DNS rồi thử lại.";

                } else if (
                    raw
                        .toLowerCase()
                        .includes(
                            "invalid login credentials"
                        )
                ) {

                    friendly =
                        "Email hoặc mật khẩu không đúng.";
                }

                showMessage(friendly);

            } finally {

                loginBtn.disabled = false;
                loginBtn.textContent =
                    "Đăng nhập";
            }
        }
    );

})();
</script>

</body>
</html>
