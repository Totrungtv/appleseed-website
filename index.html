<script src="supabase-config.js"></script>
<script>
(function(){
  const sb=window.supabaseClient;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  function safeHtml(html){const t=document.createElement('template');t.innerHTML=html||'';t.content.querySelectorAll('script,object,embed,form,style,link,meta').forEach(x=>x.remove());t.content.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value||'';if(n.startsWith('on')||((n==='href'||n==='src')&&/^\s*javascript:/i.test(v)))el.removeAttribute(a.name)}));return t.innerHTML}
  function cssVars(theme){const root=document.documentElement;root.style.setProperty('--cms-primary',theme.primary_color||'#2563eb');root.style.setProperty('--cms-secondary',theme.secondary_color||'#0f172a');root.style.setProperty('--cms-bg',theme.page_bg||'#f6f8fb');root.style.setProperty('--cms-surface',theme.surface_color||'#fff');root.style.setProperty('--cms-text',theme.text_color||'#111827');root.style.setProperty('--cms-muted',theme.muted_color||'#667085');root.style.setProperty('--cms-radius',(theme.radius_px||16)+'px');root.style.setProperty('--cms-width',(theme.container_width||1180)+'px');root.style.setProperty('--cms-spacing',(theme.section_spacing||64)+'px');root.style.setProperty('--cms-hero',(theme.hero_height||420)+'px');root.style.setProperty('--cms-image-fit',theme.image_default_fit||'cover');document.body.style.background=theme.page_bg||'#f6f8fb';if(theme.font_family&&theme.font_family!=='system')document.body.style.fontFamily=theme.font_family+',system-ui,sans-serif';}
  function sectionIcon(s,theme){if(!s.icon)return '';const cls='home-icon '+(theme.icon_style||'emoji');return `<span class="${cls}">${esc(s.icon)}</span>`}
  function imageHtml(s,theme,hero=false){if(!s.image_url)return '';const fit=s.image_fit||theme.image_default_fit||'cover';return `<img class="home-image ${hero?'home-hero-image':''}" src="${esc(s.image_url)}" alt="${esc(s.image_alt||s.title||'Apple Seed')}" loading="${hero?'eager':'lazy'}" style="object-fit:${esc(fit)}">`}
  function renderBase(s,theme,inner){const bg=s.bg_color||'transparent',color=s.text_color||'';const accent=s.accent_color||theme.primary_color||'#2563eb';const cls='cms-section type-'+esc(s.section_type||'custom')+(s.section_type==='hero'?' cms-hero':'');return `<section id="${esc(s.section_key)}" class="${cls}" style="background:${esc(bg)};color:${esc(color)};--section-accent:${esc(accent)}"><div class="cms-container">${s.eyebrow?`<div class="cms-eyebrow">${esc(s.eyebrow)}</div>`:''}<div class="cms-title-row">${sectionIcon(s,theme)}<div><h2>${esc(s.title||'')}</h2>${s.subtitle?`<p class="cms-subtitle">${esc(s.subtitle)}</p>`:''}</div></div>${inner}${s.button_text?`<a class="cms-btn" href="${esc(s.button_url||'#')}">${esc(s.button_text)}</a>`:''}</div></section>`}
  async function productsHtml(){const {data,error}=await sb.from('products').select('id,name,category,price,description,image_url,is_active').eq('is_active',true).order('id',{ascending:false});if(error)return `<p class="cms-muted">Không tải được sản phẩm.</p>`;if(!data?.length)return `<p class="cms-muted">Hiện chưa có sản phẩm đang bán.</p>`;return `<div class="home-card-grid product-grid-cms">${data.map(p=>`<article class="home-card product-card-cms">${p.image_url?`<img class="home-image product-image-cms" src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:''}<div class="product-category">${esc(p.category||'')}</div><h3>${esc(p.name||'')}</h3>${p.description?`<div>${safeHtml(p.description)}</div>`:''}<strong class="product-price">${Number(p.price||0).toLocaleString('vi-VN')}đ</strong></article>`).join('')}</div>`}
  async function pagesHtml(){const {data,error}=await sb.from('pages').select('id,title,slug,description,is_active').eq('is_active',true).order('id',{ascending:false});if(error||!data?.length)return '';return `<div class="home-card-grid">${data.map(p=>`<a class="home-card page-card-cms" href="page.html?slug=${encodeURIComponent(p.slug)}"><h3>${esc(p.title||'')}</h3><p>${esc(p.description||'Xem thông tin dịch vụ Apple Seed.')}</p><span> Xem trang →</span></a>`).join('')}</div>`}
  async function renderSection(s,theme){let inner='';if(s.section_type==='hero'){inner=`<div class="hero-grid"><div>${s.content_html?`<div class="cms-rich">${safeHtml(s.content_html)}</div>`:''}</div>${imageHtml(s,theme,true)?`<div>${imageHtml(s,theme,true)}</div>`:''}</div>`}else if(s.section_type==='products'){inner=`${s.content_html?`<div class="cms-rich">${safeHtml(s.content_html)}</div>`:''}${await productsHtml()}`}else if(s.section_type==='pages'){inner=`${s.content_html?`<div class="cms-rich">${safeHtml(s.content_html)}</div>`:''}${await pagesHtml()}`}else{inner=`<div class="cms-content-grid ${Number(s.columns||1)>1?'has-cols':''}" style="--cols:${Math.min(4,Math.max(1,Number(s.columns||1)))}">${s.image_url?`<div>${imageHtml(s,theme)}</div>`:''}<div class="cms-rich">${safeHtml(s.content_html||'')}</div></div>`}return renderBase(s,theme,inner)}
  async function load(){if(!sb){document.getElementById('homeRenderer').innerHTML='<div class="container"><p>Chưa kết nối Supabase.</p></div>';return}
    const [themeR,sectionsR,navR]=await Promise.all([sb.from('site_theme_settings').select('*').eq('id',1).maybeSingle(),sb.from('site_home_sections').select('*').eq('is_active',true).order('sort_order',{ascending:true}).order('id',{ascending:true}),sb.from('site_nav_items').select('label,icon,url,is_active,sort_order').eq('is_active',true).order('sort_order',{ascending:true})]);
    const theme=themeR.data||{};cssVars(theme);if(theme.custom_css){const st=document.createElement('style');st.id='cmsCustomCss';st.textContent=theme.custom_css;document.head.appendChild(st)}
    if(theme.meta_title)document.title=theme.meta_title;if(theme.meta_description){let m=document.querySelector('meta[name="description"]');if(m)m.content=theme.meta_description}if(theme.favicon_url){let f=document.querySelector('link[rel="icon"]');if(f)f.href=theme.favicon_url}if(theme.logo_url)document.getElementById('siteLogo').src=theme.logo_url;
    const nav=navR.data||[];document.getElementById('siteNav').innerHTML=nav.map(n=>`<a href="${esc(n.url||'#')}">${esc((n.icon?n.icon+' ':'')+n.label)}</a>`).join('')+'<a class="admin-link" href="admin.html">＋ Quản trị</a>';
    const sections=sectionsR.data||[];if(!sections.length){document.getElementById('homeRenderer').innerHTML='<div class="cms-container"><p>Chưa có nội dung trang chủ.</p></div>';return}let html='';for(const s of sections)html+=await renderSection(s,theme);document.getElementById('homeRenderer').innerHTML=html;
  }
  load().catch(e=>{console.error('Apple Seed Home CMS',e);document.getElementById('homeRenderer').innerHTML='<div class="cms-container"><p>Không tải được nội dung trang chủ.</p></div>'});
})();
</script>
<style>
:root{--cms-primary:#2563eb;--cms-secondary:#0f172a;--cms-bg:#f6f8fb;--cms-surface:#fff;--cms-text:#111827;--cms-muted:#667085;--cms-radius:16px;--cms-width:1180px;--cms-spacing:64px;--cms-hero:420px;--cms-image-fit:cover}
body{background:var(--cms-bg);color:var(--cms-text)}.site-header{background:var(--cms-surface);position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(0,0,0,.06)}.site-header .nav{max-width:var(--cms-width);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 18px}.site-header nav{display:flex;gap:24px;flex-wrap:wrap;align-items:center}.site-header nav a{color:var(--cms-primary);text-decoration:none;font-weight:700}.site-header nav a:hover{text-decoration:underline}.brand-logo{max-height:54px;width:auto}.cms-section{padding:var(--cms-spacing) 18px;background:transparent}.cms-container{width:min(var(--cms-width),100%);margin:auto}.cms-hero{min-height:var(--cms-hero);display:flex;align-items:center}.cms-hero .cms-container{width:min(var(--cms-width),100%)}.cms-eyebrow{font-weight:800;letter-spacing:.08em;color:var(--section-accent);margin-bottom:8px}.cms-title-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}.cms-title-row h2{margin:0;font-size:clamp(28px,4vw,42px);line-height:1.15}.cms-subtitle{margin:8px 0;color:var(--cms-muted);font-size:18px}.home-icon{font-size:30px;line-height:1}.home-icon.circle{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--section-accent) 12%,white);font-size:25px}.home-icon.minimal{font-size:24px;filter:grayscale(.25)}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center}.cms-rich{line-height:1.8;font-size:17px}.cms-rich img{max-width:100%;height:auto;border-radius:var(--cms-radius)}.cms-rich table{width:100%;border-collapse:collapse}.cms-rich th,.cms-rich td{border:1px solid #d0d5dd;padding:9px}.home-image{display:block;width:100%;max-width:100%;height:auto;max-height:560px;border-radius:var(--cms-radius);background:#eef2f7}.home-hero-image{height:var(--cms-hero)}.cms-content-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}.cms-content-grid.has-cols{grid-template-columns:repeat(var(--cols),minmax(0,1fr))}.home-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}.home-card{display:block;text-decoration:none;color:inherit;background:var(--cms-surface);border:1px solid rgba(15,23,42,.08);border-radius:var(--cms-radius);padding:20px;box-shadow:0 6px 22px rgba(15,23,42,.05)}.home-card h3{margin:0 0 8px}.home-card p{color:var(--cms-muted);line-height:1.6}.home-card:hover{transform:translateY(-2px)}.product-card-cms{overflow:hidden}.product-image-cms{height:220px;object-fit:var(--cms-image-fit);margin:-20px -20px 16px;width:calc(100% + 40px);max-width:none}.product-category{font-size:13px;font-weight:800;color:var(--cms-primary)}.product-price{display:block;margin-top:10px;font-size:18px;color:var(--cms-primary)}.page-card-cms span{color:var(--cms-primary);font-weight:800}.cms-btn{display:inline-block;margin-top:22px;padding:12px 18px;background:var(--section-accent);color:#fff;text-decoration:none;border-radius:var(--cms-radius);font-weight:800}.map-wrapper{margin-top:20px;border-radius:var(--cms-radius);overflow:hidden}.map-wrapper iframe{display:block;width:100%;max-width:100%;border:0}#siteFooter{padding:30px 18px;text-align:center;color:var(--cms-muted)}
@media(max-width:800px){.hero-grid,.cms-content-grid.has-cols,.home-card-grid{grid-template-columns:1fr}.site-header .nav{align-items:flex-start;flex-direction:column}.site-header nav{gap:12px}.home-hero-image{height:auto;aspect-ratio:16/9}.cms-section{padding:42px 16px}}
</style>
